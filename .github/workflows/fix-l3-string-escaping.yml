name: Repair L3 String Escaping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-l3-string-escaping.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Repair accidental multiline C++ literals
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/native/src/L3CliWindow.cpp')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'text += L"\nProvider: "': 'text += L"\\r\\nProvider: "',
              'text += L"\nLocal tools: in-process whitelist before model requests";': 'text += L"\\r\\nLocal tools: in-process whitelist before model requests";',
              'text += L"\nDeep workbench: explicit L4 only";': 'text += L"\\r\\nDeep workbench: explicit L4 only";',
              'text += L"\nRoute log: "': 'text += L"\\r\\nRoute log: "',
              '+ L"\n";': '+ L"\\r\\n";'
          }
          changed = 0
          for old, new in replacements.items():
              count = s.count(old)
              if count:
                  s = s.replace(old, new)
                  changed += count
          if changed < 6:
              raise SystemExit(f'Expected at least 6 generated-literal repairs, found {changed}')
          if 'L"\n' in s:
              raise SystemExit('Accidental multiline wide-string literal still present')
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Verify L3 contract
        shell: pwsh
        run: ./scripts/verify-l3-runtime-contract.ps1
      - name: Commit repair
        shell: bash
        run: |
          rm .github/workflows/fix-l3-string-escaping.yml
          git config user.name 'GoodLoongStudio'
          git config user.email 'chnmlong@hotmail.com'
          git add -A
          git commit -m 'fix: repair L3 generated string literals'
          git pull --rebase origin main
          git push origin HEAD:main
