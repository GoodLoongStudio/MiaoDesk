name: Repair Release Doc Contract

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/repair-release-doc-contract.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair release document guard
        shell: python
        run: |
          from pathlib import Path

          p = Path('scripts/verify-l3-runtime-contract.ps1')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "$obsoleteDesignSpecPath = Join-Path $root 'docs/TURINGDESK-DESIGN-SPEC.md'\n",
              "$designSpecPath = Join-Path $root 'docs/TURINGDESK-DESIGN-SPEC.md'\n$sceneScopePath = Join-Path $root 'docs/V1-SCENE-RELEASE-SCOPE.md'\n$workbenchPlanPath = Join-Path $root 'docs/AI-WORKBENCH-CONSOLIDATION-PLAN.md'\n$legacyCleanupPath = Join-Path $root 'docs/LEGACY-REDUNDANCY-CLEANUP-PLAN.md'\n",
              1)

          old_required = "$deployCmdPath, $deployPs1Path, $productBaselinePath, $nativeBaselinePath,\n    $contractDocPath, $readmePath"
          new_required = "$deployCmdPath, $deployPs1Path, $productBaselinePath, $nativeBaselinePath,\n    $contractDocPath, $readmePath, $designSpecPath, $sceneScopePath, $workbenchPlanPath, $legacyCleanupPath"
          if old_required not in s:
              raise SystemExit('requiredFiles anchor not found')
          s = s.replace(old_required, new_required, 1)

          old_forbidden = "foreach ($path in @(\n    $obsoleteDesignSpecPath,\n    $retiredRuntimeHeaderPath,"
          new_forbidden = "foreach ($path in @(\n    $retiredRuntimeHeaderPath,"
          if old_forbidden not in s:
              raise SystemExit('forbidden artifact anchor not found')
          s = s.replace(old_forbidden, new_forbidden, 1)

          p.write_text(s, encoding='utf-8', newline='\n')

          Path('.github/workflows/repair-release-doc-contract.yml').unlink()

      - name: Verify contract parser
        shell: pwsh
        run: ./scripts/verify-l3-runtime-contract.ps1

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'GoodLoongStudio'
          git config user.email 'chnmlong@hotmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'ci: require release acceptance documents'
          git push origin HEAD:main
