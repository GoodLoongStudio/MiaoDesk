name: Fix unknown Scene apply fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-unknown-scene-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Reject unknown Scene items instead of silently applying Aurora
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/native/src/WallpaperEngine.cpp')
          text = path.read_text(encoding='utf-8')

          old = '''        if (item.kind == Kind::Scene) {\n            if (_wcsicmp(item.id.c_str(), L"scene-neon") == 0) next.scene = L"neon";\n            else if (_wcsicmp(item.id.c_str(), L"scene-grid") == 0) next.scene = L"grid";\n            else next.scene = L"aurora";\n            return true;\n        }\n'''
          new = '''        if (item.kind == Kind::Scene) {\n            if (_wcsicmp(item.id.c_str(), L"scene-aurora") == 0) next.scene = L"aurora";\n            else if (_wcsicmp(item.id.c_str(), L"scene-neon") == 0) next.scene = L"neon";\n            else if (_wcsicmp(item.id.c_str(), L"scene-grid") == 0) next.scene = L"grid";\n            else return false;\n            return true;\n        }\n'''
          if old not in text:
              raise SystemExit('Scene apply anchor missing')
          text = text.replace(old, new, 1)

          old = '''            if (!ApplyWallpaperItemToConfig(next, item)) return;\n            ApplyConfig(next);\n'''
          new = '''            if (!ApplyWallpaperItemToConfig(next, item)) {\n                libraryError_ = item.kind == Kind::Scene\n                    ? L"该 Scene 尚没有可用的运行时 Renderer，未修改当前桌面。"\n                    : L"该壁纸类型当前不可运行。";\n                RefreshSettings();\n                return;\n            }\n            ApplyConfig(next);\n'''
          if old not in text:
              raise SystemExit('Library apply anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit repair directly to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/fix-unknown-scene-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/src/WallpaperEngine.cpp .github/workflows/fix-unknown-scene-fallback.yml
          git commit -m "fix: reject unsupported Scene items explicitly"
          git push origin HEAD:main
