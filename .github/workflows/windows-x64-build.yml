name: Windows x64 Build

on:
  push:
    branches: [main]
    paths:
      - src/**
      - CMakeLists.txt
      - CMakePresets.json
      - assets/app/**
      - assets/widgets/**
      - config/**
      - packaging/windows/verify-widget-visibility.ps1
      - third_party/webview2/**
      - scripts/generate-miaomiao-icon.ps1
      - scripts/verify-path-layout-contract.ps1
      - .github/workflows/windows-x64-build.yml
  pull_request:
    paths:
      - src/**
      - CMakeLists.txt
      - CMakePresets.json
      - assets/app/**
      - assets/widgets/**
      - config/**
      - packaging/windows/verify-widget-visibility.ps1
      - third_party/webview2/**
      - scripts/generate-miaomiao-icon.ps1
      - scripts/verify-path-layout-contract.ps1
      - .github/workflows/windows-x64-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      MIAODESK_BUILD_ROOT: C:\b\MiaoDesk\quick-x64
      MIAODESK_STAGE_ROOT: C:\b\MiaoDesk\quick-stage-x64

    steps:
      - uses: actions/checkout@v5

      - name: Generate MiaoMiao app icon
        shell: pwsh
        run: .\scripts\generate-miaomiao-icon.ps1

      - name: Verify path layout
        shell: pwsh
        run: .\scripts\verify-path-layout-contract.ps1

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item $env:MIAODESK_BUILD_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $env:MIAODESK_STAGE_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Split-Path $env:MIAODESK_BUILD_ROOT -Parent) | Out-Null
          cmake -S . -B $env:MIAODESK_BUILD_ROOT -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

      - name: Build
        shell: pwsh
        run: |
          $log = & cmake --build $env:MIAODESK_BUILD_ROOT --config Release --target MiaoDesk MiaoDeskWallpaper MiaoDeskHarness MiaoDeskContentWebReplacementTest MiaoDeskContentSkillLoadingTest MiaoDeskMediaPackageTest MiaoDeskInputBusCoreTest MiaoDeskInputBusPublisherTest MiaoDeskAudioIngressTest MiaoDeskBindingResponseTest MiaoDeskSceneRuntimeTest MiaoDeskSceneSpatial3DTest --parallel 2>&1
          $log | ForEach-Object { "$_" } | Write-Host
          if ($LASTEXITCODE -ne 0) {
            # Surface compile errors as check annotations so they are readable
            # without an authenticated log download.
            $log | ForEach-Object { "$_" } | Where-Object { $_ -match '(error C\d+|error LNK\d+|fatal error|error MSB\d+|CMake Error)' } |
              Select-Object -First 40 | ForEach-Object {
                $line = $_.Trim()
                if ($line.Length -gt 500) { $line = $line.Substring(0, 500) }
                Write-Host "::error::$line"
              }
            throw 'x64 build failed.'
          }

      - name: Verify web audio bridge shim
        shell: pwsh
        run: |
          node --version
          & node tests/WebAudioBridge.mjs
          if ($LASTEXITCODE -ne 0) { throw 'web audio bridge shim gate failed.' }

      - name: Verify web audio bridge has not drifted
        shell: pwsh
        run: |
          .\scripts\verify-web-audio-bridge.ps1
          if ($LASTEXITCODE -ne 0) { throw 'embedded web audio bridge differs from its source of truth.' }

      - name: Verify Content web replacement continuity
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskContentWebReplacementTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Content web replacement continuity test executable was not found.' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Content web replacement continuity regression failed.' }

      - name: Verify content skill loading gate
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskContentSkillLoadingTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Content skill loading test executable was not found.' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw 'content_skill_get allowlist/path gate failed.' }

      - name: Verify media wallpaper package gate
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskMediaPackageTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Media wallpaper package test executable was not found.' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw 'media wallpaper package type/entry gate failed.' }

      - name: Verify Scene input bus core
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskInputBusCoreTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Scene input bus core test executable was not found.' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Scene input bus channel contract / analysis gate failed.' }

      - name: Verify Scene input bus publisher
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskInputBusPublisherTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Scene input bus publisher test executable was not found.' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Scene input bus publisher gate failed.' }

      - name: Verify audio ingress conversion
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskAudioIngressTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Audio ingress test executable was not found.' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw 'audio downmix/resample/window gate failed.' }

      - name: Verify binding response curves
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskBindingResponseTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Binding response test executable was not found.' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw 'binding response curve gate failed.' }

      - name: Verify scene runtime binding end to end
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskSceneRuntimeTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Scene runtime test executable was not found.' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw 'binding response round-trip / backward-compat gate failed.' }

      - name: Verify 3D scene spatial mode, lights and fog
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskSceneSpatial3DTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw '3D scene test executable was not found.' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw '3D scene spatial/light/fog gate failed.' }

      - name: Verify Widget lifecycle in quick-build layout
        shell: pwsh
        run: |
          $wallpaper = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskWallpaper.exe -File -Recurse |
            Select-Object -First 1
          if (-not $wallpaper) { throw 'Built MiaoDeskWallpaper.exe was not found.' }
          .\packaging\windows\verify-widget-visibility.ps1 -ProductRoot $wallpaper.DirectoryName

      - name: Install staged product with built-in content
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install $env:MIAODESK_BUILD_ROOT --config Release --prefix $env:MIAODESK_STAGE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'cmake --install failed.' }
          foreach ($relative in @(
            'Widgets\GlassClock.mdwidget\manifest.json',
            'Widgets\GlassClock.mdwidget\scene.json',
            'Widgets\GlassClock.mdwidget\parameters.json'
          )) {
            if (-not (Test-Path (Join-Path $env:MIAODESK_STAGE_ROOT $relative) -PathType Leaf)) {
              throw "Staged built-in widget package file is missing: $relative"
            }
          }

      - name: Verify staged GlassClock Content Framework route
        shell: pwsh
        run: .\packaging\windows\verify-widget-visibility.ps1 -ProductRoot $env:MIAODESK_STAGE_ROOT

      - name: Verify login startup stays hidden
        shell: pwsh
        run: |
          $app = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDesk.exe -File -Recurse |
            Select-Object -First 1
          if (-not $app) { throw 'Built MiaoDesk.exe was not found.' }
          .\packaging\windows\verify-login-startup.ps1 -ProductRoot $app.DirectoryName
