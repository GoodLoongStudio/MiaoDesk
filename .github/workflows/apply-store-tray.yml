name: Apply packaged tray icon

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-store-tray.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch tray icon loading
        run: python .github/patch-store-tray.py
      - name: Verify patch
        run: |
          git diff --check
          grep -n "LoadMiaoMiaoTrayIcon" src/native/src/ui/search/SearchWindow.cpp
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/src/ui/search/SearchWindow.cpp
          git commit -m "Use packaged 妙喵 tray icon"
          git push origin HEAD:main
