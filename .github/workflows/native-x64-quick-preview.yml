name: Native x64 Quick Preview

on:
  push:
    branches: [main]
    paths:
      - src/native/**
      - packaging/windows-store/assets/MiaoMiao.ico
      - .github/workflows/native-x64-quick-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-x64-quick-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Configure x64 quick preview
        shell: pwsh
        run: cmake -S . -B build-x64-preview -A x64 -DMIAODESK_DEV_FAST=ON

      - name: Build runnable x64 executables
        shell: pwsh
        run: cmake --build build-x64-preview --config Release --target MiaoDesk MiaoDeskWallpaper MiaoDeskHarness --parallel

      - name: Run native self-tests
        shell: pwsh
        run: |
          $release = Join-Path $PWD 'build-x64-preview\src\native\Release'
          foreach ($exe in @('MiaoDesk.exe', 'MiaoDeskWallpaper.exe', 'MiaoDeskHarness.exe')) {
            $path = Join-Path $release $exe
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing x64 executable: $exe" }
            $p = Start-Process -FilePath $path -ArgumentList '--self-test' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$exe self-test failed: $($p.ExitCode)" }
          }

      - name: Stage portable x64 preview
        shell: pwsh
        run: |
          $release = Join-Path $PWD 'build-x64-preview\src\native\Release'
          $out = Join-Path $PWD 'MiaoDesk-x64-preview'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item (Join-Path $release 'MiaoDesk.exe') $out -Force
          Copy-Item (Join-Path $release 'MiaoDeskWallpaper.exe') $out -Force
          Copy-Item (Join-Path $release 'MiaoDeskHarness.exe') $out -Force
          if (Test-Path (Join-Path $release 'Assets')) {
            Copy-Item (Join-Path $release 'Assets') $out -Recurse -Force
          }
          Set-Content -Path (Join-Path $out 'START-MIAODESK.cmd') -Encoding ASCII -Value @(
            '@echo off'
            'cd /d "%~dp0"'
            'start "" MiaoDesk.exe'
          )
          Set-Content -Path (Join-Path $out 'README.txt') -Encoding UTF8 -Value @(
            'MiaoDesk x64 quick preview'
            "Commit: $env:GITHUB_SHA"
            ''
            'Run START-MIAODESK.cmd or MiaoDesk.exe.'
            'This quick package contains the native x64 executables only.'
            'AI Node/Pi/DeepSeek offline runtimes are not included in this quick preview.'
            'WebView2Loader is statically linked; Windows still needs the Microsoft Edge WebView2 Runtime installed.'
          )

      - name: Upload runnable x64 preview
        uses: actions/upload-artifact@v4
        with:
          name: MiaoDesk-x64-preview-${{ github.sha }}
          path: MiaoDesk-x64-preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
