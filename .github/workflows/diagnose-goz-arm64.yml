name: Diagnose ARM64 File Search

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-goz-arm64.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Download exact ARM64 package under test
        uses: actions/download-artifact@v4
        with:
          name: MiaoDesk-windows-arm64-8c72c1cfd61c0800f4ca2997b492296381b41ff4
          path: C:/diag/MiaoDesk
          github-token: ${{ github.token }}
          repository: GoodLoongStudio/MiaoDesk
          run-id: 34436234482

      - name: Exercise goz service and real filename query
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\diag\MiaoDesk'
          $goz = Join-Path $root 'Goz\goz.exe'
          $gozd = Join-Path $root 'Goz\gozd.exe'
          if (-not (Test-Path $goz -PathType Leaf)) { throw "Missing goz.exe: $goz" }
          if (-not (Test-Path $gozd -PathType Leaf)) { throw "Missing gozd.exe: $gozd" }

          $needle = 'miaodesk-goz-live-smoke-6f72e91b.txt'
          $testFile = Join-Path $env:PUBLIC $needle
          Set-Content -LiteralPath $testFile -Value 'MiaoDesk ARM64 goz live-search smoke test' -Encoding UTF8

          try {
            & $gozd uninstall 2>$null | Out-Host
            & $gozd install | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "gozd install failed: $LASTEXITCODE" }

            $statusReady = $false
            for ($i = 0; $i -lt 60; $i++) {
              $status = @(& $goz --status 2>&1)
              if ($LASTEXITCODE -eq 0) {
                $status | Out-Host
                $statusReady = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $statusReady) { throw 'goz --status never became ready.' }

            $found = $false
            for ($i = 0; $i -lt 90; $i++) {
              $results = @(& $goz -n 20 $needle 2>&1)
              $exit = $LASTEXITCODE
              if ($exit -eq 0) {
                $results | ForEach-Object { Write-Host "QUERY: $_" }
                if ($results | Where-Object { "$_" -ieq $testFile }) {
                  $found = $true
                  break
                }
              } else {
                Write-Host "goz query exit=$exit output=$($results -join ' | ')"
              }
              Start-Sleep -Seconds 1
            }
            if (-not $found) {
              & $goz --status | Out-Host
              throw "goz service was reachable but did not return the real test file: $testFile"
            }

            Write-Host "REAL GOZ SEARCH PASSED: $testFile" -ForegroundColor Green
          } finally {
            Remove-Item -LiteralPath $testFile -Force -ErrorAction SilentlyContinue
            & $gozd uninstall 2>$null | Out-Host
          }
