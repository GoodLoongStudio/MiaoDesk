                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'D3D11 renderer self-test gate failed.'
          }

      - name: Verify the two render backends agree on which sprites are drawable
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskSpriteMaterialPolicyTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Sprite material policy test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
