name: No Conflict Markers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-conflict-markers-${{ github.ref }}
  cancel-in-progress: true

# 与构建类工作流无关:这个闸门只读仓库文本,几秒就能跑完,不需要 Windows 镜像,
# 也不需要任何构建产物。独立存在的意义是——"合并冲突标记漏进仓库"这个错误在
# 2026-09-22 干掉了三个打包工作流,而它不该被"构建能不能过"这种条件挡住。
#
# 用 ubuntu-latest + shell: bash:只读文本,不需要 Windows;显式指定 shell 是为了
# 不依赖某个 runner 镜像的默认 shell。
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5

      - name: Verify no unresolved merge conflict markers
        shell: bash
        run: bash scripts/verify-no-conflict-markers.sh
