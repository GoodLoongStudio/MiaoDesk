name: Fix native widget DPI and title repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-native-widget-dpi-title.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch DPI units and native title recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Direct2D draw coordinates are DIPs. GetPixelSize() returns physical
          # pixels, which over-scales layout on 150%/200% ARM64 displays and
          # pushes the clock text outside the HWND. Use GetSize() (DIPs).
          host = Path('src/native/src/desktop/widgets/NativeWidgetHost.cpp')
          text = host.read_text(encoding='utf-8')
          old = '''        context.width = static_cast<float>(slot.target->GetPixelSize().width);\n        context.height = static_cast<float>(slot.target->GetPixelSize().height);\n'''
          new = '''        const D2D1_SIZE_F dipSize = slot.target->GetSize();\n        context.width = std::max(1.0f, dipSize.width);\n        context.height = std::max(1.0f, dipSize.height);\n'''
          if text.count(old) != 1:
              raise SystemExit('NativeWidgetHost DPI anchor mismatch')
          text = text.replace(old, new, 1)
          host.write_text(text, encoding='utf-8')

          # Repair already-corrupted native titles even when widgets.ini has
          # already been migrated to UTF-16. Native preset source is canonical.
          store = Path('src/native/src/desktop/widgets/DesktopWidgetStore.cpp')
          text = store.read_text(encoding='utf-8')

          old = '''    const bool legacyAnsi = !HasUtf16LeBom(manifest);\n    bool repairedLegacyText = false;\n'''
          new = '''    const bool legacyAnsi = !HasUtf16LeBom(manifest);\n    bool repairedText = false;\n'''
          if text.count(old) != 1:
              raise SystemExit('DesktopWidgetStore repair flag anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''        widget.managedSource = ReadInt(manifest, section, L"ManagedSource", 0) != 0;\n        if (legacyAnsi && widget.managedSource && IsLostLegacyTitle(widget.title)) {\n            widget.title = LooksLikeClockWidget(widget.source) ? L"桌面时钟" : L"桌面小组件";\n            repairedLegacyText = true;\n        }\n'''
          new = '''        widget.managedSource = ReadInt(manifest, section, L"ManagedSource", 0) != 0;\n\n        NativeWidgetPreset nativePreset{};\n        if (widget.kind == DesktopWidgetKind::Native &&\n            ParseNativePreset(widget.source.wstring(), &nativePreset) &&\n            IsLostLegacyTitle(widget.title)) {\n            widget.title = NativePresetTitle(nativePreset);\n            repairedText = true;\n        } else if (legacyAnsi && widget.managedSource && IsLostLegacyTitle(widget.title)) {\n            widget.title = LooksLikeClockWidget(widget.source) ? L"桌面时钟" : L"桌面小组件";\n            repairedText = true;\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit('DesktopWidgetStore title repair anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    if (legacyAnsi) {\n        std::wstring migrationError;\n        if (!Save(&migrationError)) {\n            if (error) *error = migrationError.empty() ? L"Unable to migrate desktop widget storage to Unicode." : migrationError;\n            return false;\n        }\n        (void)repairedLegacyText;\n    }\n'''
          new = '''    if (legacyAnsi || repairedText) {\n        std::wstring migrationError;\n        if (!Save(&migrationError)) {\n            if (error) *error = migrationError.empty() ? L"Unable to repair desktop widget storage." : migrationError;\n            return false;\n        }\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit('DesktopWidgetStore save repair anchor mismatch')
          text = text.replace(old, new, 1)
          store.write_text(text, encoding='utf-8')
          PY
      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          grep -F 'const D2D1_SIZE_F dipSize = slot.target->GetSize();' src/native/src/desktop/widgets/NativeWidgetHost.cpp
          grep -F 'if (legacyAnsi || repairedText)' src/native/src/desktop/widgets/DesktopWidgetStore.cpp
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "GoodLoongStudio"
          git config user.email "chnmlong@hotmail.com"
          git add src/native/src/desktop/widgets/NativeWidgetHost.cpp src/native/src/desktop/widgets/DesktopWidgetStore.cpp
          git commit -m "Fix native widget high-DPI clipping and Chinese titles"
          git push origin HEAD:main
