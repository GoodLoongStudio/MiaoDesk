name: Input IME Contract

on:
  push:
    branches: [main]
    paths:
      - src/native/include/miaodesk/InputImeAnchor.h
      - src/native/include/miaodesk/SearchWindow.h
      - src/native/src/ui/search/**
      - src/native/src/ui/ai/ConversationPanel.cpp
      - src/native/src/ui/ai/ConversationPanelInputOverlay.inc
      - scripts/verify-input-ime-contract.ps1
      - scripts/verify-search-input-contract.ps1
      - .github/workflows/input-ime-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  input-ime-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Verify shared Input IME framework
        shell: powershell
        run: .\scripts\verify-input-ime-contract.ps1

      - name: Verify Search input profile
        shell: powershell
        run: .\scripts\verify-search-input-contract.ps1
