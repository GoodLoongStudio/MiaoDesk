name: Windows x64 Build

on:
  push:
    branches: [main]
    paths:
      - src/**
      - CMakeLists.txt
      - CMakePresets.json
      - assets/app/**
      - assets/widgets/**
      - config/**
      - packaging/windows/verify-widget-visibility.ps1
      - third_party/webview2/**
      - scripts/generate-miaomiao-icon.ps1
      - scripts/verify-path-layout-contract.ps1
      - .github/workflows/windows-x64-build.yml
  pull_request:
    paths:
      - src/**
      - CMakeLists.txt
      - CMakePresets.json
      - assets/app/**
      - assets/widgets/**
      - config/**
      - packaging/windows/verify-widget-visibility.ps1
      - third_party/webview2/**
      - scripts/generate-miaomiao-icon.ps1
      - scripts/verify-path-layout-contract.ps1
      - .github/workflows/windows-x64-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      MIAODESK_BUILD_ROOT: C:\b\MiaoDesk\quick-x64
      MIAODESK_STAGE_ROOT: C:\b\MiaoDesk\quick-stage-x64

    steps:
      - uses: actions/checkout@v5

      - name: Generate MiaoMiao app icon
        shell: pwsh
        run: .\scripts\generate-miaomiao-icon.ps1

      - name: Verify path layout
        shell: pwsh
        run: .\scripts\verify-path-layout-contract.ps1

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item $env:MIAODESK_BUILD_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $env:MIAODESK_STAGE_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Split-Path $env:MIAODESK_BUILD_ROOT -Parent) | Out-Null
          cmake -S . -B $env:MIAODESK_BUILD_ROOT -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

      - name: Build
        shell: pwsh
        run: |
          $log = & cmake --build $env:MIAODESK_BUILD_ROOT --config Release --target MiaoDesk MiaoDeskWallpaper MiaoDeskHarness MiaoDeskContentWebReplacementTest --parallel 2>&1
          $log | ForEach-Object { "$_" } | Write-Host
          if ($LASTEXITCODE -ne 0) {
            # Surface compile errors as check annotations so they are readable
            # without an authenticated log download.
            $log | ForEach-Object { "$_" } | Where-Object { $_ -match '(error C\d+|error LNK\d+|fatal error|error MSB\d+|CMake Error)' } |
              Select-Object -First 40 | ForEach-Object {
                $line = $_.Trim()
                if ($line.Length -gt 500) { $line = $line.Substring(0, 500) }
                Write-Host "::error::$line"
              }
            throw 'x64 build failed.'
          }

      - name: Verify Content web replacement continuity
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskContentWebReplacementTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Content web replacement continuity test executable was not found.' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Content web replacement continuity regression failed.' }

      - name: Reset wallpaper runtime before Widget lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process MiaoDeskWallpaper -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $deadline = [DateTime]::UtcNow.AddSeconds(5)
          do {
            Start-Sleep -Milliseconds 100
            $alive = @(Get-Process MiaoDeskWallpaper -ErrorAction SilentlyContinue).Count
            if ($alive -eq 0) { break }
          } while ([DateTime]::UtcNow -lt $deadline)
          if ($alive -ne 0) {
            throw 'MiaoDeskWallpaper process family did not stop before quick-build Widget lifecycle.'
          }

      - name: Verify Widget lifecycle in quick-build layout
        shell: pwsh
        run: |
          $wallpaper = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskWallpaper.exe -File -Recurse |
            Select-Object -First 1
          if (-not $wallpaper) { throw 'Built MiaoDeskWallpaper.exe was not found.' }
          .\packaging\windows\verify-widget-visibility.ps1 -ProductRoot $wallpaper.DirectoryName

      - name: Install staged product with built-in content
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install $env:MIAODESK_BUILD_ROOT --config Release --prefix $env:MIAODESK_STAGE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'cmake --install failed.' }
          foreach ($relative in @(
            'Widgets\GlassClock.mdwidget\manifest.json',
            'Widgets\GlassClock.mdwidget\scene.json',
            'Widgets\GlassClock.mdwidget\parameters.json'
          )) {
            if (-not (Test-Path (Join-Path $env:MIAODESK_STAGE_ROOT $relative) -PathType Leaf)) {
              throw "Staged built-in widget package file is missing: $relative"
            }
          }

      - name: Verify Content widget install-create-remove-uninstall service lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskContentWebReplacementTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Content lifecycle test executable was not found.' }
          $stagedTest = Join-Path $env:MIAODESK_STAGE_ROOT 'MiaoDeskContentWebReplacementTest.exe'
          Copy-Item $test.FullName $stagedTest -Force
          $package = Join-Path $env:MIAODESK_STAGE_ROOT 'Widgets\GlassClock.mdwidget'
          if (-not (Test-Path $package -PathType Container)) { throw "Content lifecycle package is missing: $package" }

          function Stop-MiaoDeskWallpaperFamily {
            Get-Process MiaoDeskWallpaper -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            $deadline = [DateTime]::UtcNow.AddSeconds(5)
            do {
              Start-Sleep -Milliseconds 100
              $alive = @(Get-Process MiaoDeskWallpaper -ErrorAction SilentlyContinue).Count
              if ($alive -eq 0) { return }
            } while ([DateTime]::UtcNow -lt $deadline)
            throw 'MiaoDeskWallpaper process family did not stop before isolated Content lifecycle test.'
          }

          $previousLocalAppData = $env:LOCALAPPDATA
          $stateBase = Join-Path $env:RUNNER_TEMP 'MiaoDesk-content-widget-service-lifecycle'
          try {
            # The previous quick-build smoke starts the same executable family.
            # Wait for every coordinator/helper process to be gone before changing
            # LOCALAPPDATA, otherwise named mutex/window state from the old store can
            # race the isolated service test and make EnsureRuntime target stale helpers.
            Stop-MiaoDeskWallpaperFamily
            Remove-Item $stateBase -Recurse -Force -ErrorAction SilentlyContinue
            $env:LOCALAPPDATA = Join-Path $stateBase 'LocalAppData'
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
            # DesktopControlService resolves the runtime as a sibling of the current
            # module, matching the installed product layout. Run the lifecycle test
            # from the staged product root so EnsureRuntime exercises that contract.
            & $stagedTest $package
            if ($LASTEXITCODE -ne 0) {
              $wallpaperIni = Join-Path $env:LOCALAPPDATA 'MiaoDesk\wallpaper.ini'
              if (Test-Path $wallpaperIni -PathType Leaf) {
                Write-Host 'Content lifecycle wallpaper diagnostics:' -ForegroundColor Yellow
                Get-Content $wallpaperIni | Out-Host
              }
              $debugLog = Join-Path ([Environment]::GetFolderPath('Desktop')) 'MiaoDesk-Logs\desktop-debug.log'
              if (Test-Path $debugLog -PathType Leaf) {
                Write-Host 'Content lifecycle desktop-debug.log tail:' -ForegroundColor Yellow
                Get-Content $debugLog -Encoding UTF8 | Select-Object -Last 80 | Out-Host
              }
              throw "Content widget service lifecycle regression failed with exit code $LASTEXITCODE."
            }
          } finally {
            Stop-MiaoDeskWallpaperFamily
            $env:LOCALAPPDATA = $previousLocalAppData
            Remove-Item $stateBase -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $stagedTest -Force -ErrorAction SilentlyContinue
          }

      - name: Verify staged GlassClock Content Framework route
        shell: pwsh
        run: .\packaging\windows\verify-widget-visibility.ps1 -ProductRoot $env:MIAODESK_STAGE_ROOT

      - name: Verify login startup stays hidden
        shell: pwsh
        run: |
          $app = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDesk.exe -File -Recurse |
            Select-Object -First 1
          if (-not $app) { throw 'Built MiaoDesk.exe was not found.' }
          .\packaging\windows\verify-login-startup.ps1 -ProductRoot $app.DirectoryName
