name: Apply Codex Reconnect Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-codex-reconnect-diagnostics.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Codex reconnect handling
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/native/src/CodexRuntime.cpp')
          s = p.read_text(encoding='utf-8')
          marker = 'app-server: transient reconnect notification:'
          if marker not in s:
              start = s.find('        if (method == "error") {')
              end = s.find('        if (method == "turn/completed") {', start)
              if start < 0 or end < 0:
                  raise SystemExit('Could not locate Codex error/turn-completed block')
              replacement = '''        if (method == "error") {
            const auto message = ExtractJsonString(line, "\\\"message\\\"");
            const std::wstring notification = message.empty() ? L"Codex app-server 返回 error 通知" : Utf8ToWide(message);
            if (notification.starts_with(L"Reconnecting...")) {
                bool relayAlive = true;
                DWORD relayExitCode = STILL_ACTIVE;
                std::wstring relayState = L"; relay=not-required";
                if (setup.relayRequired) {
                    std::scoped_lock lock(processMutex_);
                    relayAlive = ProcessAlive(relayProcess_);
                    if (relayProcess_ && !relayAlive) GetExitCodeProcess(relayProcess_, &relayExitCode);
                    relayState = relayAlive ? L"; relay=alive" : L"; relay=exited code=" + std::to_wstring(relayExitCode);
                }
                AppendRuntimeLog(L"app-server: transient reconnect notification: " + notification + relayState);
                if (relayAlive) continue;
                error = L"Codex Relay 已退出，ExitCode=" + std::to_wstring(relayExitCode) + L"；" + notification;
                break;
            }
            error = notification;
            AppendRuntimeLog(L"app-server: error notification: " + error);
            break;
        }
'''
              s = s[:start] + replacement + s[end:]
              p.write_text(s, encoding='utf-8', newline='\n')

          Path('.github/workflows/apply-codex-reconnect-diagnostics.yml').unlink()

      - name: Sanity check patch
        shell: bash
        run: |
          grep -F 'notification.starts_with(L"Reconnecting...")' src/native/src/CodexRuntime.cpp
          grep -F 'app-server: transient reconnect notification:' src/native/src/CodexRuntime.cpp
          grep -F 'relay=exited code=' src/native/src/CodexRuntime.cpp

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'GoodLoongStudio'
          git config user.email 'chnmlong@hotmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve Codex retries and log relay state'
          git pull --rebase origin main
          git push origin HEAD:main
