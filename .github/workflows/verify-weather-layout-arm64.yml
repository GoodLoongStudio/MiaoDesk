name: Verify weather layout ARM64

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-weather-layout-arm64.yml

permissions:
  contents: read

jobs:
  preview-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Configure ARM64 preview
        shell: pwsh
        run: cmake -S . -B build-preview-arm64 -A ARM64 -DTURINGDESK_DEV_FAST=ON
      - name: Build ARM64 UI binaries
        shell: pwsh
        run: cmake --build build-preview-arm64 --config Release --target TuringDesk TuringDeskWallpaper TuringDeskHarness --parallel
      - name: Prepare ARM64 preview
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'build-preview-arm64\src\native\Release'
          $dest = Join-Path $PWD 'preview-arm64'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($exe in @('TuringDesk.exe', 'TuringDeskWallpaper.exe', 'TuringDeskHarness.exe')) {
            $path = Join-Path $source $exe
            if (-not (Test-Path $path -PathType Leaf)) { throw "Preview build is missing $exe" }
            Copy-Item $path $dest -Force
          }
          Get-ChildItem $source -Filter '*.dll' -File -ErrorAction SilentlyContinue | Copy-Item -Destination $dest -Force
          Set-Content -Path (Join-Path $dest 'preview-build-sha.txt') -Value $env:GITHUB_SHA -Encoding ASCII
      - name: Build ARM64 MSIX
        shell: pwsh
        run: |
          & "$PWD\scripts\build-arm64-msix.ps1" `
            -InputDirectory "$PWD\preview-arm64" `
            -OutputPath "$PWD\miaomiao-arm64.msix" `
            -Version '0.1.0.0'
      - name: Upload ARM64 preview
        uses: actions/upload-artifact@v4
        with:
          name: turingdesk-weather-layout-arm64-${{ github.sha }}
          path: preview-arm64/
          retention-days: 7
      - name: Upload ARM64 MSIX
        uses: actions/upload-artifact@v4
        with:
          name: miaomiao-weather-layout-arm64-msix-${{ github.sha }}
          path: miaomiao-arm64.msix
          retention-days: 7
