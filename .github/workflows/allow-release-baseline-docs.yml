name: Keep release acceptance docs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/allow-release-baseline-docs.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove stale-doc deletion guard
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/verify-l3-runtime-contract.ps1')
          s = p.read_text(encoding='utf-8')
          for line in [
              "$obsoletePlanPath = Join-Path $root 'docs/AI-WORKBENCH-CONSOLIDATION-PLAN.md'\n",
              "$obsoleteDesignSpecPath = Join-Path $root 'docs/TURINGDESK-DESIGN-SPEC.md'\n",
          ]:
              assert line in s, f'missing guard declaration: {line}'
              s = s.replace(line, '', 1)
          old = '''foreach ($path in @(\n    $obsoletePlanPath,\n    $obsoleteDesignSpecPath,\n    $retiredRuntimeHeaderPath,\n    $retiredRuntimeV1Path,\n    $retiredRuntimeV2Path,\n    $retiredRuntimeStubPath\n)) {'''
          new = '''foreach ($path in @(\n    $retiredRuntimeHeaderPath,\n    $retiredRuntimeV1Path,\n    $retiredRuntimeV2Path,\n    $retiredRuntimeStubPath\n)) {'''
          assert old in s, 'forbidden artifact array changed'
          s = s.replace(old, new, 1)
          assert 'obsoletePlanPath' not in s and 'obsoleteDesignSpecPath' not in s
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Commit guard repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/allow-release-baseline-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-l3-runtime-contract.ps1 .github/workflows/allow-release-baseline-docs.yml
          git commit -m "fix: preserve release acceptance docs in L3 guard"
          git push origin HEAD:main
