name: Repair ordinary L3 native runtime boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-l3-native-boundary.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore TuringDesk-owned L3 routing
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/native/src/L3CliWindow.cpp')
          s = p.read_text(encoding='utf-8')

          required = [
              '#include "turingdesk/CodexRuntime.h"\n',
              '    Codex,\n',
              '    CodexRuntime* codex{};\n',
              'CodexRuntime gCodexRuntime;\n',
              '    case ActiveRuntime::Codex: return L"Codex CLI Agent Runtime";\n',
              '    case ActiveRuntime::Codex: return L"Agent Tools=启用";\n',
              '    if (state.activeRuntime == ActiveRuntime::Codex) state.codex->Stop();\n',
              '                state.codex->ResetSession();\n',
              '        if (state.lastRuntime == ActiveRuntime::Codex && state.codex->CanHandle(*state.agent)) runtime = ActiveRuntime::Codex;\n',
              '    if (runtime == ActiveRuntime::Codex) {\n        state.codex->AskAsync(*state.agent, actualPrompt, std::move(onDelta), std::move(onDone));\n    } else if (runtime == ActiveRuntime::DirectTools) {\n',
              '        state->codex->Stop();\n',
              '    state.codex = &gCodexRuntime;\n',
              'L"图灵智能桌面 · Codex CLI Agent"',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('expected L3 regression anchors missing: ' + repr(missing))

          for old in [
              '#include "turingdesk/CodexRuntime.h"\n',
              '    Codex,\n',
              '    CodexRuntime* codex{};\n',
              'CodexRuntime gCodexRuntime;\n',
              '    case ActiveRuntime::Codex: return L"Codex CLI Agent Runtime";\n',
              '    case ActiveRuntime::Codex: return L"Agent Tools=启用";\n',
              '                state.codex->ResetSession();\n',
              '        if (state.lastRuntime == ActiveRuntime::Codex && state.codex->CanHandle(*state.agent)) runtime = ActiveRuntime::Codex;\n',
              '        state->codex->Stop();\n',
              '    state.codex = &gCodexRuntime;\n',
          ]:
              s = s.replace(old, '', 1)

          lower_anchor = '''std::wstring Lower(std::wstring value) {
              std::transform(value.begin(), value.end(), value.begin(), [](wchar_t ch) {
                  return static_cast<wchar_t>(std::towlower(ch));
              });
              return value;
          }
          '''
          helper = lower_anchor + '''
          // Keep ordinary conversation on the streaming Direct Model runtime. Only explicit
          // desktop actions may enter the TuringDesk-owned Native Tool runtime.
          bool WantsNativeTools(const std::wstring& prompt) {
              const auto lower = Lower(prompt);
              const bool action = lower.find(L"创建") != std::wstring::npos ||
                                  lower.find(L"生成") != std::wstring::npos ||
                                  lower.find(L"新建") != std::wstring::npos ||
                                  lower.find(L"制作") != std::wstring::npos ||
                                  lower.find(L"打开") != std::wstring::npos ||
                                  lower.find(L"列出") != std::wstring::npos ||
                                  lower.find(L"列一下") != std::wstring::npos ||
                                  lower.find(L"查看") != std::wstring::npos ||
                                  lower.find(L"看看") != std::wstring::npos ||
                                  lower.find(L"create") != std::wstring::npos ||
                                  lower.find(L"generate") != std::wstring::npos ||
                                  lower.find(L"make") != std::wstring::npos ||
                                  lower.find(L"open") != std::wstring::npos ||
                                  lower.find(L"list") != std::wstring::npos ||
                                  lower.find(L"show") != std::wstring::npos;
              if (!action) return false;

              return lower.find(L"ppt") != std::wstring::npos ||
                     lower.find(L"powerpoint") != std::wstring::npos ||
                     lower.find(L"演示文稿") != std::wstring::npos ||
                     lower.find(L"幻灯片") != std::wstring::npos ||
                     lower.find(L"桌面") != std::wstring::npos ||
                     lower.find(L"下载") != std::wstring::npos ||
                     lower.find(L"文档") != std::wstring::npos ||
                     lower.find(L"文件") != std::wstring::npos ||
                     lower.find(L"目录") != std::wstring::npos ||
                     lower.find(L"文件夹") != std::wstring::npos ||
                     lower.find(L"应用") != std::wstring::npos ||
                     lower.find(L"desktop") != std::wstring::npos ||
                     lower.find(L"downloads") != std::wstring::npos ||
                     lower.find(L"documents") != std::wstring::npos ||
                     lower.find(L"file") != std::wstring::npos ||
                     lower.find(L"folder") != std::wstring::npos ||
                     lower.find(L"app") != std::wstring::npos;
          }
          '''
          if lower_anchor not in s:
              raise SystemExit('Lower helper anchor missing')
          s = s.replace(lower_anchor, helper, 1)

          start = s.index('ActiveRuntime ChooseRuntime(CliState& state) {')
          end = s.index('\nvoid StopTurn(CliState& state)', start)
          replacement = '''ActiveRuntime ChooseRuntime(CliState& state, const std::wstring& prompt) {
              if (WantsNativeTools(prompt) && state.directTools->CanHandle(*state.agent)) return ActiveRuntime::DirectTools;
              return ActiveRuntime::DirectModel;
          }

          std::wstring RuntimeStatusText(CliState& state) {
              std::wstring text = L"普通对话：Direct Model Runtime · SSE 流式";
              text += L"\\r\\n明确桌面动作：TuringDesk Native Tool Runtime（可用时）";
              text += L"\\r\\nL3 外部 Agent/Harness/Relay：不参与；复杂任务请交给 L4。";
              text += L"\\r\\nNative Tools：" + state.directTools->StatusText(*state.agent);
              return text;
          }
          '''
          s = s[:start] + replacement + s[end:]

          s = s.replace('    if (state.activeRuntime == ActiveRuntime::Codex) state.codex->Stop();\n    else if (state.activeRuntime == ActiveRuntime::DirectTools) state.directTools->Stop();\n',
                        '    if (state.activeRuntime == ActiveRuntime::DirectTools) state.directTools->Stop();\n', 1)
          s = s.replace('    ActiveRuntime runtime = ChooseRuntime(state);\n',
                        '    ActiveRuntime runtime = ChooseRuntime(state, actualPrompt);\n', 1)
          s = s.replace('        else if (state.lastRuntime == ActiveRuntime::DirectTools && state.directTools->CanHandle(*state.agent)) runtime = ActiveRuntime::DirectTools;\n',
                        '        if (state.lastRuntime == ActiveRuntime::DirectTools && WantsNativeTools(actualPrompt) && state.directTools->CanHandle(*state.agent)) runtime = ActiveRuntime::DirectTools;\n', 1)
          s = s.replace('    if (runtime == ActiveRuntime::Codex) {\n        state.codex->AskAsync(*state.agent, actualPrompt, std::move(onDelta), std::move(onDone));\n    } else if (runtime == ActiveRuntime::DirectTools) {\n',
                        '    if (runtime == ActiveRuntime::DirectTools) {\n', 1)
          s = s.replace('L"图灵智能桌面 · Codex CLI Agent"', 'L"图灵智能桌面 · L3 AI"', 1)

          banned = ['ActiveRuntime::Codex', 'gCodexRuntime', 'state.codex', 'state->codex', 'CodexRuntime']
          leftovers = [x for x in banned if x in s]
          if leftovers:
              raise SystemExit('Codex still wired into ordinary L3: ' + repr(leftovers))
          if 'ChooseRuntime(state, actualPrompt)' not in s or 'WantsNativeTools(actualPrompt)' not in s:
              raise SystemExit('native/streaming L3 routing not installed')
          p.write_text(s, encoding='utf-8')

      - name: Guard build and L3/L4 boundary
        shell: bash
        run: |
          grep -F 'src/DirectAgentRuntimeV2.cpp' src/native/CMakeLists.txt
          ! grep -F 'src/DirectToolRuntimeDisabled.cpp' src/native/CMakeLists.txt
          ! grep -F 'src/CodexRuntime.cpp' src/native/CMakeLists.txt
          grep -F '普通对话：Direct Model Runtime · SSE 流式' src/native/src/L3CliWindow.cpp
          grep -F 'L3 外部 Agent/Harness/Relay：不参与' src/native/src/L3CliWindow.cpp
          grep -F 'WantsNativeTools(actualPrompt)' src/native/src/L3CliWindow.cpp
          ! grep -E 'CodexRuntime|ActiveRuntime::Codex|4317|4318|MCP' src/native/src/L3CliWindow.cpp

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/repair-l3-native-boundary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/native/src/L3CliWindow.cpp .github/workflows/repair-l3-native-boundary.yml
          git commit -m 'fix: restore L3 streaming and native tool boundary'
          git push origin HEAD:main
