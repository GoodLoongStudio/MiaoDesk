          new = '''Remove-Item $NodeDir -Recurse -Force -ErrorAction SilentlyContinue\nRemove-Item $RelayDir -Recurse -Force -ErrorAction SilentlyContinue\nRemove-Item $CodexDir -Recurse -Force -ErrorAction SilentlyContinue\n'''
          if old not in text: raise SystemExit('deploy relay cleanup anchor missing')
          text = text.replace(old, new, 1)
          anchor = '''$codexTemp = Join-Path $env:TEMP ('TuringDesk-Codex-' + [guid]::NewGuid().ToString('N'))\n'''
          relay_extract = r'''$relayTemp = Join-Path $env:TEMP ('TuringDesk-CodexRelay-' + [guid]::NewGuid().ToString('N'))
try {
    Expand-BundleArchive $relayArchive $relayTemp
    $foundRelay = Get-ChildItem $relayTemp -Filter 'codex-relay.exe' -File -Recurse | Select-Object -First 1
    if (-not $foundRelay) { throw 'Vendored codex-relay payload is incomplete' }
    New-Item -ItemType Directory -Force -Path $RelayDir | Out-Null
    Copy-Item $foundRelay.FullName $RelayExe -Force
}
finally { Remove-Item $relayTemp -Recurse -Force -ErrorAction SilentlyContinue }
& $RelayExe --help | Out-Host
if ($LASTEXITCODE -ne 0) { throw 'Bundled codex-relay failed to execute' }

'''
          if anchor not in text: raise SystemExit('deploy relay extraction anchor missing')
          text = text.replace(anchor, relay_extract + anchor, 1)
          old = '''Write-Host "gozd:    $GozDaemon" -ForegroundColor DarkGray\nWrite-Host "Codex:   $CodexExe" -ForegroundColor DarkGray\n'''
          new = '''Write-Host "gozd:    $GozDaemon" -ForegroundColor DarkGray\nWrite-Host "Relay:   $RelayExe" -ForegroundColor DarkGray\nWrite-Host "Codex:   $CodexExe" -ForegroundColor DarkGray\n'''
          if old not in text: raise SystemExit('deploy relay log anchor missing')
          deploy.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          # --- ARM64 CI: verify relay executable and real Responses -> Chat translation against a fake local upstream.
          ci = Path('.github/workflows/native-search-windows.yml')
          text = ci.read_text(encoding='utf-8')
          anchor = '''      - name: Real goz MFT/USN integration test\n'''
          relay_smoke = r'''      - name: Real Codex Relay protocol bridge smoke test
        shell: pwsh
        run: |
          $node = (Resolve-Path '.\build\package\Runtime\Node\node.exe').Path
          $relay = (Resolve-Path '.\build\package\CodexRelay\codex-relay.exe').Path
          & $relay --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Bundled codex-relay --help failed' }
          $upstreamPort = 46151
          $relayPort = 46152
          $fake = Join-Path $env:RUNNER_TEMP 'turingdesk-relay-upstream.js'
          @'
          const http=require('http');
          const port=Number(process.argv[2]);
          http.createServer((req,res)=>{
            if(req.method==='GET' && req.url==='/v1/models'){
              res.writeHead(200,{'content-type':'application/json'});
              return res.end(JSON.stringify({object:'list',data:[{id:'ci-model',object:'model'}]}));
            }
            if(req.method==='POST' && req.url==='/v1/chat/completions'){
              let body=''; req.on('data',c=>body+=c); req.on('end',()=>{
                res.writeHead(200,{'content-type':'application/json'});
                res.end(JSON.stringify({id:'chatcmpl-ci',object:'chat.completion',created:1,model:'ci-model',choices:[{index:0,message:{role:'assistant',content:'relay-ok'},finish_reason:'stop'}],usage:{prompt_tokens:1,completion_tokens:1,total_tokens:2}}));
              }); return;
            }
            res.writeHead(404); res.end();
          }).listen(port,'127.0.0.1');
          '@ | Set-Content $fake -Encoding UTF8
          $upstream = Start-Process -FilePath $node -ArgumentList @($fake, $upstreamPort) -PassThru -NoNewWindow
          $oldBind=$env:CODEX_RELAY_BIND; $oldPort=$env:CODEX_RELAY_PORT; $oldUp=$env:CODEX_RELAY_UPSTREAM; $oldKey=$env:CODEX_RELAY_API_KEY
          try {
            $env:CODEX_RELAY_BIND='127.0.0.1'
            $env:CODEX_RELAY_PORT="$relayPort"
            $env:CODEX_RELAY_UPSTREAM="http://127.0.0.1:$upstreamPort/v1"
            $env:CODEX_RELAY_API_KEY='ci-key'
            $relayProc = Start-Process -FilePath $relay -PassThru -NoNewWindow
            try {
              Start-Sleep -Seconds 2
              $payload = @{ model='ci-model'; input=@(@{role='user';content=@(@{type='input_text';text='ping'})}); stream=$false } | ConvertTo-Json -Depth 8 -Compress
              $response = Invoke-WebRequest -UseBasicParsing -Method Post -Uri "http://127.0.0.1:$relayPort/v1/responses" -ContentType 'application/json' -Body $payload
              if ($response.StatusCode -ne 200 -or $response.Content -notmatch 'relay-ok') { throw 'codex-relay did not translate Responses API to Chat Completions correctly' }
            }
            finally { if ($relayProc -and -not $relayProc.HasExited) { Stop-Process -Id $relayProc.Id -Force } }
          }
          finally {
            if ($upstream -and -not $upstream.HasExited) { Stop-Process -Id $upstream.Id -Force }
            $env:CODEX_RELAY_BIND=$oldBind; $env:CODEX_RELAY_PORT=$oldPort; $env:CODEX_RELAY_UPSTREAM=$oldUp; $env:CODEX_RELAY_API_KEY=$oldKey
          }

'''
          if anchor not in text: raise SystemExit('ARM64 relay smoke insertion anchor missing')
          ci.write_text(text.replace(anchor, relay_smoke + anchor, 1), encoding='utf-8', newline='\n')

          # --- Third-party notice: truthful Codex default for both Responses and Chat-compatible providers.
          notices = Path('THIRD-PARTY-NOTICES.md')
          text = notices.read_text(encoding='utf-8')
          old = '- TuringDesk usage: default L3 agent runtime when the configured provider supports the Responses wire protocol. TuringDesk launches `codex app-server --stdio`, supplies its own provider/model settings and native dynamic tools, and presents the product identity as Turing Intelligent Desktop / TuringDesk.\n'
          new = '- TuringDesk usage: default L3 agent runtime. Responses-compatible providers connect directly; OpenAI-compatible Chat Completions providers are translated locally through the bundled Codex Relay. TuringDesk launches `codex app-server --stdio`, supplies its own provider/model settings and native dynamic tools, and presents the product identity as 图灵智能桌面 / Turing Intelligent Desktop.\n'
          if old not in text: raise SystemExit('Codex notice anchor missing')
          text = text.replace(old, new, 1)
          insert = '''\n## Codex Relay\n\n- Project: codex-relay\n- Source: https://github.com/MetaFARS/codex-relay\n- Pinned TuringDesk version: `0.5.8` / commit `84586a12976400957747c0afcd61618e052bc97d`\n- License: MIT\n- TuringDesk usage: local loopback-only Responses API ↔ OpenAI-compatible Chat Completions translation bridge for Codex CLI. It is launched on demand only for providers that do not expose Responses API. API credentials are passed through the child-process environment and are not placed on the command line.\n\nThe pinned Rust source is built on the Windows ARM64 vendoring runner; the resulting `codex-relay.exe` and MIT license are stored in the offline RuntimeBundle.\n'''
          marker = '\n## Microsoft WebView2 SDK\n'
          if marker not in text: raise SystemExit('notice insertion anchor missing')
          notices.write_text(text.replace(marker, insert + marker, 1), encoding='utf-8', newline='\n')

          # one-shot workflow removes itself after a successful patch.
          Path('.github/workflows/apply-codex-relay.yml').unlink()

      - name: Commit implementation directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: route Chat Completions providers through Codex Relay"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
