name: PowerShell Syntax

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**/*.ps1'
      - 'UPDATE-TURINGDESK.cmd'
      - 'DEPLOY-NATIVE-ARM64.cmd'
      - '.github/workflows/powershell-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powershell-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Verify Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checkout SHA mismatch: actual=$actual event=$env:GITHUB_SHA"
          }
          .\scripts\verify-windows-powershell-compat.ps1
