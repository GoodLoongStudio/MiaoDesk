                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'Scene input bus channel contract / analysis gate failed.'
          }

      - name: Verify Scene input bus publisher
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskInputBusPublisherTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Scene input bus publisher test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'Scene input bus publisher gate failed.'
          }

      - name: Verify audio ingress conversion
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskAudioIngressTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Audio ingress test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'audio downmix/resample/window gate failed.'
          }

      - name: Verify binding response curves
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskBindingResponseTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Binding response test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'binding response curve gate failed.'
          }

      - name: Verify scene runtime binding end to end
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskSceneRuntimeTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Scene runtime test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'binding response round-trip / backward-compat gate failed.'
          }

      - name: Verify pointer attribution across a multi-monitor topology
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskPointerAttributionTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Pointer attribution test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'pointer per-monitor attribution gate failed.'
          }

      - name: Verify SpriteRenderer texture contract
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskSpriteTextureContractTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Sprite texture contract test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'spriteRenderer texture contract gate failed.'
          }

      - name: Verify the textured-sprite scene fixture schema
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskSceneTextureFixtureTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Scene texture fixture test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|not found|must be' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'scene texture fixture gate failed.'
          }

      - name: Render a textured sprite through the real D2D backend
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskSceneD2DRendererTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Scene D2D renderer test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|DIAG' | Select-Object -First 20 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'Scene D2D renderer gate failed.'
          }

      - name: Walk the shipped .mdwall packages through the content chain
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskBuiltinWallpaperPackagesTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Builtin wallpaper packages test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|does not exist|missing asset|must reference' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'builtin wallpaper packages gate failed.'
          }

      - name: Run the scene serializer self-test that had no caller
        shell: pwsh
        run: |
          # $LASTEXITCODE 判空:& 一个 .exe 之前本步没有原生命令,它是 $null,
          # 而 $null -ne 0 恒真 —— 会把通过的步骤判成失败。
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskSceneSerializerSelfTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Scene serializer self-test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|budget|outside' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'scene serializer self-test gate failed.'
          }

      - name: Run the content-layer self-tests that had no caller
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskContentSelfTests.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Content self-tests executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'content self-tests gate failed.'
          }

      - name: Verify the host-side audio envelope against the injected web bridge
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskWebAudioEnvelopeTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'web audio envelope test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'web audio envelope test gate failed.'
          }

      - name: Run the D3D11 renderer self-tests that had no caller
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskSceneD3D11Test.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'D3D11 renderer self-test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
