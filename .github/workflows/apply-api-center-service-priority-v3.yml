name: Apply robust API center service priority polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-api-center-service-priority-v3.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply robust API center polish
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/native/src/ui/settings/DesktopAiSettingsPage.cpp')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              text = text.replace(old, new, 1)

          # Sorting helpers: keep the currently edited profile selected after reordering.
          anchor = '    void SetStatus(std::wstring text, bool ok) {'
          if '    int ProfilePriority(const ApiProfile& profile) const {' not in text:
              if anchor not in text:
                  raise SystemExit('SetStatus anchor not found')
              helpers = (
                  '    int ProfilePriority(const ApiProfile& profile) const {\n'
                  '        const bool configured = ProfileConfigured(profile);\n'
                  '        if (profile.isDefault && configured) return 0;\n'
                  '        if (configured && profile.lastOk) return 1;\n'
                  '        if (configured) return 2;\n'
                  '        if (profile.isDefault || profile.lastOk) return 3;\n'
                  '        return 4;\n'
                  '    }\n\n'
                  '    void SortProfilesForDisplay(std::wstring preferredId = {}) {\n'
                  '        if (profiles.empty()) return;\n'
                  '        if (preferredId.empty() && selected < profiles.size()) preferredId = profiles[selected].id;\n'
                  '        std::stable_sort(profiles.begin(), profiles.end(), [&](const ApiProfile& a, const ApiProfile& b) {\n'
                  '            return ProfilePriority(a) < ProfilePriority(b);\n'
                  '        });\n'
                  '        if (!preferredId.empty()) {\n'
                  '            const auto it = std::find_if(profiles.begin(), profiles.end(), [&](const ApiProfile& profile) {\n'
                  '                return _wcsicmp(profile.id.c_str(), preferredId.c_str()) == 0;\n'
                  '            });\n'
                  '            if (it != profiles.end()) selected = static_cast<std::size_t>(std::distance(profiles.begin(), it));\n'
                  '        }\n'
                  '    }\n\n'
              )
              text = text.replace(anchor, helpers + anchor, 1)

          replace_once(
              '        selected = it == profiles.end() ? 0 : static_cast<std::size_t>(std::distance(profiles.begin(), it));',
              '        const std::wstring preferredId = it == profiles.end() ? profiles.front().id : it->id;\n'
              '        selected = 0;\n'
              '        SortProfilesForDisplay(preferredId);',
              'LoadProfiles selection')

          replace_once(
              '        profiles[selected] = profile;\n        store.SaveAll(profiles);\n        RebuildList();\n        LoadForm();',
              '        const std::wstring selectedId = profile.id;\n'
              '        profiles[selected] = profile;\n'
              '        store.SaveAll(profiles);\n'
              '        SortProfilesForDisplay(selectedId);\n'
              '        RebuildList();\n'
              '        LoadForm();',
              'PersistForm')

          replace_once(
              '        profiles[selected] = profile;\n        store.Save(profile);\n        RebuildList();\n        SetStatus(profile.lastMessage, probe.ok);',
              '        const std::wstring selectedId = profile.id;\n'
              '        profiles[selected] = profile;\n'
              '        store.Save(profile);\n'
              '        SortProfilesForDisplay(selectedId);\n'
              '        RebuildList();\n'
              '        SetStatus(profile.lastMessage, probe.ok);',
              'TestConnection')

          replace_once(
              '        RebuildList();\n        LoadForm();\n        SetStatus(L"配置已删除。", true);',
              '        SortProfilesForDisplay();\n'
              '        RebuildList();\n'
              '        LoadForm();\n'
              '        SetStatus(L"配置已删除。", true);',
              'DeleteProfile')

          # Owner-draw action buttons for the target blue/white/red visual hierarchy.
          draw_anchor = '    void DrawProfileItem(const DRAWITEMSTRUCT& draw) {'
          if '    void DrawActionButton(const DRAWITEMSTRUCT& draw) {' not in text:
              if draw_anchor not in text:
                  raise SystemExit('DrawProfileItem anchor not found')
              draw_button = (
                  '    void DrawActionButton(const DRAWITEMSTRUCT& draw) {\n'
                  '        RECT rect = draw.rcItem;\n'
                  '        InflateRect(&rect, -S(1), -S(1));\n'
                  '        const int id = static_cast<int>(draw.CtlID);\n'
                  '        const bool pressed = (draw.itemState & ODS_SELECTED) != 0;\n'
                  '        const bool disabled = (draw.itemState & ODS_DISABLED) != 0;\n'
                  '        COLORREF background = RGB(249, 252, 255);\n'
                  '        COLORREF border = RGB(199, 216, 240);\n'
                  '        COLORREF textColor = RGB(45, 92, 166);\n\n'
                  '        if (id == kNewId || id == kSaveId) {\n'
                  '            background = pressed ? RGB(31, 102, 226) : RGB(43, 118, 246);\n'
                  '            border = background;\n'
                  '            textColor = RGB(255, 255, 255);\n'
                  '        } else if (id == kDeleteId) {\n'
                  '            background = pressed ? RGB(255, 241, 242) : RGB(253, 254, 255);\n'
                  '            border = RGB(247, 205, 209);\n'
                  '            textColor = RGB(224, 52, 61);\n'
                  '        } else if (id == kRevealId || id == kCopyId) {\n'
                  '            background = pressed ? RGB(235, 243, 255) : RGB(248, 251, 255);\n'
                  '            border = RGB(220, 231, 246);\n'
                  '            textColor = RGB(57, 88, 139);\n'
                  '        } else if (pressed) {\n'
                  '            background = RGB(237, 245, 255);\n'
                  '        }\n'
                  '        if (disabled) {\n'
                  '            background = RGB(242, 245, 249);\n'
                  '            border = RGB(225, 231, 239);\n'
                  '            textColor = RGB(151, 164, 184);\n'
                  '        }\n\n'
                  '        RoundFill(draw.hDC, rect, S(10), background, border);\n'
                  '        DrawTextSimple(draw.hDC, bodyFont, textColor, WindowText(draw.hwndItem), rect,\n'
                  '                       DT_CENTER | DT_VCENTER | DT_SINGLELINE);\n'
                  '        if (draw.itemState & ODS_FOCUS) {\n'
                  '            RECT focus = rect;\n'
                  '            InflateRect(&focus, -S(4), -S(4));\n'
                  '            DrawFocusRect(draw.hDC, &focus);\n'
                  '        }\n'
                  '    }\n\n'
              )
              text = text.replace(draw_anchor, draw_button + draw_anchor, 1)

          dot_pattern = re.compile(
              r'        HBRUSH dot = CreateSolidBrush\(profile\.lastMessage\.empty\(\) \? RGB\(160, 174, 198\) :\n'
              r'\s+\(profile\.lastOk \? RGB\(25, 190, 105\) : RGB\(235, 66, 66\)\)\);')
          if not dot_pattern.search(text):
              raise SystemExit('profile dot anchor not found')
          text = dot_pattern.sub(
              '        const bool explicitFailure = profile.lastMessage.find(L"失败") != std::wstring::npos ||\n'
              '                                     profile.lastMessage.find(L"异常") != std::wstring::npos;\n'
              '        const COLORREF dotColor = configured\n'
              '            ? (profile.lastOk ? RGB(25, 190, 105) : RGB(63, 126, 246))\n'
              '            : (profile.lastOk ? RGB(25, 190, 105) : (explicitFailure ? RGB(235, 66, 66) : RGB(160, 174, 198)));\n'
              '        HBRUSH dot = CreateSolidBrush(dotColor);',
              text, count=1)

          replace_once(
              '        RECT titleRect{rect.left + S(32), rect.top + S(9), rect.right - S(92), rect.top + S(34)};',
              '        RECT titleRect{rect.left + S(32), rect.top + S(9), rect.right - S(118), rect.top + S(34)};',
              'profile title rect')
          replace_once(
              '        else if (!configured) subtitle = profile.lastMessage.empty() ? L"等待配置" : profile.lastMessage;\n'
              '        else subtitle = profile.baseUrl;',
              '        else if (configured && profile.lastOk) subtitle = L"连接正常 · " + profile.model;\n'
              '        else if (configured) subtitle = profile.baseUrl;\n'
              '        else subtitle = profile.lastMessage.empty() ? L"等待配置" : profile.lastMessage;',
              'profile subtitle')
          replace_once(
              '        const std::wstring badge = configured ? L"已配置" : (profile.lastOk ? L"已连接" : L"未配置");',
              '        const std::wstring badge = configured ? (profile.lastOk ? L"已连接" : L"已配置") : L"未配置";\n'
              '        if (profile.isDefault && configured) {\n'
              '            RECT starRect{rect.right - S(109), rect.top + S(17), rect.right - S(88), rect.top + S(42)};\n'
              '            DrawTextSimple(dc, headingFont, RGB(50, 111, 236), L"★", starRect,\n'
              '                           DT_CENTER | DT_VCENTER | DT_SINGLELINE);\n'
              '        }',
              'profile badge')
          replace_once(
              'L"未配置的服务不会出现在可选模型列表中"',
              'L"已配置服务自动置顶；未配置服务不会进入模型列表"',
              'left hint')

          draw_block = (
              '        if (draw && draw->CtlID == kProfileListId) {\n'
              '            state->DrawProfileItem(*draw);\n'
              '            return TRUE;\n'
              '        }\n'
              '        break;')
          replace_once(
              draw_block,
              '        if (draw && draw->CtlID == kProfileListId) {\n'
              '            state->DrawProfileItem(*draw);\n'
              '            return TRUE;\n'
              '        }\n'
              '        if (draw && draw->CtlType == ODT_BUTTON) {\n'
              '            state->DrawActionButton(*draw);\n'
              '            return TRUE;\n'
              '        }\n'
              '        break;',
              'WM_DRAWITEM')

          replace_once('WS_CHILD | WS_VISIBLE | WS_TABSTOP | BS_PUSHBUTTON',
                       'WS_CHILD | WS_VISIBLE | WS_TABSTOP | BS_OWNERDRAW',
                       'button style')
          replace_once('        place(addButton, margin + contentW - S(132), margin + S(2), S(132), S(40));',
                       '        place(addButton, margin + contentW - S(150), margin + S(2), S(150), S(42));',
                       'add button layout')

          path.write_text(text, encoding='utf-8')

      - name: Verify API center behavior contract
        shell: pwsh
        run: |
          $text = Get-Content 'src/native/src/ui/settings/DesktopAiSettingsPage.cpp' -Raw
          foreach ($marker in @('ProfilePriority','SortProfilesForDisplay','BS_OWNERDRAW','DrawActionButton','已配置服务自动置顶','连接正常 · ')) {
            if (-not $text.Contains($marker)) { throw "Missing API center marker: $marker" }
          }

      - name: Configure ARM64 preview
        shell: pwsh
        run: cmake -S . -B build-api-center-arm64 -A ARM64 -DTURINGDESK_DEV_FAST=ON

      - name: Build ARM64 desktop surfaces
        shell: pwsh
        run: cmake --build build-api-center-arm64 --config Release --target TuringDesk TuringDeskWallpaper TuringDeskHarness --parallel

      - name: Commit verified polish and remove one-shot workflows
        shell: pwsh
        run: |
          git config user.name "GoodLoongStudio"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-api-center-service-priority.yml
          git rm .github/workflows/apply-api-center-service-priority-v2.yml
          git rm .github/workflows/apply-api-center-service-priority-v3.yml
          git add src/native/src/ui/settings/DesktopAiSettingsPage.cpp
          git commit -m "Polish API center and prioritize configured services"
          git push origin main
