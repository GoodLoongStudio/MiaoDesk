name: One-shot 妙喵 product finish v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-miaomiao-product-finish-v3.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply source and packaging finish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')

          def read(path): return (root / path).read_text(encoding='utf-8')
          def write(path, text): (root / path).write_text(text, encoding='utf-8', newline='\n')
          def replace_once(text, old, new, label):
              hits = text.count(old)
              if hits != 1: raise SystemExit(f'patch anchor {label!r} expected 1 occurrence, found {hits}')
              return text.replace(old, new, 1)

          runtime_exts = {'.cpp', '.h', '.hpp', '.inc', '.rc'}
          brand_files = 0
          for path in (root / 'src/native').rglob('*'):
              if path.is_file() and path.suffix.lower() in runtime_exts:
                  text = path.read_text(encoding='utf-8')
                  updated = text.replace('图灵智能桌面', '妙喵').replace('图灵 AI', '妙喵 AI')
                  if updated != text:
                      path.write_text(updated, encoding='utf-8', newline='\n')
                      brand_files += 1
          if brand_files == 0: raise SystemExit('brand replacement changed no runtime files')

          ai_path = 'src/native/src/ui/settings/DesktopAiSettingsPage.cpp'
          ai = read(ai_path)
          if 'kStoredKeyMask' not in ai:
              ai = replace_once(ai, 'constexpr int kOpenHarnessId = 7305;\n',
                                'constexpr int kOpenHarnessId = 7305;\nconstexpr wchar_t kStoredKeyMask[] = L"********";\n',
                                'API key mask constant')
              ai = replace_once(ai,
                  '''        SetWindowTextW(apiUrl, CurrentApi().c_str());\n        SetWindowTextW(model, config.model.c_str());\n        SetWindowTextW(apiKey, L"");\n''',
                  '''        SetWindowTextW(apiUrl, CurrentApi().c_str());\n        SetWindowTextW(model, config.model.c_str());\n        SetWindowTextW(apiKey, agent.HasStoredApiKey() ? kStoredKeyMask : L"");\n''',
                  'saved API key visual mask')
              ai = replace_once(ai, '        const std::wstring key = WindowText(apiKey);\n',
                                '        std::wstring key = WindowText(apiKey);\n        if (key == kStoredKeyMask) key.clear();\n',
                                'API key sentinel normalization')
          write(ai_path, ai)

          engine_path = 'src/native/src/desktop/wallpaper/legacy/WallpaperEngineProduction.cpp'
          engine = read(engine_path)
          if 'TuringDeskWallpaperShellNotifyIconW' not in engine:
              engine = replace_once(engine, '#include <windows.h>\n', '#include <windows.h>\n#include <shellapi.h>\n', 'shellapi include')
              engine = replace_once(engine, 'namespace {\n\n',
                  '''namespace {\n\nBOOL WINAPI TuringDeskWallpaperShellNotifyIconW(DWORD, PNOTIFYICONDATAW) {\n    // Production has exactly one tray owner: the main 妙喵 process.\n    // Historical wallpaper-host tray calls become successful no-ops.\n    return TRUE;\n}\n\n''', 'wallpaper tray suppression')
              engine = replace_once(engine,
                  '#define MessageBoxW TuringDeskMessageBoxW\n#include "WallpaperEngine.cpp"\n#undef MessageBoxW\n',
                  '#define MessageBoxW TuringDeskMessageBoxW\n#define Shell_NotifyIconW TuringDeskWallpaperShellNotifyIconW\n#include "WallpaperEngine.cpp"\n#undef Shell_NotifyIconW\n#undef MessageBoxW\n',
                  'wallpaper tray macro')
          write(engine_path, engine)

          v2_path = 'src/native/src/ui/wallpaper/WallpaperLibraryWindowV2.cpp'
          v2 = read(v2_path)
          if 'case WM_NCHITTEST:' not in v2:
              anchor = '        switch (message) {\n        case WM_GETMINMAXINFO: {\n'
              hit_test = '''        switch (message) {\n        case WM_NCHITTEST: {\n            if (IsZoomed(hwnd)) break;\n            RECT bounds{};\n            if (!GetWindowRect(hwnd, &bounds)) break;\n            const POINT point{GET_X_LPARAM(lParam), GET_Y_LPARAM(lParam)};\n            const UINT dpi = self->Dpi();\n            const int systemX = GetSystemMetricsForDpi(SM_CXSIZEFRAME, dpi) + GetSystemMetricsForDpi(SM_CXPADDEDBORDER, dpi);\n            const int systemY = GetSystemMetricsForDpi(SM_CYSIZEFRAME, dpi) + GetSystemMetricsForDpi(SM_CXPADDEDBORDER, dpi);\n            const int edgeX = std::max(self->S(7), systemX);\n            const int edgeY = std::max(self->S(7), systemY);\n            const int cornerX = std::max(edgeX, self->S(16));\n            const int cornerY = std::max(edgeY, self->S(16));\n            const bool leftEdge = point.x >= bounds.left && point.x < bounds.left + edgeX;\n            const bool rightEdge = point.x < bounds.right && point.x >= bounds.right - edgeX;\n            const bool topEdge = point.y >= bounds.top && point.y < bounds.top + edgeY;\n            const bool bottomEdge = point.y < bounds.bottom && point.y >= bounds.bottom - edgeY;\n            const bool leftCorner = point.x >= bounds.left && point.x < bounds.left + cornerX;\n            const bool rightCorner = point.x < bounds.right && point.x >= bounds.right - cornerX;\n            const bool topCorner = point.y >= bounds.top && point.y < bounds.top + cornerY;\n            const bool bottomCorner = point.y < bounds.bottom && point.y >= bounds.bottom - cornerY;\n            if (topCorner && leftCorner) return HTTOPLEFT;\n            if (topCorner && rightCorner) return HTTOPRIGHT;\n            if (bottomCorner && leftCorner) return HTBOTTOMLEFT;\n            if (bottomCorner && rightCorner) return HTBOTTOMRIGHT;\n            if (leftEdge) return HTLEFT;\n            if (rightEdge) return HTRIGHT;\n            if (topEdge) return HTTOP;\n            if (bottomEdge) return HTBOTTOM;\n            break;\n        }\n        case WM_GETMINMAXINFO: {\n'''
              v2 = replace_once(v2, anchor, hit_test, 'canonical resize hit test')
          write(v2_path, v2)

          manifest_path = root / 'packaging/windows-store/AppxManifest.xml.in'
          manifest_path.parent.mkdir(parents=True, exist_ok=True)
          manifest_path.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap">\n  <Identity Name="__PACKAGE_NAME__" Publisher="__PUBLISHER__" Version="__VERSION__" ProcessorArchitecture="arm64" />\n  <Properties>\n    <DisplayName>妙喵</DisplayName>\n    <PublisherDisplayName>GoodLoongStudio</PublisherDisplayName>\n    <Description>妙喵 AI 桌面</Description>\n    <Logo>Assets\\StoreLogo.png</Logo>\n  </Properties>\n  <Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.19041.0" MaxVersionTested="10.0.26100.0" /></Dependencies>\n  <Applications>\n    <Application Id="MiaoMiao" Executable="TuringDesk.exe" EntryPoint="Windows.FullTrustApplication">\n      <uap:VisualElements DisplayName="妙喵" Description="妙喵 AI 桌面" BackgroundColor="transparent" Square150x150Logo="Assets\\Square150x150Logo.png" Square44x44Logo="Assets\\Square44x44Logo.png">\n        <uap:DefaultTile Wide310x150Logo="Assets\\Wide310x150Logo.png" />\n      </uap:VisualElements>\n    </Application>\n  </Applications>\n  <Capabilities><rescap:Capability Name="runFullTrust" /></Capabilities>\n</Package>\n''', encoding='utf-8', newline='\n')

          msix_script = root / 'scripts/build-arm64-msix.ps1'
          msix_script.write_text('''param(\n    [Parameter(Mandatory = $true)][string]$InputDirectory,\n    [string]$OutputPath = (Join-Path $PWD 'artifacts\\miaomiao-arm64.msix'),\n    [string]$Version = '0.1.0.0',\n    [string]$Publisher = 'CN=GoodLoongStudio',\n    [string]$PackageName = 'GoodLoongStudio.MiaoMiao'\n)\n$ErrorActionPreference = 'Stop'\nSet-StrictMode -Version Latest\n$input = (Resolve-Path $InputDirectory).Path\nforeach ($required in @('TuringDesk.exe','TuringDeskWallpaper.exe','TuringDeskHarness.exe')) { if (-not (Test-Path (Join-Path $input $required) -PathType Leaf)) { throw "InputDirectory is missing $required." } }\nif ($Version -notmatch '^\\d+\\.\\d+\\.\\d+\\.\\d+$') { throw 'Version must be four numeric parts, e.g. 0.1.0.0.' }\n$repo = Split-Path $PSScriptRoot -Parent\n$template = Join-Path $repo 'packaging\\windows-store\\AppxManifest.xml.in'\n$stage = Join-Path $env:TEMP ("miaomiao-msix-" + [guid]::NewGuid().ToString('N'))\nNew-Item -ItemType Directory -Force -Path $stage | Out-Null\ntry {\n  Copy-Item (Join-Path $input '*') $stage -Recurse -Force\n  $manifest = Get-Content $template -Raw -Encoding UTF8\n  $manifest = $manifest.Replace('__PACKAGE_NAME__',$PackageName).Replace('__PUBLISHER__',$Publisher).Replace('__VERSION__',$Version)\n  Set-Content -Path (Join-Path $stage 'AppxManifest.xml') -Value $manifest -Encoding UTF8\n  $assets = Join-Path $stage 'Assets'; New-Item -ItemType Directory -Force -Path $assets | Out-Null\n  Add-Type -AssemblyName System.Drawing\n  function New-MiaoMiaoLogo([string]$Path,[int]$Width,[int]$Height) {\n    $bitmap = New-Object System.Drawing.Bitmap $Width,$Height\n    try { $g=[System.Drawing.Graphics]::FromImage($bitmap); try { $g.Clear([System.Drawing.Color]::FromArgb(255,245,246,248)); $b=New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255,35,38,45)); try { $fs=[Math]::Max(12,[Math]::Min($Width,$Height)*0.36); $f=New-Object System.Drawing.Font 'Segoe UI',$fs,([System.Drawing.FontStyle]::Bold),([System.Drawing.GraphicsUnit]::Pixel); try { $fmt=New-Object System.Drawing.StringFormat; $fmt.Alignment=[System.Drawing.StringAlignment]::Center; $fmt.LineAlignment=[System.Drawing.StringAlignment]::Center; $g.DrawString('M',$f,$b,(New-Object System.Drawing.RectangleF 0,0,$Width,$Height),$fmt) } finally { $f.Dispose() } } finally { $b.Dispose() } } finally { $g.Dispose() }; $bitmap.Save($Path,[System.Drawing.Imaging.ImageFormat]::Png) } finally { $bitmap.Dispose() }\n  }\n  New-MiaoMiaoLogo (Join-Path $assets 'StoreLogo.png') 50 50\n  New-MiaoMiaoLogo (Join-Path $assets 'Square44x44Logo.png') 44 44\n  New-MiaoMiaoLogo (Join-Path $assets 'Square150x150Logo.png') 150 150\n  New-MiaoMiaoLogo (Join-Path $assets 'Wide310x150Logo.png') 310 150\n  $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\\10\\bin'\n  $makeAppx = Get-ChildItem $sdkBin -Recurse -Filter MakeAppx.exe -File | Where-Object { $_.FullName -match '\\x64\\MakeAppx.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1\n  if (-not $makeAppx) { $makeAppx = Get-ChildItem $sdkBin -Recurse -Filter MakeAppx.exe -File | Sort-Object FullName -Descending | Select-Object -First 1 }\n  if (-not $makeAppx) { throw 'MakeAppx.exe was not found in the Windows SDK.' }\n  $outputDir=Split-Path $OutputPath -Parent; if ($outputDir) { New-Item -ItemType Directory -Force -Path $outputDir | Out-Null }\n  & $makeAppx.FullName pack /d $stage /p $OutputPath /o\n  if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed with exit code $LASTEXITCODE." }\n  Write-Host "MSIX created: $OutputPath"\n} finally { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }\n''', encoding='utf-8', newline='\n')

          checks = {
              ai_path: ['kStoredKeyMask','if (key == kStoredKeyMask) key.clear();'],
              engine_path: ['TuringDeskWallpaperShellNotifyIconW','#define Shell_NotifyIconW TuringDeskWallpaperShellNotifyIconW'],
              v2_path: ['case WM_NCHITTEST:','HTTOPLEFT','HTBOTTOMRIGHT'],
              'packaging/windows-store/AppxManifest.xml.in': ['<DisplayName>妙喵</DisplayName>','ProcessorArchitecture="arm64"'],
              'scripts/build-arm64-msix.ps1': ['MakeAppx.exe','TuringDeskWallpaper.exe','TuringDeskHarness.exe'],
          }
          for path, needles in checks.items():
              text=read(path)
              for needle in needles:
                  if needle not in text: raise SystemExit(f'guard failed: {needle} missing from {path}')
          print(f'patched runtime brand in {brand_files} files')
          PY

      - name: Commit source and packaging
        shell: bash
        run: |
          git config user.name "GoodLoongStudio"
          git config user.email "chnmlong@hotmail.com"
          git add src/native packaging scripts/build-arm64-msix.ps1
          git diff --cached --check
          git commit -m "Finish 妙喵 product shell and ARM64 MSIX"
          git push origin HEAD:main
