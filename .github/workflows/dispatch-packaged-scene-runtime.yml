name: Dispatch packaged Scene runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-packaged-scene-runtime.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch implementation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-packaged-scene-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
