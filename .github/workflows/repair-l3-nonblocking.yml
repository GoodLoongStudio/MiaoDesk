name: Repair L3 nonblocking lifecycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-l3-nonblocking.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch L3 window lifecycle
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/native/src/L3CliWindow.cpp')
          s = p.read_text(encoding='utf-8')

          old_destroy = '''    case WM_DESTROY:\n        gCliGeneration.fetch_add(1, std::memory_order_relaxed);\n        state->agent->Stop();\n        state->codex->Stop();\n        return 0;\n    }\n    return DefWindowProcW(hwnd, message, wParam, lParam);\n}'''
          new_destroy = '''    case WM_DESTROY:\n        gCliGeneration.fetch_add(1, std::memory_order_relaxed);\n        state->agent->Stop();\n        state->codex->Stop();\n        return 0;\n    case WM_NCDESTROY:\n        if (state->backgroundBrush) DeleteObject(state->backgroundBrush);\n        if (state->monoFont) DeleteObject(state->monoFont);\n        SetWindowLongPtrW(hwnd, GWLP_USERDATA, 0);\n        delete state;\n        return 0;\n    }\n    return DefWindowProcW(hwnd, message, wParam, lParam);\n}'''
          assert old_destroy in s, 'WM_DESTROY anchor changed'
          s = s.replace(old_destroy, new_destroy, 1)

          start = s.index('bool ShowL3CliWindow(')
          end = s.index('\n}\n\n} // namespace turingdesk', start) + 2
          old_func = s[start:end]
          assert 'while (IsWindow(window))' in old_func, 'nested loop already changed'
          assert 'CliState state{};' in old_func, 'stack state anchor changed'

          new_func = old_func.replace('    CliState state{};\n', '    auto* state = new CliState{};\n', 1)
          new_func = new_func.replace('state.', 'state->')
          new_func = new_func.replace('instance, &state);', 'instance, state);', 1)
          new_func = new_func.replace('SendPrompt(state);', 'SendPrompt(*state);', 1)
          new_func = new_func.replace('''    if (!window) {\n        DeleteObject(state->backgroundBrush);\n        if (state->monoFont) DeleteObject(state->monoFont);\n        return false;\n    }''', '''    if (!window) {\n        DeleteObject(state->backgroundBrush);\n        if (state->monoFont) DeleteObject(state->monoFont);\n        delete state;\n        return false;\n    }''', 1)
          new_func = new_func.replace('''    if (!title || !state->settings || !state->transcript || !state->input || !state->close) {\n        DestroyWindow(window);\n        DeleteObject(state->backgroundBrush);\n        if (state->monoFont) DeleteObject(state->monoFont);\n        return false;\n    }''', '''    if (!title || !state->settings || !state->transcript || !state->input || !state->close) {\n        DestroyWindow(window);\n        return false;\n    }''', 1)

          loop_start = new_func.index('    MSG msg{};')
          new_func = new_func[:loop_start] + '    return true;\n}'
          s = s[:start] + new_func + s[end:]
          p.write_text(s, encoding='utf-8', newline='\n')

          q = Path('src/native/src/SearchWindow.cpp')
          t = q.read_text(encoding='utf-8')
          old = '''    if (!ShowL3CliWindow(instance_, hwnd_, l3_, prompt)) { SetStatus(L"AI 启动失败", L"请检查模型配置后重试。"); return; }\n    SetWindowTextW(edit_, L""); SetExpanded(false); ShowAndFocus();'''
          new = '''    if (!ShowL3CliWindow(instance_, hwnd_, l3_, prompt)) { SetStatus(L"AI 启动失败", L"请检查模型配置后重试。"); return; }\n    SetWindowTextW(edit_, L""); SetExpanded(false);'''
          assert old in t, 'SearchWindow StartL3 anchor changed'
          q.write_text(t.replace(old, new, 1), encoding='utf-8', newline='\n')

          # Self-check the exact behavioral contract.
          l3 = p.read_text(encoding='utf-8')
          search = q.read_text(encoding='utf-8')
          body = l3[l3.index('bool ShowL3CliWindow('):]
          assert 'while (IsWindow(window))' not in body
          assert 'GetMessageW(&msg' not in body
          assert 'case WM_NCDESTROY:' in l3
          assert 'delete state;' in l3
          start_l3 = search[search.index('void SearchWindow::StartL3'):search.index('void SearchWindow::SetStatus')]
          assert 'ShowAndFocus();' not in start_l3
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/repair-l3-nonblocking.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/native/src/L3CliWindow.cpp src/native/src/SearchWindow.cpp .github/workflows/repair-l3-nonblocking.yml
          git commit -m "fix: make L3 window lifecycle nonblocking"
          git push origin HEAD:main
