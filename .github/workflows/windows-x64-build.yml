name: Windows x64 Build

on:
  push:
    branches: [main]
    paths:
      - src/**
      # Three steps below run node tests/*.mjs. Without this entry an edit to those
      # files changed nothing that the filter lists, so the workflow that is the
      # only thing validating them never ran.
      - tests/**
      # scripts/** rather than two hand-listed files: this workflow executes
      # scripts/verify-web-audio-bridge.ps1 and packaging/windows/verify-login-startup.ps1,
      # and any gate it runs must be able to trigger it when the gate itself changes.
      - scripts/**
      - packaging/windows/*.ps1
      - CMakeLists.txt
      - CMakePresets.json
      - assets/app/**
      - assets/widgets/**
      - config/**
      - packaging/windows/verify-widget-visibility.ps1
      - third_party/webview2/**
      - scripts/generate-miaomiao-icon.ps1
      - scripts/verify-path-layout-contract.ps1
      - .github/workflows/windows-x64-build.yml
  pull_request:
    paths:
      - src/**
      # Three steps below run node tests/*.mjs. Without this entry an edit to those
      # files changed nothing that the filter lists, so the workflow that is the
      # only thing validating them never ran.
      - tests/**
      # scripts/** rather than two hand-listed files: this workflow executes
      # scripts/verify-web-audio-bridge.ps1 and packaging/windows/verify-login-startup.ps1,
      # and any gate it runs must be able to trigger it when the gate itself changes.
      - scripts/**
      - packaging/windows/*.ps1
      - CMakeLists.txt
      - CMakePresets.json
      - assets/app/**
      - assets/widgets/**
      - config/**
      - packaging/windows/verify-widget-visibility.ps1
      - third_party/webview2/**
      - scripts/generate-miaomiao-icon.ps1
      - scripts/verify-path-layout-contract.ps1
      - .github/workflows/windows-x64-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      MIAODESK_BUILD_ROOT: C:\b\MiaoDesk\quick-x64
      MIAODESK_STAGE_ROOT: C:\b\MiaoDesk\quick-stage-x64

    steps:
      - uses: actions/checkout@v5

      - name: Generate MiaoMiao app icon
        shell: pwsh
        run: .\scripts\generate-miaomiao-icon.ps1

      - name: Verify path layout
        shell: pwsh
        run: .\scripts\verify-path-layout-contract.ps1

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item $env:MIAODESK_BUILD_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $env:MIAODESK_STAGE_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Split-Path $env:MIAODESK_BUILD_ROOT -Parent) | Out-Null
          $gateOut = cmake -S . -B $env:MIAODESK_BUILD_ROOT -A x64 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'CMake configure failed.'
          }

      - name: Build
        shell: pwsh
        run: |
          $log = & cmake --build $env:MIAODESK_BUILD_ROOT --config Release --target MiaoDesk MiaoDeskWallpaper MiaoDeskHarness MiaoDeskContentWebReplacementTest MiaoDeskContentSkillLoadingTest MiaoDeskMediaPackageTest MiaoDeskInputBusCoreTest MiaoDeskInputBusPublisherTest MiaoDeskAudioIngressTest MiaoDeskBindingResponseTest MiaoDeskSceneRuntimeTest MiaoDeskSceneSpatial3DTest MiaoDeskPointerAttributionTest MiaoDeskSpriteTextureContractTest MiaoDeskSceneD2DRendererTest MiaoDeskSceneTextureFixtureTest MiaoDeskBuiltinWallpaperPackagesTest MiaoDeskSpriteMaterialPolicyTest MiaoDeskSceneSerializerSelfTest MiaoDeskContentSelfTests MiaoDeskWebAudioEnvelopeTest MiaoDeskSceneD3D11Test --parallel 2>&1
          $log | ForEach-Object { "$_" } | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $log | ForEach-Object { "$_" } | Where-Object { $_ -match '(error C\d+|error LNK\d+|fatal error|error MSB\d+|CMake Error)' } |
              Select-Object -First 40 | ForEach-Object {
                $line = $_.Trim()
                if ($line.Length -gt 500) { $line = $line.Substring(0, 500) }
                Write-Host "::error::$line"
              }
            throw 'x64 build failed.'
          }

      - name: Verify image_generate provider parameterisation
        shell: pwsh
        run: |
          node --version
          $gateOut = & node tests/image-provider.mjs 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'image provider parameterisation gate failed.'
          }

      - name: Verify web audio bridge shim
        shell: pwsh
        run: |
          node --version
          $gateOut = & node tests/WebAudioBridge.mjs 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'web audio bridge shim gate failed.'
          }

      - name: Verify web audio bridge has not drifted
        shell: pwsh
        run: |
          # 必须经子 pwsh 调用:.\script.ps1 是 PowerShell 脚本而不是原生可执行文件,
          # 直接调用不会设置 $LASTEXITCODE。那一步之前又没有别的原生命令,于是
          # $LASTEXITCODE 是 $null,而 `$null -ne 0` 恒为真 —— 这一步从写下来就
          # 不可能通过,和脚本本身过没过无关。
          $gateOut = & pwsh -NoLogo -NoProfile -NonInteractive -File .\scripts\verify-web-audio-bridge.ps1 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'embedded web audio bridge differs from its source of truth.'
          }

      - name: Verify Content web replacement continuity
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskContentWebReplacementTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Content web replacement continuity test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'Content web replacement continuity regression failed.'
          }

      - name: Verify content skill loading gate
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskContentSkillLoadingTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Content skill loading test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'content_skill_get allowlist/path gate failed.'
          }

      - name: Verify media wallpaper package gate
        shell: pwsh
        run: |
          $test = Get-ChildItem $env:MIAODESK_BUILD_ROOT -Filter MiaoDeskMediaPackageTest.exe -File -Recurse |
            Select-Object -First 1
          if (-not $test) { throw 'Media wallpaper package test executable was not found.' }
          $gateOut = & $test.FullName 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
