name: Apply weather cache hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-weather-cache-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch-weather-cache-hardening.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- src/native/src/desktop/widgets/NativeWeatherService.cpp
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/src/desktop/widgets/NativeWeatherService.cpp
          git commit -m "Harden native weather cache encoding"
          git push origin HEAD:main
