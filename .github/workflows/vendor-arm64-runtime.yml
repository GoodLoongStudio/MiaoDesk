name: Vendor ARM64 Runtime Base

on:
  push:
    branches: [main]
    paths:
      - runtime/arm64/runtime-lock.json
      - .github/workflows/vendor-arm64-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-arm64-runtime
  cancel-in-progress: true

jobs:
  vendor:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Materialize pinned ARM64 base runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = (Resolve-Path '.').Path
          $runtime = Join-Path $root 'runtime\arm64'
          $lockPath = Join-Path $runtime 'runtime-lock.json'
          $lock = Get-Content $lockPath -Raw | ConvertFrom-Json
          if ([string]$lock.architecture -ne 'arm64') { throw 'runtime lock is not ARM64' }

          function Sha256([string]$Path) {
            (Get-FileHash -Algorithm SHA256 -Path $Path).Hash.ToLowerInvariant()
          }
          function Assert-Hash([string]$Path,[string]$Expected) {
            if (-not (Test-Path $Path -PathType Leaf)) { throw "Runtime archive is missing: $Path" }
            $actual = Sha256 $Path
            if ($actual -ne $Expected.ToLowerInvariant()) {
              throw "Checksum mismatch: $Path`nExpected: $Expected`nActual:   $actual"
            }
          }

          $nodeArchive = Join-Path $runtime ('node\' + [string]$lock.node.archive)
          if (-not (Test-Path $nodeArchive -PathType Leaf) -or (Sha256 $nodeArchive) -ne ([string]$lock.node.sha256).ToLowerInvariant()) {
            New-Item -ItemType Directory -Force -Path (Split-Path $nodeArchive -Parent) | Out-Null
            Invoke-WebRequest -Uri (([string]$lock.node.source).TrimEnd('/') + '/' + [string]$lock.node.archive) -OutFile $nodeArchive -UseBasicParsing
          }
          Assert-Hash $nodeArchive ([string]$lock.node.sha256)

          $gozArchive = Join-Path $runtime ('goz\' + [string]$lock.goz.archive)
          Assert-Hash $gozArchive ([string]$lock.goz.sha256)

          $temp = Join-Path $env:RUNNER_TEMP ('MiaoDesk-ARM64-base-' + [guid]::NewGuid().ToString('N'))
          try {
            New-Item -ItemType Directory -Force -Path $temp | Out-Null
            $nodeExpanded = Join-Path $temp 'node'
            Expand-Archive $nodeArchive -DestinationPath $nodeExpanded -Force
            $nodeExe = Get-ChildItem $nodeExpanded -Filter node.exe -File -Recurse | Select-Object -First 1
            if (-not $nodeExe) { throw 'Pinned ARM64 Node archive does not contain node.exe.' }
            & $nodeExe.FullName --version | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Pinned ARM64 Node probe failed.' }

            $gozExpanded = Join-Path $temp 'goz'
            Expand-Archive $gozArchive -DestinationPath $gozExpanded -Force
            foreach ($name in @('goz.exe','gozd.exe')) {
              if (-not (Get-ChildItem $gozExpanded -Filter $name -File -Recurse | Select-Object -First 1)) {
                throw "Pinned ARM64 goz archive is missing $name."
              }
            }
          } finally {
            Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Host 'ARM64 base Runtime ready: Node + goz.' -ForegroundColor Green

      - name: Commit base runtime changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/arm64/node runtime/arm64/goz
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'runtime: update pinned ARM64 base'
          git pull --rebase origin main
          git push origin HEAD:main
