name: Native Windows ARM64 Preview

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - src/native/**
      - assets/wallpapers/**
      - runtime/arm64/runtime-manifest.json
      - runtime/arm64/node/**
      - runtime/arm64/harness/**
      - runtime/arm64/pi/**
      - packaging/windows-store/**
      - scripts/build-arm64-msix.ps1
      - vcpkg.json
      - vcpkg-configuration.json
      - .github/workflows/native-arm64-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-arm64-preview
  cancel-in-progress: true

jobs:
  preview-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Verify exact head
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Checkout SHA mismatch: actual=$actual event=$env:GITHUB_SHA" }

      - name: Verify Miao Cloud LFS assets
        shell: pwsh
        run: |
          $required = @(
            'assets\wallpapers\MiaoCloud.mdwall\assets\background.jpg',
            'assets\wallpapers\MiaoCloud.mdwall\assets\cloud.png',
            'assets\wallpapers\MiaoCloud.mdwall\assets\cat.png',
            'assets\wallpapers\MiaoCloud.mdwall\assets\tail.png',
            'assets\wallpapers\MiaoCloud.mdwall\assets\blink.png'
          )
          foreach ($relative in $required) {
            $path = Join-Path $PWD $relative
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing wallpaper asset: $relative" }
            if ((Get-Item $path).Length -lt 1024) { throw "Wallpaper asset still looks like an LFS pointer: $relative" }
          }

      - name: Configure lightweight preview
        shell: pwsh
        run: cmake -S . -B build-preview-arm64 -A ARM64 -DMIAODESK_DEV_FAST=ON

      - name: Build preview UI binaries
        shell: pwsh
        run: cmake --build build-preview-arm64 --config Release --target MiaoDesk MiaoDeskWallpaper MiaoDeskHarness --parallel

      - name: Prepare preview artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $PWD 'build-preview-arm64\src\native\Release'
          $dest = Join-Path $PWD 'preview-arm64'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          foreach ($exe in @('MiaoDesk.exe', 'MiaoDeskWallpaper.exe', 'MiaoDeskHarness.exe')) {
            $path = Join-Path $source $exe
            if (-not (Test-Path $path -PathType Leaf)) { throw "Preview build is missing $exe" }
            Copy-Item $path $dest -Force
          }

          Get-ChildItem $source -Filter '*.dll' -File -ErrorAction SilentlyContinue | Copy-Item -Destination $dest -Force

          # The workbench and Pi chat are part of the preview acceptance surface, so the
          # preview must carry the same pinned offline runtime instead of depending on a
          # previous NativeTest installation or a system Node/npm environment.
          $manifestPath = Join-Path $PWD 'runtime\arm64\runtime-manifest.json'
          if (-not (Test-Path $manifestPath -PathType Leaf)) { throw 'ARM64 runtime manifest is missing.' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json

          function BundlePath([string]$relative) {
            if ([string]::IsNullOrWhiteSpace($relative)) { throw 'Runtime manifest contains an empty archive path.' }
            $path = Join-Path $PWD ('runtime\arm64\' + ($relative -replace '/', '\'))
            if (-not (Test-Path $path -PathType Leaf)) { throw "Runtime archive is missing: $path" }
            return $path
          }
          function ExpandArchive([string]$archive, [string]$destination) {
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            & tar.exe -xf $archive -C $destination
            if ($LASTEXITCODE -ne 0) { throw "Failed to extract runtime archive: $archive" }
          }

          $nodeArchive = BundlePath ([string]$manifest.node.archive)
          $harnessArchive = BundlePath ([string]$manifest.deepseekHarness.archive)
          $piArchive = BundlePath ([string]$manifest.pi.archive)
          $runtimeNode = Join-Path $dest 'Runtime\Node'
          $nodeTemp = Join-Path $env:RUNNER_TEMP ('MiaoDeskPreviewNode-' + [guid]::NewGuid().ToString('N'))
          try {
            ExpandArchive $nodeArchive $nodeTemp
            $nodeRoot = Get-ChildItem $nodeTemp -Directory | Where-Object {
              Test-Path (Join-Path $_.FullName 'node.exe') -PathType Leaf
            } | Select-Object -First 1
            if (-not $nodeRoot) { throw 'Pinned Node ARM64 archive does not contain node.exe.' }
            New-Item -ItemType Directory -Force -Path $runtimeNode | Out-Null
            Copy-Item (Join-Path $nodeRoot.FullName '*') $runtimeNode -Recurse -Force
          }
          finally {
            Remove-Item $nodeTemp -Recurse -Force -ErrorAction SilentlyContinue
          }

          ExpandArchive $harnessArchive $runtimeNode
          $piDest = Join-Path $dest 'Pi'
          ExpandArchive $piArchive $piDest

          $nodeExe = Join-Path $runtimeNode 'node.exe'
          $dshBin = Join-Path $runtimeNode 'node_modules\@deepseek-ai\dsh\lib\bin.js'
          $piCli = Join-Path $piDest 'node_modules\@earendil-works\pi-coding-agent\dist\cli.js'
          foreach ($requiredRuntime in @($nodeExe, $dshBin, $piCli)) {
            if (-not (Test-Path $requiredRuntime -PathType Leaf)) {
              throw "Preview runtime is incomplete: $requiredRuntime"
            }
          }

          $wallpapersSource = Join-Path $PWD 'assets\wallpapers'
          $wallpapersDest = Join-Path $dest 'Wallpapers'
          New-Item -ItemType Directory -Force -Path $wallpapersDest | Out-Null
          Copy-Item (Join-Path $wallpapersSource '*') $wallpapersDest -Recurse -Force

          $miaoCloudBackground = Join-Path $wallpapersDest 'MiaoCloud.mdwall\assets\background.jpg'
          if (-not (Test-Path $miaoCloudBackground -PathType Leaf)) {
            throw 'Preview artifact is missing MiaoCloud.mdwall resources.'
          }

          Set-Content -Path (Join-Path $dest 'preview-build-sha.txt') -Value $env:GITHUB_SHA -Encoding ASCII
          Set-Content -Path (Join-Path $dest 'preview-components.txt') -Value @(
            'MiaoDesk.exe'
            'MiaoDeskWallpaper.exe'
            'MiaoDeskHarness.exe'
            'Runtime/Node/node.exe'
            'Runtime/Node/node_modules/@deepseek-ai/dsh'
            'Pi/node_modules/@earendil-works/pi-coding-agent'
            'Wallpapers/MiaoCloud.mdwall'
            'Desktop settings UI'
            'Widget settings UI'
            'AI API settings UI'
            '妙喵工作台 UI + pinned DeepSeek Harness runtime'
          ) -Encoding UTF8

      - name: Build ARM64 MSIX test package
        shell: pwsh
        run: |
          & "$PWD\scripts\build-arm64-msix.ps1" `
            -InputDirectory "$PWD\preview-arm64" `
            -OutputPath "$PWD\miaomiao-arm64.msix" `
            -Version '0.1.0.0'

      - name: Upload ARM64 MSIX test package
        uses: actions/upload-artifact@v4
        with:
          name: miaomiao-arm64-msix-${{ github.sha }}
          path: miaomiao-arm64.msix
          if-no-files-found: error
          retention-days: 7

      - name: Upload lightweight preview
        uses: actions/upload-artifact@v4
        with:
          name: miaodesk-arm64-preview-${{ github.sha }}
          path: preview-arm64/
          if-no-files-found: error
          retention-days: 7