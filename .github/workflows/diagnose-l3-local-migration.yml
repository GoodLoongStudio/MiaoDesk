name: Diagnose L3 Local Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-l3-local-migration.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect migration anchors
        shell: python
        run: |
          from pathlib import Path
          checks = []
          def check(path, marker):
              text = Path(path).read_text(encoding='utf-8')
              checks.append((path, marker, marker in text))
          check('src/native/include/turingdesk/GozSearch.h', '    bool Query(HWND replyWindow, const std::wstring& query, DWORD maxResults = 12) const;\n')
          check('src/native/src/GozSearch.cpp', 'bool GozSearch::HandleCopyData(const COPYDATASTRUCT* copyData, std::vector<SearchResult>& results) const {\n')
          check('src/native/src/L3Agent.cpp', 'reply = L"L3 命令：/status、/time、/new。模型和 API Key 请使用右上角 AI 设置；Ctrl+Enter 强制进入 L3。";')
          check('src/native/src/L3Agent.cpp', '    if (lower.starts_with(L"/key ")) {\n')
          check('src/native/src/main.cpp', '    for (const wchar_t* command : {L"/new", L"/new-chat", L"新对话"}) {\n')
          lines = ['L3 local migration anchor diagnostics:']
          for path, marker, ok in checks:
              lines.append(f'{"OK" if ok else "MISS"} {path}: {marker!r}')
          Path('migration-l3-local-diagnostic.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Commit diagnostic and remove workflow
        shell: bash
        run: |
          rm .github/workflows/diagnose-l3-local-migration.yml
          git config user.name 'GoodLoongStudio'
          git config user.email 'chnmlong@hotmail.com'
          git add migration-l3-local-diagnostic.txt .github/workflows/diagnose-l3-local-migration.yml
          git commit -m 'ci: record L3 local migration diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
