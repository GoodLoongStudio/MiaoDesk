name: Repair ARM64 L3 boundary guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-arm64-l3-guard.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Codex-first guard with L3/L4 boundary guard
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/native-search-windows.yml')
          s = p.read_text(encoding='utf-8')
          start = s.index('      - name: Guard Codex-first AI baseline\n')
          end = s.index('      - name: Check RuntimeBundle freshness\n', start)
          replacement = '''      - name: Guard L3 and L4 runtime boundary
        shell: pwsh
        run: |
          $source = Get-Content 'src/native/src/L3CliWindow.cpp' -Raw
          foreach ($marker in @('CodexRuntime', 'ActiveRuntime::Codex', 'gCodexRuntime', '4317', '4318', 'MCP')) {
            if ($source.Contains($marker)) { throw "External Agent/legacy marker leaked into ordinary L3: $marker" }
          }
          foreach ($marker in @('普通对话：Direct Model Runtime · SSE 流式', 'WantsNativeTools(actualPrompt)', 'L3 外部 Agent/Harness/Relay：不参与')) {
            if (-not $source.Contains($marker)) { throw "Required native L3 marker missing: $marker" }
          }
          $cmake = Get-Content 'src/native/CMakeLists.txt' -Raw
          if (-not $cmake.Contains('src/DirectAgentRuntimeV2.cpp')) {
            throw 'TuringDesk Native Tool runtime must be compiled into the default L3 route.'
          }
          foreach ($marker in @('src/CodexRuntime.cpp', 'src/DirectToolRuntimeDisabled.cpp')) {
            if ($cmake.Contains($marker)) { throw "Retired/external runtime must not be compiled into TuringDesk L3: $marker" }
          }

'''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
      - name: Commit guard repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/repair-arm64-l3-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/native-search-windows.yml .github/workflows/repair-arm64-l3-guard.yml
          git commit -m 'ci: enforce native L3 boundary on ARM64'
          git push origin HEAD:main
