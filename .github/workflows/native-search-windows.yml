name: Native Windows ARM64

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - src/native/**
      - runtime/arm64/**
      - docs/L3-PI-RUNTIME-CONTRACT.md
      - docs/TURINGDESK-NATIVE-TECH-BASELINE.md
      - docs/TURINGDESK-PRODUCT-BASELINE.md
      - docs/TURINGDESK-DESKTOP-COMPLETION-PLAN.md
      - docs/NATIVE_SOURCE_LAYOUT.md
      - docs/WALLPAPER_ENGINE_PARITY.md
      - docs/DESKTOP_COMPOSITION_ARCHITECTURE.md
      - docs/DESKTOP_DOMAIN_ARCHITECTURE.md
      - docs/LIVELY_CPP_WALLPAPER_IMPLEMENTATION.md
      - docs/WIDGET_RUNTIME_HEALTH_M3.md
      - docs/WIDGET_ACCEPTANCE_SEQUENCE_M3.md
      - docs/WIDGET_ACCEPTANCE_EVIDENCE_M3.md
      - docs/WIDGET_PLACEMENT_HEALTH_M3.md
      - docs/WIDGET_PRODUCT_MODEL_M3.md
      - docs/WIDGET_INSTALLED_ACCEPTANCE_M3.md
      - scripts/deploy-native-arm64.ps1
      - scripts/update-turingdesk-arm64.ps1
      - scripts/prepare-third-party-runtime-arm64.ps1
      - scripts/verify-arm64-runtime-bundle.ps1
      - scripts/verify-arm64-updater-runtime-reuse.ps1
      - scripts/test-arm64-updater-junction-cleanup.ps1
      - scripts/verify-installed-widget-acceptance-contract.ps1
      - scripts/verify-l3-runtime-contract.ps1
      - scripts/verify-desktop-domain-contract.ps1
      - scripts/verify-desktop-shell-ownership.ps1
      - scripts/verify-native-source-layout.ps1
      - scripts/verify-desktop-ui-parity.ps1
      - scripts/verify-widget-product-model.ps1
      - scripts/verify-search-input-contract.ps1
      - scripts/run-widget-runtime-acceptance.ps1
      - scripts/run-installed-widget-acceptance.ps1
      - scripts/confirm-widget-visual-acceptance.ps1
      - scripts/seal-widget-acceptance-evidence.ps1
      - scripts/verify-widget-acceptance-evidence.ps1
      - scripts/verify-widget-acceptance-session-evidence.ps1
      - scripts/verify-widget-acceptance-evidence-verifier-contract.ps1
      - scripts/verify-widget-acceptance-contract.ps1
      - scripts/verify-runtime-log-paths.ps1
      - scripts/verify-windows-powershell-compat.ps1
      - scripts/pi-agent-e2e.mjs
      - DEPLOY-NATIVE-ARM64.cmd
      - UPDATE-TURINGDESK.cmd
      - .github/workflows/native-search-windows.yml
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete ARM64 validation suite
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-windows-arm64
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Analyze change scope
        id: scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checkout SHA mismatch: actual=$actual event=$env:GITHUB_SHA"
          }

          $forceFull = '${{ inputs.full }}' -eq 'true'
          $files = @()
          if ($forceFull) {
            $files = @('__FULL__')
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and '${{ github.event.before }}' -and '${{ github.event.before }}' -notmatch '^0+$') {
            $before = '${{ github.event.before }}'
            git cat-file -e "$before^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $files = @(git diff --name-only $before $env:GITHUB_SHA)
            }
          }

          if ($files.Count -eq 0) {
            git rev-parse "$env:GITHUB_SHA^" 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $files = @(git diff --name-only "$env:GITHUB_SHA^" $env:GITHUB_SHA)
            }
            else {
              $files = @('__FULL__')
            }
          }

          $files = @($files | ForEach-Object { $_.Trim().Replace('\\','/') } | Where-Object { $_ })
          Write-Host 'Changed files:'
          $files | ForEach-Object { Write-Host "  $_" }

          function Any([string[]]$Patterns) {
            if ($files -contains '__FULL__') { return $true }
            foreach ($file in $files) {
              foreach ($pattern in $Patterns) {
                if ($file -like $pattern) { return $true }
              }
            }
            return $false
          }

          $native = Any @('CMakeLists.txt', 'src/native/*')
          $scripts = Any @('scripts/*.ps1', 'scripts/*.mjs', '*.cmd')
          $search = Any @(
            'src/native/src/ui/search/*',
            'src/native/include/turingdesk/SearchWindow.h',
            'src/native/include/turingdesk/SearchTypes.h',
            'src/native/src/search/*',
            'src/native/include/turingdesk/AppSearch.h',
            'src/native/include/turingdesk/GozSearch.h',
            'scripts/verify-search-input-contract.ps1')
          $pi = Any @(
            'src/native/src/ui/ai/*',
            'src/native/include/turingdesk/L3CliWindow.h',
            'src/native/include/turingdesk/Conversation*',
            'src/native/src/agent/*',
            'src/native/include/turingdesk/L3Agent.h',
            'src/native/include/turingdesk/PiRuntime.h',
            'src/native/src/*Pi*',
            'src/native/src/*L3*',
            'src/native/src/*NativeTools*',
            'src/native/include/turingdesk/NativeTools.h',
            'scripts/pi-agent-e2e.mjs',
            'scripts/verify-l3-runtime-contract.ps1',
            'docs/L3-PI-RUNTIME-CONTRACT.md',
            'runtime/arm64/Pi/*',
            'runtime/arm64/Runtime/Node/*')
          $widget = Any @(
            'src/native/*Widget*',
            'src/native/**/*Widget*',
            'scripts/*widget*',
            'docs/WIDGET_*')
          $wallpaper = Any @(
            'src/native/*Wallpaper*',
            'src/native/**/*Wallpaper*',
            'docs/WALLPAPER_ENGINE_PARITY.md',
            'docs/LIVELY_CPP_WALLPAPER_IMPLEMENTATION.md')
          $shell = Any @(
            'src/native/*DesktopShell*',
            'src/native/**/*DesktopShell*',
            'scripts/verify-desktop-shell-ownership.ps1')
          $domain = Any @(
            'src/native/*DesktopControl*',
            'src/native/**/*DesktopControl*',
            'src/native/*Automation*',
            'src/native/**/*Automation*',
            'scripts/verify-desktop-domain-contract.ps1',
            'docs/DESKTOP_DOMAIN_ARCHITECTURE.md')
          $updater = Any @(
            'UPDATE-TURINGDESK.cmd',
            'DEPLOY-NATIVE-ARM64.cmd',
            'scripts/update-turingdesk-arm64.ps1',
            'scripts/deploy-native-arm64.ps1',
            'scripts/verify-arm64-updater-runtime-reuse.ps1',
            'scripts/test-arm64-updater-junction-cleanup.ps1')
          $runtimeBundle = Any @(
            'runtime/arm64/*',
            'scripts/prepare-third-party-runtime-arm64.ps1',
            'scripts/verify-arm64-runtime-bundle.ps1')
          $goz = Any @(
            'src/native/include/turingdesk/GozSearch.h',
            'src/native/**/*Goz*',
            'runtime/arm64/Goz/*')
          $harness = Any @(
            'src/native/include/turingdesk/Harness*',
            'src/native/**/*Harness*',
            'runtime/arm64/*Harness*')

          # Build whenever native code or a packaged ARM64 runtime component changed.
          $build = $native -or $runtimeBundle
          # Pi E2E is expensive; run only when the agent/tool/runtime path changed.
          $piE2E = $pi -or (Any @('runtime/arm64/Pi/*', 'runtime/arm64/Runtime/Node/*'))
          # Service integrations are intentionally isolated from ordinary UI work.
          $serviceE2E = $goz -or $harness

          $values = [ordered]@{
            native = $native
            scripts = $scripts
            search = $search
            pi = $pi
            widget = $widget
            wallpaper = $wallpaper
            shell = $shell
            domain = $domain
            updater = $updater
            runtime_bundle = $runtimeBundle
            goz = $goz
            harness = $harness
            build = $build
            pi_e2e = $piE2E
            service_e2e = $serviceE2E
          }

          foreach ($entry in $values.GetEnumerator()) {
            $value = if ($entry.Value) { 'true' } else { 'false' }
            "$($entry.Key)=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host ("{0,-16} {1}" -f $entry.Key, $value)
          }

      - name: Preflight contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Group([string]$Name, [scriptblock]$Action) {
            Write-Host "::group::$Name"
            try { & $Action }
            finally { Write-Host '::endgroup::' }
          }

          function Invoke-PS51([string]$Script) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $Script
            if ($LASTEXITCODE -ne 0) { throw "$Script failed with exit code $LASTEXITCODE" }
          }

          if ('${{ steps.scope.outputs.scripts }}' -eq 'true') {
            Invoke-Group 'Windows PowerShell compatibility' {
              Invoke-PS51 '.\scripts\verify-windows-powershell-compat.ps1'
            }
          }

          if ('${{ steps.scope.outputs.updater }}' -eq 'true') {
            Invoke-Group 'Updater contracts' {
              $env:TD_BOOTSTRAP_SELF_TEST = '1'
              $env:TD_UPDATE_URL = "https://raw.githubusercontent.com/GoodLoongStudio/TuringDesk/$env:GITHUB_SHA/scripts/update-turingdesk-arm64.ps1"
              & cmd.exe /d /c UPDATE-TURINGDESK.cmd
              if ($LASTEXITCODE -ne 0) { throw "Updater bootstrap failed: $LASTEXITCODE" }
              Invoke-PS51 '.\scripts\verify-arm64-updater-runtime-reuse.ps1'
              Invoke-PS51 '.\scripts\test-arm64-updater-junction-cleanup.ps1'
            }
          }

          if ('${{ steps.scope.outputs.native }}' -eq 'true') {
            Invoke-Group 'Native source layout' {
              Invoke-PS51 '.\scripts\verify-native-source-layout.ps1'
            }
          }

          if ('${{ steps.scope.outputs.search }}' -eq 'true') {
            Invoke-Group 'Search UI contract' {
              Invoke-PS51 '.\scripts\verify-search-input-contract.ps1'
            }
          }

          if ('${{ steps.scope.outputs.pi }}' -eq 'true') {
            Invoke-Group 'Pi-first runtime contract' {
              & pwsh -NoProfile -File '.\scripts\verify-l3-runtime-contract.ps1'
              if ($LASTEXITCODE -ne 0) { throw "Pi-first runtime contract failed: $LASTEXITCODE" }
            }
          }

          if ('${{ steps.scope.outputs.widget }}' -eq 'true') {
            Invoke-Group 'Widget contracts' {
              Invoke-PS51 '.\scripts\verify-installed-widget-acceptance-contract.ps1'
              Invoke-PS51 '.\scripts\verify-widget-product-model.ps1'
            }
          }

          if ('${{ steps.scope.outputs.shell }}' -eq 'true') {
            Invoke-Group 'DesktopShellHost ownership' {
              Invoke-PS51 '.\scripts\verify-desktop-shell-ownership.ps1'
            }
          }

          if ('${{ steps.scope.outputs.domain }}' -eq 'true') {
            Invoke-Group 'Desktop domain contract' {
              Invoke-PS51 '.\scripts\verify-desktop-domain-contract.ps1'
            }
          }

          if ('${{ steps.scope.outputs.runtime_bundle }}' -eq 'true') {
            Invoke-Group 'ARM64 RuntimeBundle contract' {
              $lock = 'runtime/arm64/runtime-lock.json'
              $manifest = 'runtime/arm64/runtime-manifest.json'
              if (-not (Test-Path $lock) -or -not (Test-Path $manifest)) {
                throw 'ARM64 RuntimeBundle is incomplete'
              }
              $hash = (Get-FileHash -Algorithm SHA256 $lock).Hash.ToLowerInvariant()
              $m = Get-Content $manifest -Raw | ConvertFrom-Json
              if ([int]$m.schema -lt 2 -or $m.lockSha256 -ne $hash -or -not $m.pi) {
                throw 'ARM64 RuntimeBundle is stale. Vendor ARM64 Runtime Bundle must succeed first.'
              }
              & pwsh -NoProfile -File '.\scripts\verify-arm64-runtime-bundle.ps1'
              if ($LASTEXITCODE -ne 0) { throw "RuntimeBundle verification failed: $LASTEXITCODE" }
            }
          }

          Write-Host 'Scoped preflight complete.'

      - name: Build ARM64
        if: steps.scope.outputs.build == 'true'
        shell: pwsh
        run: |
          Write-Host '::group::Configure ARM64 offline'
          cmake -S . -B build -A ARM64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }
          Write-Host '::endgroup::'

          Write-Host '::group::Compile Release'
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "ARM64 build failed: $LASTEXITCODE" }
          Write-Host '::endgroup::'

      - name: Self-test and package
        if: steps.scope.outputs.build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '::group::Relevant native self-tests'
          $tests = @(
            @{ Exe = '.\build\src\native\Release\TuringDesk.exe'; Name = 'TuringDesk' }
          )
          if ('${{ steps.scope.outputs.wallpaper }}' -eq 'true') {
            $tests += @{ Exe = '.\build\src\native\Release\TuringDeskWallpaper.exe'; Name = 'Wallpaper' }
          }
          if ('${{ steps.scope.outputs.harness }}' -eq 'true') {
            $tests += @{ Exe = '.\build\src\native\Release\TuringDeskHarness.exe'; Name = 'Harness shell' }
          }
          foreach ($test in $tests) {
            $p = Start-Process -FilePath $test.Exe -ArgumentList '--self-test' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$($test.Name) self-test failed: $($p.ExitCode)" }
          }
          Write-Host '::endgroup::'

          Write-Host '::group::Prepare ARM64 package'
          New-Item -ItemType Directory -Force -Path build/package | Out-Null
          foreach ($name in @('TuringDesk.exe','TuringDeskWallpaper.exe','TuringDeskHarness.exe','TuringDeskWidgetAcceptance.exe')) {
            $source = Join-Path 'build/src/native/Release' $name
            if (Test-Path $source) { Copy-Item $source (Join-Path 'build/package' $name) -Force }
          }
          .\scripts\prepare-third-party-runtime-arm64.ps1 -DeployDir (Resolve-Path build/package).Path -SkipGozServiceInstall
          Write-Host '::endgroup::'

      - name: Pi runtime integration
        if: steps.scope.outputs.pi_e2e == 'true' && steps.scope.outputs.build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = (Resolve-Path '.\build\package\Runtime\Node\node.exe').Path
          $pi = (Resolve-Path '.\build\package\Pi\node_modules\@earendil-works\pi-coding-agent\dist\cli.js').Path

          Write-Host '::group::Bundled Pi runtime'
          & $node --version | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Node failed --version' }
          & $node $pi --version | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Pi failed --version' }
          Write-Host '::endgroup::'

          Write-Host '::group::Pi RPC + native tools E2E'
          $nativeHost = (Resolve-Path '.\build\package\TuringDesk.exe').Path
          $extensionSource = Join-Path $env:LOCALAPPDATA 'TuringDesk\PiAgent\extensions\turingdesk-native-tools.ts'
          if (-not (Test-Path $extensionSource -PathType Leaf)) {
            throw 'TuringDesk self-test did not materialize the Pi native tools extension.'
          }
          $desktop = [Environment]::GetFolderPath('Desktop')
          if ([string]::IsNullOrWhiteSpace($desktop)) { throw 'Unable to resolve Desktop known folder for Pi E2E.' }
          $work = Join-Path $env:RUNNER_TEMP ('turingdesk-pi-e2e-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $powershell = (Get-Command powershell.exe -ErrorAction Stop).Source
          $testScript = (Resolve-Path '.\scripts\pi-agent-e2e.mjs').Path
          & $node $testScript $work $pi $powershell $nativeHost $extensionSource $desktop | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Pi Agent + TuringDesk native tool E2E failed' }
          Write-Host '::endgroup::'

      - name: Windows service integrations
        if: steps.scope.outputs.service_e2e == 'true' && steps.scope.outputs.build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ('${{ steps.scope.outputs.goz }}' -eq 'true') {
            Write-Host '::group::goz MFT/USN integration'
            $goz = (Resolve-Path '.\build\package\Goz\goz.exe').Path
            $gozd = (Resolve-Path '.\build\package\Goz\gozd.exe').Path
            $probe = "turingdesk-goz-ci-$env:GITHUB_RUN_ID.txt"
            $probePath = Join-Path $env:USERPROFILE $probe
            Set-Content $probePath -Value 'TuringDesk goz integration probe' -Encoding UTF8
            try {
              & $gozd install | Out-Host
              if ($LASTEXITCODE -ne 0) { throw 'gozd service install failed on ARM64 runner' }
              $found = $false
              for ($i = 0; $i -lt 90; $i++) {
                $result = (& $goz -n 20 $probe 2>$null | Out-String)
                if ($LASTEXITCODE -eq 0 -and $result -match [regex]::Escape($probe)) { $found = $true; break }
                Start-Sleep -Seconds 1
              }
              if (-not $found) { throw 'goz did not return the USN/MFT probe file on ARM64' }
            }
            finally {
              Remove-Item $probePath -Force -ErrorAction SilentlyContinue
              & $gozd uninstall | Out-Host
            }
            Write-Host '::endgroup::'
          }

          if ('${{ steps.scope.outputs.harness }}' -eq 'true') {
            Write-Host '::group::Bundled DeepSeek Harness smoke test'
            $p = Start-Process -FilePath '.\build\package\TuringDeskHarness.exe' -ArgumentList '--harness-smoke-test' -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              $desktop = [Environment]::GetFolderPath('Desktop')
              $log = Join-Path $desktop 'TuringDesk-Logs\harness.log'
              if (Test-Path $log) { Get-Content $log -Tail 200 | Out-Host }
              throw "Bundled DeepSeek Harness smoke test failed: $($p.ExitCode)"
            }
            Write-Host '::endgroup::'
          }

      - name: Prepare compact artifact
        if: steps.scope.outputs.build == 'true'
        shell: pwsh
        run: |
          Remove-Item build/package/Runtime -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/package/Pi -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/package/Goz -Recurse -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.build == 'true'
        with:
          name: TuringDesk-Native-Search-ARM64
          path: build/package/**
          retention-days: 3
