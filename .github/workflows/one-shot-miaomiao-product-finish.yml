name: One-shot 妙喵 product finish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-miaomiao-product-finish.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply product finish patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8', newline='\n')

          def replace_required(text, old, new, label, count=None):
              hits = text.count(old)
              if hits == 0:
                  raise SystemExit(f'missing patch anchor: {label}')
              if count is not None and hits != count:
                  raise SystemExit(f'unexpected patch anchor count for {label}: {hits}')
              return text.replace(old, new, 1 if count == 1 else -1)

          # 1) One public product brand. Keep internal executable/class/repo names TuringDesk.
          runtime_exts = {'.cpp', '.h', '.hpp', '.inc', '.rc'}
          brand_files = 0
          for path in (root / 'src/native').rglob('*'):
              if path.is_file() and path.suffix.lower() in runtime_exts:
                  text = path.read_text(encoding='utf-8')
                  updated = text.replace('图灵智能桌面', '妙喵').replace('图灵 AI', '妙喵 AI')
                  if updated != text:
                      path.write_text(updated, encoding='utf-8', newline='\n')
                      brand_files += 1
          if brand_files == 0:
              raise SystemExit('brand replacement changed no runtime files')

          # 2) Saved API key is visibly masked, while the mask remains a UI sentinel and is never saved as a key.
          ai_path = 'src/native/src/ui/settings/DesktopAiSettingsPage.cpp'
          ai = read(ai_path)
          if 'kStoredKeyMask' not in ai:
              ai = replace_required(
                  ai,
                  'constexpr int kOpenHarnessId = 7305;\n',
                  'constexpr int kOpenHarnessId = 7305;\nconstexpr wchar_t kStoredKeyMask[] = L"********";\n',
                  'API key mask constant',
                  1)
              ai = replace_required(
                  ai,
                  '        SetWindowTextW(apiKey, L"");\n',
                  '        SetWindowTextW(apiKey, agent.HasStoredApiKey() ? kStoredKeyMask : L"");\n',
                  'saved API key visual mask',
                  1)
              ai = replace_required(
                  ai,
                  '        const std::wstring key = WindowText(apiKey);\n',
                  '        std::wstring key = WindowText(apiKey);\n        if (key == kStoredKeyMask) key.clear();\n',
                  'API key sentinel normalization',
                  1)
          write(ai_path, ai)

          # 3) Only the main 妙喵 process owns a notification-area icon. Wallpaper legacy tray calls are no-ops in production.
          engine_path = 'src/native/src/desktop/wallpaper/legacy/WallpaperEngineProduction.cpp'
          engine = read(engine_path)
          if 'TuringDeskWallpaperShellNotifyIconW' not in engine:
              engine = replace_required(
                  engine,
                  '#include <windows.h>\n',
                  '#include <windows.h>\n#include <shellapi.h>\n',
                  'shellapi include',
                  1)
              engine = replace_required(
                  engine,
                  'namespace {\n\n',
                  'namespace {\n\nBOOL WINAPI TuringDeskWallpaperShellNotifyIconW(DWORD, PNOTIFYICONDATAW) {\n    // Production has exactly one tray owner: the main 妙喵 process.\n    // The legacy wallpaper host may still execute historical tray code, but\n    // those calls must never create, modify, version, or remove a tray icon.\n    return TRUE;\n}\n\n',
                  'wallpaper tray suppression',
                  1)
              engine = replace_required(
                  engine,
                  '#define MessageBoxW TuringDeskMessageBoxW\n#include "WallpaperEngine.cpp"\n#undef MessageBoxW\n',
                  '#define MessageBoxW TuringDeskMessageBoxW\n#define Shell_NotifyIconW TuringDeskWallpaperShellNotifyIconW\n#include "WallpaperEngine.cpp"\n#undef Shell_NotifyIconW\n#undef MessageBoxW\n',
                  'wallpaper tray macro',
                  1)
          write(engine_path, engine)

          # 4) Four-corner/edge resize lives in the canonical V2 WndProc, not a production wrapper.
          v2_path = 'src/native/src/ui/wallpaper/WallpaperLibraryWindowV2.cpp'
          v2 = read(v2_path)
          if 'case WM_NCHITTEST:' not in v2:
              anchor = '        switch (message) {\n        case WM_GETMINMAXINFO: {\n'
              hit_test = '''        switch (message) {\n        case WM_NCHITTEST: {\n            if (IsZoomed(hwnd)) break;\n            RECT bounds{};\n            if (!GetWindowRect(hwnd, &bounds)) break;\n\n            const POINT point{GET_X_LPARAM(lParam), GET_Y_LPARAM(lParam)};\n            const UINT dpi = self->Dpi();\n            const int systemX = GetSystemMetricsForDpi(SM_CXSIZEFRAME, dpi) +\n                                GetSystemMetricsForDpi(SM_CXPADDEDBORDER, dpi);\n            const int systemY = GetSystemMetricsForDpi(SM_CYSIZEFRAME, dpi) +\n                                GetSystemMetricsForDpi(SM_CXPADDEDBORDER, dpi);\n            const int edgeX = std::max(self->S(7), systemX);\n            const int edgeY = std::max(self->S(7), systemY);\n            const int cornerX = std::max(edgeX, self->S(16));\n            const int cornerY = std::max(edgeY, self->S(16));\n\n            const bool leftEdge = point.x >= bounds.left && point.x < bounds.left + edgeX;\n            const bool rightEdge = point.x < bounds.right && point.x >= bounds.right - edgeX;\n            const bool topEdge = point.y >= bounds.top && point.y < bounds.top + edgeY;\n            const bool bottomEdge = point.y < bounds.bottom && point.y >= bounds.bottom - edgeY;\n            const bool leftCorner = point.x >= bounds.left && point.x < bounds.left + cornerX;\n            const bool rightCorner = point.x < bounds.right && point.x >= bounds.right - cornerX;\n            const bool topCorner = point.y >= bounds.top && point.y < bounds.top + cornerY;\n            const bool bottomCorner = point.y < bounds.bottom && point.y >= bounds.bottom - cornerY;\n\n            if (topCorner && leftCorner) return HTTOPLEFT;\n            if (topCorner && rightCorner) return HTTOPRIGHT;\n            if (bottomCorner && leftCorner) return HTBOTTOMLEFT;\n            if (bottomCorner && rightCorner) return HTBOTTOMRIGHT;\n            if (leftEdge) return HTLEFT;\n            if (rightEdge) return HTRIGHT;\n            if (topEdge) return HTTOP;\n            if (bottomEdge) return HTBOTTOM;\n            break;\n        }\n        case WM_GETMINMAXINFO: {\n'''
              v2 = replace_required(v2, anchor, hit_test, 'canonical resize hit test', 1)
          write(v2_path, v2)

          # 5) ARM64 MSIX store/test packaging skeleton.
          manifest_path = root / 'packaging/windows-store/AppxManifest.xml.in'
          manifest_path.parent.mkdir(parents=True, exist_ok=True)
          manifest_path.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<Package\n  xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"\n  xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"\n  xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"\n  IgnorableNamespaces="uap rescap">\n  <Identity Name="__PACKAGE_NAME__" Publisher="__PUBLISHER__" Version="__VERSION__" ProcessorArchitecture="arm64" />\n  <Properties>\n    <DisplayName>妙喵</DisplayName>\n    <PublisherDisplayName>GoodLoongStudio</PublisherDisplayName>\n    <Description>妙喵 AI 桌面</Description>\n    <Logo>Assets\\StoreLogo.png</Logo>\n  </Properties>\n  <Dependencies>\n    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.19041.0" MaxVersionTested="10.0.26100.0" />\n  </Dependencies>\n  <Applications>\n    <Application Id="MiaoMiao" Executable="TuringDesk.exe" EntryPoint="Windows.FullTrustApplication">\n      <uap:VisualElements\n        DisplayName="妙喵"\n        Description="妙喵 AI 桌面"\n        BackgroundColor="transparent"\n        Square150x150Logo="Assets\\Square150x150Logo.png"\n        Square44x44Logo="Assets\\Square44x44Logo.png">\n        <uap:DefaultTile Wide310x150Logo="Assets\\Wide310x150Logo.png" />\n      </uap:VisualElements>\n    </Application>\n  </Applications>\n  <Capabilities>\n    <rescap:Capability Name="runFullTrust" />\n  </Capabilities>\n</Package>\n''', encoding='utf-8', newline='\n')

          msix_script = root / 'scripts/build-arm64-msix.ps1'
          msix_script.write_text(r'''param(\n    [Parameter(Mandatory = $true)][string]$InputDirectory,\n    [string]$OutputPath = (Join-Path $PWD 'artifacts\\miaomiao-arm64.msix'),\n    [string]$Version = '0.1.0.0',\n    [string]$Publisher = 'CN=GoodLoongStudio',\n    [string]$PackageName = 'GoodLoongStudio.MiaoMiao'\n)\n\n$ErrorActionPreference = 'Stop'\nSet-StrictMode -Version Latest\n\n$input = (Resolve-Path $InputDirectory).Path\nif (-not (Test-Path (Join-Path $input 'TuringDesk.exe') -PathType Leaf)) {\n    throw 'InputDirectory must contain TuringDesk.exe.'\n}\nforeach ($required in @('TuringDeskWallpaper.exe', 'TuringDeskHarness.exe')) {\n    if (-not (Test-Path (Join-Path $input $required) -PathType Leaf)) {\n        throw "InputDirectory is missing $required."\n    }\n}\nif ($Version -notmatch '^\\d+\\.\\d+\\.\\d+\\.\\d+$') { throw 'Version must be four numeric parts, e.g. 0.1.0.0.' }\n\n$repo = Split-Path $PSScriptRoot -Parent\n$template = Join-Path $repo 'packaging\\windows-store\\AppxManifest.xml.in'\nif (-not (Test-Path $template -PathType Leaf)) { throw "Missing manifest template: $template" }\n\n$stage = Join-Path $env:TEMP ("miaomiao-msix-" + [guid]::NewGuid().ToString('N'))\nNew-Item -ItemType Directory -Force -Path $stage | Out-Null\ntry {\n    Copy-Item (Join-Path $input '*') $stage -Recurse -Force\n\n    $manifest = Get-Content $template -Raw -Encoding UTF8\n    $manifest = $manifest.Replace('__PACKAGE_NAME__', $PackageName).Replace('__PUBLISHER__', $Publisher).Replace('__VERSION__', $Version)\n    Set-Content -Path (Join-Path $stage 'AppxManifest.xml') -Value $manifest -Encoding UTF8\n\n    $assets = Join-Path $stage 'Assets'\n    New-Item -ItemType Directory -Force -Path $assets | Out-Null\n    Add-Type -AssemblyName System.Drawing\n    function New-MiaoMiaoLogo([string]$Path, [int]$Width, [int]$Height) {\n        $bitmap = New-Object System.Drawing.Bitmap $Width, $Height\n        try {\n            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)\n            try {\n                $graphics.Clear([System.Drawing.Color]::FromArgb(255, 245, 246, 248))\n                $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255, 35, 38, 45))\n                try {\n                    $fontSize = [Math]::Max(12, [Math]::Min($Width, $Height) * 0.36)\n                    $font = New-Object System.Drawing.Font 'Segoe UI', $fontSize, ([System.Drawing.FontStyle]::Bold), ([System.Drawing.GraphicsUnit]::Pixel)\n                    try {\n                        $format = New-Object System.Drawing.StringFormat\n                        $format.Alignment = [System.Drawing.StringAlignment]::Center\n                        $format.LineAlignment = [System.Drawing.StringAlignment]::Center\n                        $graphics.DrawString('M', $font, $brush, (New-Object System.Drawing.RectangleF 0,0,$Width,$Height), $format)\n                    } finally { $font.Dispose() }\n                } finally { $brush.Dispose() }\n            } finally { $graphics.Dispose() }\n            $bitmap.Save($Path, [System.Drawing.Imaging.ImageFormat]::Png)\n        } finally { $bitmap.Dispose() }\n    }\n    New-MiaoMiaoLogo (Join-Path $assets 'StoreLogo.png') 50 50\n    New-MiaoMiaoLogo (Join-Path $assets 'Square44x44Logo.png') 44 44\n    New-MiaoMiaoLogo (Join-Path $assets 'Square150x150Logo.png') 150 150\n    New-MiaoMiaoLogo (Join-Path $assets 'Wide310x150Logo.png') 310 150\n\n    $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\\10\\bin'\n    $makeAppx = Get-ChildItem $sdkBin -Recurse -Filter MakeAppx.exe -File |\n        Where-Object { $_.FullName -match '\\x64\\MakeAppx\\.exe$|\\x64\\MakeAppx.exe$' } |\n        Sort-Object FullName -Descending | Select-Object -First 1\n    if (-not $makeAppx) {\n        $makeAppx = Get-ChildItem $sdkBin -Recurse -Filter MakeAppx.exe -File | Sort-Object FullName -Descending | Select-Object -First 1\n    }\n    if (-not $makeAppx) { throw 'MakeAppx.exe was not found in the Windows SDK.' }\n\n    $outputDir = Split-Path $OutputPath -Parent\n    if ($outputDir) { New-Item -ItemType Directory -Force -Path $outputDir | Out-Null }\n    & $makeAppx.FullName pack /d $stage /p $OutputPath /o\n    if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed with exit code $LASTEXITCODE." }\n    Write-Host "MSIX created: $OutputPath"\n} finally {\n    Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue\n}\n'''.replace('\\n', '\n'), encoding='utf-8', newline='\n')

          # Make the existing ARM64 Preview produce a test MSIX automatically as a second artifact.
          preview_path = '.github/workflows/native-arm64-preview.yml'
          preview = read(preview_path)
          if 'packaging/windows-store/**' not in preview:
              preview = replace_required(
                  preview,
                  '      - src/native/**\n      - vcpkg.json\n',
                  '      - src/native/**\n      - packaging/windows-store/**\n      - scripts/build-arm64-msix.ps1\n      - vcpkg.json\n',
                  'ARM64 preview packaging paths',
                  1)
          if 'Build ARM64 MSIX test package' not in preview:
              marker = '''      - name: Upload lightweight preview\n        uses: actions/upload-artifact@v4\n'''
              package_steps = '''      - name: Build ARM64 MSIX test package\n        shell: pwsh\n        run: |\n          & "$PWD\\scripts\\build-arm64-msix.ps1" `\n            -InputDirectory "$PWD\\preview-arm64" `\n            -OutputPath "$PWD\\miaomiao-arm64.msix" `\n            -Version '0.1.0.0'\n\n      - name: Upload ARM64 MSIX test package\n        uses: actions/upload-artifact@v4\n        with:\n          name: miaomiao-arm64-msix-${{ github.sha }}\n          path: miaomiao-arm64.msix\n          if-no-files-found: error\n          retention-days: 7\n\n      - name: Upload lightweight preview\n        uses: actions/upload-artifact@v4\n'''
              preview = replace_required(preview, marker, package_steps, 'ARM64 MSIX artifact steps', 1)
          write(preview_path, preview)

          # Self-delete: this is a migration task, not a permanent second delivery path.
          one_shot = root / '.github/workflows/one-shot-miaomiao-product-finish.yml'
          if one_shot.exists():
              one_shot.unlink()

          # Cheap structural guards before commit.
          checks = {
              ai_path: ['kStoredKeyMask', 'if (key == kStoredKeyMask) key.clear();'],
              engine_path: ['TuringDeskWallpaperShellNotifyIconW', '#define Shell_NotifyIconW TuringDeskWallpaperShellNotifyIconW'],
              v2_path: ['case WM_NCHITTEST:', 'HTTOPLEFT', 'HTBOTTOMRIGHT'],
              preview_path: ['Build ARM64 MSIX test package', 'miaomiao-arm64-msix-${{ github.sha }}'],
              'packaging/windows-store/AppxManifest.xml.in': ['DisplayName>妙喵<', 'ProcessorArchitecture="arm64"'],
              'scripts/build-arm64-msix.ps1': ['MakeAppx.exe', 'TuringDeskWallpaper.exe', 'TuringDeskHarness.exe'],
          }
          for path, needles in checks.items():
              text = read(path)
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'guard failed: {needle} missing from {path}')
          print(f'patched runtime brand in {brand_files} files')
          PY

      - name: Commit finished product shell
        shell: bash
        run: |
          git config user.name "GoodLoongStudio"
          git config user.email "chnmlong@hotmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish 妙喵 product shell and ARM64 MSIX"
          git push origin HEAD:main
