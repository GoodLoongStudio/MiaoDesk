name: Fix Codex Chat Routing

on:
  push:
    branches: [main]
    paths:
      - .github/fix-codex-chat-routing.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Force Chat Completions through relay
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/native/src/CodexRuntime.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''std::wstring OpenAiResponsesBase(const L3Agent& agent) {
    auto url = Trim(agent.CurrentApiUrl());
    if (url.empty()) return {};
    const auto provider = Lower(agent.Config().providerId);
    if (EndsWithInsensitive(url, L"/responses")) return StripResponsesSuffix(url);
    if (provider == L"openai" && EndsWithInsensitive(url, L"/chat/completions")) {
        url.resize(url.size() - std::wstring(L"/chat/completions").size());
        while (url.size() > 1 && url.back() == L'/') url.pop_back();
        return url;
    }
    return {};
}'''
          new = '''std::wstring OpenAiResponsesBase(const L3Agent& agent) {
    auto url = Trim(agent.CurrentApiUrl());
    if (url.empty()) return {};
    // Only an explicitly configured Responses endpoint is safe to use directly.
    // A /chat/completions endpoint must always go through codex-relay, even when
    // the provider id is "openai" (that id is also used for OpenAI-compatible
    // providers such as DeepSeek in the TuringDesk settings UI).
    if (EndsWithInsensitive(url, L"/responses")) return StripResponsesSuffix(url);
    return {};
}'''
          if old not in s:
              raise SystemExit('OpenAiResponsesBase anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Guard routing invariant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/native/src/CodexRuntime.cpp').read_text(encoding='utf-8')
          start=s.index('std::wstring OpenAiResponsesBase')
          end=s.index('std::wstring ChatCompletionsBase', start)
          block=s[start:end]
          assert '/chat/completions' not in block
          assert 'provider == L"openai"' not in block
          assert 'EndsWithInsensitive(url, L"/responses")' in block
          PY
      - name: Commit and self-remove
        shell: bash
        run: |
          rm -f .github/workflows/fix-codex-chat-routing.yml .github/fix-codex-chat-routing.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: route Chat Completions providers through Codex Relay"
          git pull --rebase origin main
          git push origin HEAD:main
