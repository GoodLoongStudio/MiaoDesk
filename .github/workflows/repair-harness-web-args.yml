name: Repair Harness web launch contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-harness-web-args.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch supported Harness web args
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/native/src/HarnessProcessManager.cpp')
          s = p.read_text(encoding='utf-8')
          before = s
          s = s.replace('constexpr wchar_t kHarnessArgs[] = L"web --host 127.0.0.1 --port 3080 --no-open";',
                        'constexpr wchar_t kHarnessArgs[] = L"web --host 127.0.0.1 --port 3080";')
          s = s.replace('WriteLogLine(logHandle, L"[TuringDesk] external browser: disabled by --no-open; UI is hosted by TuringDesk WebView2");',
                        'WriteLogLine(logHandle, L"[TuringDesk] browser launch: TuringDesk does not invoke an external browser; UI is hosted by TuringDesk WebView2");')
          s = s.replace('lib\\\\bin.js web --host 127.0.0.1 --port 3080 --no-open";',
                        'lib\\\\bin.js web --host 127.0.0.1 --port 3080";')
          s = s.replace('           dshCommand.find(L"--no-open") != std::wstring::npos &&\n',
                        '           dshCommand.find(L"--no-open") == std::wstring::npos &&\n')
          s = s.replace('           BuildLaunchCommand().find(L"--no-open") != std::wstring::npos &&\n',
                        '           BuildLaunchCommand().find(L"--no-open") == std::wstring::npos &&\n')
          if s == before:
              raise SystemExit('Harness patch made no changes')
          if '--no-open' in s and 'find(L"--no-open") == std::wstring::npos' not in s:
              raise SystemExit('unsupported --no-open launch flag still present')
          if 'web --host 127.0.0.1 --port 3080' not in s:
              raise SystemExit('loopback Harness binding missing')
          p.write_text(s, encoding='utf-8')

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/repair-harness-web-args.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/src/HarnessProcessManager.cpp .github/workflows/repair-harness-web-args.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: launch Harness with supported web arguments"
          git push origin HEAD:main
