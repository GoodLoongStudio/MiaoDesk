  <text x="374" y="260" font-family="Segoe UI, sans-serif" font-size="17" fill="#445268">好，我先看看桌面上有哪些截图。</text>

  <rect x="370" y="286" width="430" height="160" rx="20" fill="#ffffff" fill-opacity="0.44" stroke="#ffffff" stroke-opacity="0.70"/>
  <text x="396" y="322" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#3e4d63">整理桌面截图</text>
