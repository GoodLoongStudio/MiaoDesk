  <path d="M760 590 v13 m-6-8 v7 a6 6 0 0 0 12 0 v-7" fill="none" stroke="#6f7d90" stroke-width="2" stroke-linecap="round"/>
  <circle cx="808" cy="601" r="20" fill="#8dbdff"/>
  <path d="M800 601 h16 M808 593 v16" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

