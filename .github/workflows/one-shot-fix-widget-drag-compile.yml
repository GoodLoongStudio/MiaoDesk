name: One-shot fix widget drag compile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-widget-drag-compile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix MSVC LONG/int template deduction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/native/src/desktop/wallpaper/web/WebDesktopSurfaceChild.cpp')
          text = path.read_text(encoding='utf-8')
          old = "            const int gripW = std::min(48, std::max(24, rect.right - rect.left - 12));\n            const int center = (rect.left + rect.right) / 2;"
          new = "            const LONG gripW = std::clamp<LONG>(rect.right - rect.left - 12, 24L, 48L);\n            const LONG center = (rect.left + rect.right) / 2;"
          if text.count(old) != 1:
              raise SystemExit(f'expected one compile-fix anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "GoodLoongStudio"
          git config user.email "chnmlong@hotmail.com"
          git add src/native/src/desktop/wallpaper/web/WebDesktopSurfaceChild.cpp
          git diff --cached --check
          git commit -m "Fix widget drag ARM64 compile"
          git push origin HEAD:main
