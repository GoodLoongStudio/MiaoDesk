name: Report Native ARM64 Status

on:
  workflow_run:
    workflows: ["Native Windows ARM64"]
    types: [completed]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci-status
          fetch-depth: 0

      - name: Write ARM64 build status
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          mkdir -p ci
          cat > "ci/native-arm64-${HEAD_SHA}.json" <<EOF
          {
            "sha": "${HEAD_SHA}",
            "workflow": "Native Windows ARM64",
            "result": "${CONCLUSION}",
            "run_id": "${RUN_ID}",
            "run_attempt": "${RUN_ATTEMPT}",
            "source_event": "${EVENT_NAME}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci/native-arm64-${HEAD_SHA}.json"
          git commit -m "ci: report Native ARM64 ${HEAD_SHA}" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin ci-status || true
            if git push origin HEAD:ci-status; then exit 0; fi
            sleep 2
          done
          exit 1
