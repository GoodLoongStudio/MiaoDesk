name: Apply API center service priority polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-api-center-service-priority.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply API center priority and visual polish
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/native/src/ui/settings/DesktopAiSettingsPage.cpp')
          text = path.read_text(encoding='utf-8')

          old = '''    bool ProfileConfigured(const ApiProfile& profile) const {
              if (profile.baseUrl.empty() || profile.model.empty()) return false;
              return !profile.NeedsKey() || store.HasKey(profile);
          }

          void SetStatus(std::wstring text, bool ok) {
          '''
          new = '''    bool ProfileConfigured(const ApiProfile& profile) const {
              if (profile.baseUrl.empty() || profile.model.empty()) return false;
              return !profile.NeedsKey() || store.HasKey(profile);
          }

          int ProfilePriority(const ApiProfile& profile) const {
              const bool configured = ProfileConfigured(profile);
              if (profile.isDefault && configured) return 0;
              if (configured && profile.lastOk) return 1;
              if (configured) return 2;
              if (profile.isDefault || profile.lastOk) return 3;
              return 4;
          }

          void SortProfilesForDisplay(std::wstring preferredId = {}) {
              if (profiles.empty()) return;
              if (preferredId.empty() && selected < profiles.size()) preferredId = profiles[selected].id;
              std::stable_sort(profiles.begin(), profiles.end(), [&](const ApiProfile& a, const ApiProfile& b) {
                  return ProfilePriority(a) < ProfilePriority(b);
              });
              if (!preferredId.empty()) {
                  const auto it = std::find_if(profiles.begin(), profiles.end(), [&](const ApiProfile& profile) {
                      return _wcsicmp(profile.id.c_str(), preferredId.c_str()) == 0;
                  });
                  if (it != profiles.end()) selected = static_cast<std::size_t>(std::distance(profiles.begin(), it));
              }
          }

          void SetStatus(std::wstring text, bool ok) {
          '''
          if old not in text:
              raise SystemExit('ProfileConfigured anchor not found')
          text = text.replace(old, new, 1)

          old = '''    void LoadProfiles() {
              profiles = store.Load(agent);
              if (profiles.empty()) return;
              const auto it = std::find_if(profiles.begin(), profiles.end(), [](const ApiProfile& p) { return p.isDefault; });
              selected = it == profiles.end() ? 0 : static_cast<std::size_t>(std::distance(profiles.begin(), it));
              RebuildList();
              LoadForm();
          }
          '''
          new = '''    void LoadProfiles() {
              profiles = store.Load(agent);
              if (profiles.empty()) return;
              const auto it = std::find_if(profiles.begin(), profiles.end(), [](const ApiProfile& p) { return p.isDefault; });
              std::wstring preferredId = it == profiles.end() ? profiles.front().id : it->id;
              selected = 0;
              SortProfilesForDisplay(preferredId);
              RebuildList();
              LoadForm();
          }
          '''
          if old not in text:
              raise SystemExit('LoadProfiles anchor not found')
          text = text.replace(old, new, 1)

          old = '''        profiles[selected] = profile;
              store.SaveAll(profiles);
              RebuildList();
              LoadForm();
          '''
          new = '''        const std::wstring selectedId = profile.id;
              profiles[selected] = profile;
              store.SaveAll(profiles);
              SortProfilesForDisplay(selectedId);
              RebuildList();
              LoadForm();
          '''
          if old not in text:
              raise SystemExit('PersistForm save anchor not found')
          text = text.replace(old, new, 1)

          old = '''        profiles[selected] = profile;
              store.Save(profile);
              RebuildList();
              SetStatus(profile.lastMessage, probe.ok);
          '''
          new = '''        const std::wstring selectedId = profile.id;
              profiles[selected] = profile;
              store.Save(profile);
              SortProfilesForDisplay(selectedId);
              RebuildList();
              SetStatus(profile.lastMessage, probe.ok);
          '''
          if old not in text:
              raise SystemExit('TestConnection anchor not found')
          text = text.replace(old, new, 1)

          old = '''        RebuildList();
              LoadForm();
              SetStatus(L"配置已删除。", true);
          '''
          new = '''        SortProfilesForDisplay();
              RebuildList();
              LoadForm();
              SetStatus(L"配置已删除。", true);
          '''
          if old not in text:
              raise SystemExit('DeleteProfile anchor not found')
          text = text.replace(old, new, 1)

          old = '''    void DrawProfileItem(const DRAWITEMSTRUCT& draw) {
          '''
          new = '''    void DrawActionButton(const DRAWITEMSTRUCT& draw) {
              RECT rect = draw.rcItem;
              InflateRect(&rect, -S(1), -S(1));
              const int id = static_cast<int>(draw.CtlID);
              const bool pressed = (draw.itemState & ODS_SELECTED) != 0;
              const bool disabled = (draw.itemState & ODS_DISABLED) != 0;
              COLORREF background = RGB(249, 252, 255);
              COLORREF border = RGB(199, 216, 240);
              COLORREF textColor = RGB(45, 92, 166);

              if (id == kNewId || id == kSaveId) {
                  background = pressed ? RGB(31, 102, 226) : RGB(43, 118, 246);
                  border = background;
                  textColor = RGB(255, 255, 255);
              } else if (id == kDeleteId) {
                  background = pressed ? RGB(255, 241, 242) : RGB(253, 254, 255);
                  border = RGB(247, 205, 209);
                  textColor = RGB(224, 52, 61);
              } else if (id == kRevealId || id == kCopyId) {
                  background = pressed ? RGB(235, 243, 255) : RGB(248, 251, 255);
                  border = RGB(220, 231, 246);
                  textColor = RGB(57, 88, 139);
              } else if (pressed) {
                  background = RGB(237, 245, 255);
              }
              if (disabled) {
                  background = RGB(242, 245, 249);
                  border = RGB(225, 231, 239);
                  textColor = RGB(151, 164, 184);
              }

              RoundFill(draw.hDC, rect, S(10), background, border);
              DrawTextSimple(draw.hDC, bodyFont, textColor, WindowText(draw.hwndItem), rect,
                             DT_CENTER | DT_VCENTER | DT_SINGLELINE);
              if (draw.itemState & ODS_FOCUS) {
                  RECT focus = rect;
                  InflateRect(&focus, -S(4), -S(4));
                  DrawFocusRect(draw.hDC, &focus);
              }
          }

          void DrawProfileItem(const DRAWITEMSTRUCT& draw) {
          '''
          if old not in text:
              raise SystemExit('DrawProfileItem anchor not found')
          text = text.replace(old, new, 1)

          old = '''        HBRUSH dot = CreateSolidBrush(profile.lastMessage.empty() ? RGB(160, 174, 198) :
                                            (profile.lastOk ? RGB(25, 190, 105) : RGB(235, 66, 66)));
          '''
          new = '''        const bool explicitFailure = profile.lastMessage.find(L"失败") != std::wstring::npos ||
                                     profile.lastMessage.find(L"异常") != std::wstring::npos;
              const COLORREF dotColor = configured
                  ? (profile.lastOk ? RGB(25, 190, 105) : RGB(63, 126, 246))
                  : (profile.lastOk ? RGB(25, 190, 105) : (explicitFailure ? RGB(235, 66, 66) : RGB(160, 174, 198)));
              HBRUSH dot = CreateSolidBrush(dotColor);
          '''
          if old not in text:
              raise SystemExit('profile dot anchor not found')
          text = text.replace(old, new, 1)

          old = '''        RECT titleRect{rect.left + S(32), rect.top + S(9), rect.right - S(92), rect.top + S(34)};
              DrawTextSimple(dc, headingFont, RGB(24, 47, 86), profile.name, titleRect);
              std::wstring subtitle;
              if (profile.isDefault) subtitle = L"默认对话服务";
              else if (!configured) subtitle = profile.lastMessage.empty() ? L"等待配置" : profile.lastMessage;
              else subtitle = profile.baseUrl;
          '''
          new = '''        RECT titleRect{rect.left + S(32), rect.top + S(9), rect.right - S(118), rect.top + S(34)};
              DrawTextSimple(dc, headingFont, RGB(24, 47, 86), profile.name, titleRect);
              std::wstring subtitle;
              if (profile.isDefault) subtitle = L"默认对话服务";
              else if (configured && profile.lastOk) subtitle = L"连接正常 · " + profile.model;
              else if (configured) subtitle = profile.baseUrl;
              else subtitle = profile.lastMessage.empty() ? L"等待配置" : profile.lastMessage;
          '''
          if old not in text:
              raise SystemExit('profile title anchor not found')
          text = text.replace(old, new, 1)

          old = '''        const std::wstring badge = configured ? L"已配置" : (profile.lastOk ? L"已连接" : L"未配置");
              RECT badgeRect{rect.right - S(82), rect.top + S(17), rect.right - S(17), rect.top + S(42)};
              RoundFill(dc, badgeRect, S(8), configured ? RGB(229, 249, 238) : RGB(255, 246, 228));
              DrawTextSimple(dc, smallFont, configured ? RGB(28, 160, 92) : RGB(218, 137, 33), badge, badgeRect,
                             DT_CENTER | DT_VCENTER | DT_SINGLELINE);
          '''
          new = '''        const std::wstring badge = configured ? (profile.lastOk ? L"已连接" : L"已配置") : L"未配置";
              if (profile.isDefault && configured) {
                  RECT starRect{rect.right - S(109), rect.top + S(17), rect.right - S(88), rect.top + S(42)};
                  DrawTextSimple(dc, headingFont, RGB(50, 111, 236), L"★", starRect,
                                 DT_CENTER | DT_VCENTER | DT_SINGLELINE);
              }
              RECT badgeRect{rect.right - S(82), rect.top + S(17), rect.right - S(17), rect.top + S(42)};
              const bool healthy = configured && profile.lastOk;
              RoundFill(dc, badgeRect, S(8), configured ? RGB(229, 249, 238) : RGB(255, 246, 228));
              DrawTextSimple(dc, smallFont, configured ? (healthy ? RGB(23, 154, 85) : RGB(36, 145, 101)) : RGB(218, 137, 33), badge, badgeRect,
                             DT_CENTER | DT_VCENTER | DT_SINGLELINE);
          '''
          if old not in text:
              raise SystemExit('profile badge anchor not found')
          text = text.replace(old, new, 1)

          old = '''        RECT hint{leftPanel.left + S(16), leftPanel.bottom - S(56), leftPanel.right - S(16), leftPanel.bottom - S(16)};
              RoundFill(dc, hint, S(10), RGB(243, 248, 255));
              DrawTextSimple(dc, smallFont, RGB(91, 112, 147), L"未配置的服务不会出现在可选模型列表中", hint);
          '''
          new = '''        RECT hint{leftPanel.left + S(16), leftPanel.bottom - S(56), leftPanel.right - S(16), leftPanel.bottom - S(16)};
              RoundFill(dc, hint, S(10), RGB(243, 248, 255));
              DrawTextSimple(dc, smallFont, RGB(91, 112, 147), L"已配置服务自动置顶；未配置服务不会进入模型列表", hint);
          '''
          if old not in text:
              raise SystemExit('left hint anchor not found')
          text = text.replace(old, new, 1)

          old = '''        if (draw && draw->CtlID == kProfileListId) {
                  state->DrawProfileItem(*draw);
                  return TRUE;
              }
              break;
          '''
          new = '''        if (draw && draw->CtlID == kProfileListId) {
                  state->DrawProfileItem(*draw);
                  return TRUE;
              }
              if (draw && draw->CtlType == ODT_BUTTON) {
                  state->DrawActionButton(*draw);
                  return TRUE;
              }
              break;
          '''
          if old not in text:
              raise SystemExit('WM_DRAWITEM anchor not found')
          text = text.replace(old, new, 1)

          old = '''    auto button = [&](const wchar_t* text, int id) {
              return CreateWindowExW(0, L"BUTTON", text,
                                     WS_CHILD | WS_VISIBLE | WS_TABSTOP | BS_PUSHBUTTON,
                                     0, 0, 10, 10, state.panel, ControlId(id), wc.hInstance, nullptr);
          };
          '''
          new = '''    auto button = [&](const wchar_t* text, int id) {
              return CreateWindowExW(0, L"BUTTON", text,
                                     WS_CHILD | WS_VISIBLE | WS_TABSTOP | BS_OWNERDRAW,
                                     0, 0, 10, 10, state.panel, ControlId(id), wc.hInstance, nullptr);
          };
          '''
          if old not in text:
              raise SystemExit('button lambda anchor not found')
          text = text.replace(old, new, 1)

          old = '''        place(addButton, margin + contentW - S(132), margin + S(2), S(132), S(40));
          '''
          new = '''        place(addButton, margin + contentW - S(150), margin + S(2), S(150), S(42));
          '''
          if old not in text:
              raise SystemExit('add button layout anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify API center behavior contract
        shell: pwsh
        run: |
          $path = 'src/native/src/ui/settings/DesktopAiSettingsPage.cpp'
          $text = Get-Content $path -Raw
          foreach ($marker in @(
            'ProfilePriority',
            'SortProfilesForDisplay',
            'configured && profile.lastOk',
            'BS_OWNERDRAW',
            'DrawActionButton',
            '已配置服务自动置顶'
          )) {
            if (-not $text.Contains($marker)) { throw "Missing API center marker: $marker" }
          }

      - name: Configure ARM64 preview
        shell: pwsh
        run: cmake -S . -B build-api-center-arm64 -A ARM64 -DTURINGDESK_DEV_FAST=ON

      - name: Build ARM64 desktop surfaces
        shell: pwsh
        run: cmake --build build-api-center-arm64 --config Release --target TuringDesk TuringDeskWallpaper TuringDeskHarness --parallel

      - name: Commit verified polish and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name "GoodLoongStudio"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-api-center-service-priority.yml
          git add src/native/src/ui/settings/DesktopAiSettingsPage.cpp
          git commit -m "Polish API center and prioritize configured services"
          git push origin main
