name: Fix Harness No Browser Launch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-harness-no-open.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce --no-open for DeepSeek Harness
        shell: python
        run: |
          from pathlib import Path

          harness = Path('src/native/src/HarnessProcessManager.cpp')
          s = harness.read_text(encoding='utf-8')
          old = 'constexpr wchar_t kHarnessArgs[] = L"web --host 127.0.0.1 --port 3080";'
          new = 'constexpr wchar_t kHarnessArgs[] = L"web --host 127.0.0.1 --port 3080 --no-open";'
          if new not in s:
              if old not in s:
                  raise SystemExit('Harness launch args anchor missing')
              s = s.replace(old, new, 1)
          old_log = 'WriteLogLine(logHandle, L"[TuringDesk] browser launch: TuringDesk does not invoke an external browser; UI is hosted by TuringDesk WebView2");'
          new_log = 'WriteLogLine(logHandle, L"[TuringDesk] browser launch: disabled via dsh --no-open; UI is hosted by TuringDesk WebView2");'
          if old_log in s:
              s = s.replace(old_log, new_log, 1)
          harness.write_text(s, encoding='utf-8', newline='\n')

          guard = Path('scripts/verify-l3-runtime-contract.ps1')
          g = guard.read_text(encoding='utf-8')
          old_guard = '$requiredHarnessArgs = \'constexpr wchar_t kHarnessArgs[] = L"web --host 127.0.0.1 --port 3080";\''
          new_guard = '$requiredHarnessArgs = \'constexpr wchar_t kHarnessArgs[] = L"web --host 127.0.0.1 --port 3080 --no-open";\''
          if new_guard not in g:
              if old_guard not in g:
                  raise SystemExit('Harness guard anchor missing')
              g = g.replace(old_guard, new_guard, 1)
          g = g.replace("throw 'Harness launch arguments must be exactly loopback 127.0.0.1:3080.'", "throw 'Harness launch arguments must be loopback-only and include --no-open.'", 1)
          guard.write_text(g, encoding='utf-8', newline='\n')

          Path('.github/workflows/fix-harness-no-open.yml').unlink()

      - name: Verify contract
        shell: pwsh
        run: ./scripts/verify-l3-runtime-contract.ps1

      - name: Verify source markers
        shell: bash
        run: |
          grep -F 'web --host 127.0.0.1 --port 3080 --no-open' src/native/src/HarnessProcessManager.cpp
          grep -F 'disabled via dsh --no-open' src/native/src/HarnessProcessManager.cpp

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'GoodLoongStudio'
          git config user.email 'chnmlong@hotmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: prevent DeepSeek Harness from opening browser'
          git pull --rebase origin main
          git push origin HEAD:main
