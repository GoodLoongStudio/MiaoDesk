name: Repo Hygiene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

# 这三个闸门都和"构建能否通过"无关,也都不需要 Windows 镜像或构建产物。它们各自挡住的
# 都是真正发生过、而且被现有闸门放过去的事故:
#
#   no-conflict-markers     2026-09-22 stage.ps1 里留着 <<<<<<< 三行,干掉了三个打包
#                           工作流。.ps1 不进 C++ 编译器,所以在被 pwsh 解析前一路绿灯。
#
#   cmake-covers-sources    MiaoD3D11TextureLoader.cpp 在磁盘上、语法没问题,但没进
#                           MIAODESK_*_SOURCES,从来没被编译过 → 链接期 LNK2019。
#                           语法闸门扫的是"磁盘上有什么",照样编译它,所以看不出它没被收录。
#
#   skill-allowlist         kContentSkills 是封闭白名单。任何一侧单独变更都静默失衡:
#                           多建目录而没进白名单 → 该 skill 对 AI 不可达;白名单里有而
#                           磁盘没有 → 只在用户真的用时才报错。
#
# 用 ubuntu-latest + shell: bash:只读文本和跑一次 CMake Configure,不需要 Windows;
# 显式指定 shell 是为了不依赖某个镜像的默认 shell。
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Verify no unresolved merge conflict markers
        shell: bash
        run: |
          out=$(bash scripts/verify-no-conflict-markers.sh 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Verify every source file is actually compiled by CMake
        shell: bash
        run: |
          out=$(bash scripts/verify-cmake-covers-sources.sh 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Verify the content-skill allowlist matches skills/
        shell: bash
        run: |
          out=$(bash scripts/verify-skill-allowlist.sh 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # paths 过滤覆盖它自己会执行的文件。同一个缺口 2026-09-22 撞了三次:tests/**、
      # scripts/**、runtime/agent/package-lock.json 都不在相应工作流的过滤里,于是
      # 改了那些文件,唯一验证它们的工作流根本不触发 —— 改完等于没验。
      - name: Verify every workflow's paths filter covers what it runs
        shell: bash
        run: |
          out=$(bash scripts/verify-workflow-paths.sh 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # skills/ 是用户制作壁纸时唯一读到的规范。它此前只写了"material 优先引用
      # builtin",而渲染器只接受 builtinName:"solidColor" 一个值、programmable
      # 只有 D3D11 能画、texture 与 material 同时写会被拒 —— 规范在教作者写
      # 渲染器会拒的包。这个门从 MiaoSpriteMaterialPolicy.cpp 读出认可的 builtin 名,
      # 再按小节核对 skills 是否说到它。判据是关键词命中,措辞层面的改写抓不到,
      # 这一点写在这个脚本自己的头部了。
      - name: Verify the content skills state the renderer's sprite-material rule
        shell: bash
        run: |
          out=$(bash scripts/verify-skill-material-rule.sh 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # MiaoCloud 的 scene.json 是 scene.ini 的产物,不是第二份手写源。
      # 分叉的后果很具体:图层位置与源不符,而**没有任何测试会发现** ——
      # C++ 侧的 BuiltinWallpaperPackages 只验它能解析与资产在不在,不验几何。
      # 生成器内部还会对每层做一次逆合成 assert,所以这一步同时是几何校验。
      - name: Verify MiaoCloud scene.json has not drifted from scene.ini
        shell: bash
        run: |
          out=$(python3 scripts/generate-miao-cloud-scene.py --check 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # MiaoCloud 的动画从 scene.ini 的解析式正弦迁到 scene.json 的关键帧轨,
      # 是一次有损迁移。损失量必须是个数:这个脚本读两个源、按引擎自己的
      # easing/局部时间代码求值,逐点比,上界是解析解 A*(1-cos(pi/15))。
      # 没有它,"亚像素"就只是注释里的一句话。
      - name: Verify MiaoCloud's migrated animations still match scene.ini
        shell: bash
        run: |
          out=$(python3 scripts/verify-miao-cloud-animation-parity.py 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # stage.ps1 里那份手写的壁纸资产断言清单。真正的拷贝是 CMake 的
      # install(DIRECTORY ...) 整目录,所以少列一项不会让文件消失 —— 但会让
      # "它是否真的进了打包产物"失去检查。cloud.png 就是这样被漏了一整天:
      # MiaoCloud 的 scene.json 从空壳填成 5 层的同一天,断言清单还是 4 项。
      # 判据从 scene.json 的 assets[].source 推,所以增删资产只需改一处。
      - name: Verify the staged wallpaper asset assertions match scene.json
        shell: bash
        run: |
          out=$(bash scripts/verify-staged-wallpaper-assets.sh 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # verify-path-layout-contract.ps1 里与平台无关的那几条。整段那个 .ps1 在
      # macOS 上跑不了(它按反斜杠比对一个 allowlist,而 macOS 的 FullName 是正斜杠,
      # 假阳性),于是那些规则本机一直没人跑得动 —— 2026-09-22 就有一句**注释**里的
      # fs::current_path() 连红两次提交。这里把不依赖分隔符的检查搬过来。
      # docs/ 里的 "File.cpp:123" 引用会随代码改动静默腐烂:文档不是代码,
      # 没有任何测试覆盖它,而失效的引用比没有引用更坏 —— 它让读者以为有依据。
      # 只查"这一行还在不在",不查"这一行说的是不是那件事"(后者要人读)。
      - name: Verify documentation code citations still point at real lines
        shell: bash
        run: |
          out=$(bash scripts/verify-doc-code-citations.sh 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # 上一条只证明"这一行存在"。2026-09-22 人工核对过:30 条能解析的引用里 10 条指的
      # 是错的地方,而那一条门十条全放行。所以有了这一条 —— 它取引用同一行里的符号,
      # 验证符号真的出现在被引那一行附近。只覆盖有符号可核的那些,边界写在脚本头部。
      - name: Verify what a documentation citation talks about is on the line it cites
        shell: bash
        run: |
          out=$(bash scripts/verify-doc-citation-symbols.sh 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Verify native source shape and path policy
        shell: bash
        run: |
          out=$(bash scripts/verify-native-source-hygiene.sh 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # 版本库里不得躺本机产物。2026-09-22 一个 cpython-314.pyc 跟着文档闸门的
      # 提交进了库:.gitignore 有 .NET/Node/CMake/IDE/OS/logs 各节,唯独没有 Python,
      # 而 scripts/*.py 早就在跑。上面那些闸门全都管不到它 —— 原生源码那条只扫
      # src/、暂存资源那条只管 assets/*.mdwall、CMake 那条问「编了什么」而不是
      # 「多出了什么」。判据用 git ls-files,因为这类文件一旦提交就长期安静地待着。
      - name: Verify no machine-local artifacts are tracked
        shell: bash
        run: |
          out=$(bash scripts/verify-no-build-artifacts.sh 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # CMake 目标结构。一天之内在本仓库踩了三次,而这三类错此前没有任何闸门看得见:
      #   add_executable 追加在 foreach 之后 → Configure 期报错、编译期表现为找不到头文件;
      #   有声明但没有 target_link_libraries → 编译通过、链接才 LNK2019,而本机语法门
      #     只做 -fsyntax-only,看不见;
      #   同一个 .cpp 出现在两处源清单 → 同样是路径契约里的 one-owner 规则。
      - name: Verify CMake target structure
        shell: bash
        run: |
          out=$(bash scripts/verify-cmake-target-hygiene.sh 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # 贴图场景 fixture 有两份,一份给 Windows 上的真渲染,一份给本机验 schema。
      # 只改一边的后果是:本机那份永远绿着,Windows 那份跑真渲染时才因为一个字段名
      # 写错而失败,报的却是"绘制失败",没有任何线索指向 fixture。
      - name: Verify the two textured-sprite scene fixtures have not drifted
        shell: bash
        run: |
          out=$(bash scripts/verify-scene-fixture-parity.sh 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # 这两个 node 闸门是可移植的(纯 JS + 读仓库文本),但此前只挂在
      # windows-x64-build 后面 —— 于是验证它们要等一整轮 15 分钟的 Windows 构建,
      # 而 2026-09-22 那次失败就是在这条路上被拖了很久才暴露。放到这里,每次推送
      # 几秒内就能知道它们是否仍然通过。
      - name: Verify image_generate provider parameterisation
        shell: bash
        run: |
          out=$(node tests/image-provider.mjs 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Verify web audio bridge shim
        shell: bash
        run: |
          out=$(node tests/WebAudioBridge.mjs 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # 上面那条只验页面侧 shim 自身;这一条验**宿主侧与页面侧对得上**。
      # 它编译 src/tests/WebAudioEnvelopeDump.cpp —— 也就是真实调
      # BuildAudioBridgeEnvelope 那个函数 —— 把输出喂给真的 shim,再比对监听者收到的值。
      # 之所以值得单独一步:B-6 的契约有两份实现而没有任何编译器在检查它们之间的关系,
      # 一旦对不上,表现是"页面什么都收不到",而 shim 的丢弃路径是静默 return。
      - name: Verify the host-side audio envelope against the shim
        shell: bash
        run: |
          out=$(node tests/WebAudioEnvelopeParity.mjs 2>&1) || {
            echo "$out" | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
