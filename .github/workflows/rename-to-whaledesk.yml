name: WhaleDesK one-time full rename
on:
  push:
    branches:
      - rename/whaledesk-full
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    if: "!contains(github.event.head_commit.message, '[rename-complete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: false
          fetch-depth: 1
      - name: Rename all tracked brand references
        run: python3 scripts/rename-to-whaledesk.py
      - name: Commit migrated project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(brand): complete WhaleDesK rename [rename-complete]'
            git push
          fi
