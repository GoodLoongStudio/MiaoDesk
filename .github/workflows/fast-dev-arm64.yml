name: Windows ARM64 Fast Dev

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: arm64-fast-dev
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "on"
  SCCACHE_GHA_VERSION: "miaodesk-arm64-v1"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup ARM64 compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0

      - name: Generate MiaoMiao app icon
        shell: pwsh
        run: .\scripts\generate-miaomiao-icon.ps1

      - name: Configure and build ARM64 with sccache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere -PathType Leaf)) { throw "vswhere.exe is missing: $vswhere" }

          $vsRoot = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($vsRoot)) { throw 'Visual Studio installation was not found.' }

          $vsDevCmd = Join-Path $vsRoot 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $vsDevCmd -PathType Leaf)) { throw "VsDevCmd.bat is missing: $vsDevCmd" }

          $ninja = Get-Command ninja.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source
          if (-not $ninja) {
            $candidate = Join-Path $vsRoot 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe'
            if (Test-Path $candidate -PathType Leaf) { $ninja = $candidate }
          }
          if (-not $ninja) { throw 'ninja.exe was not found on the ARM64 runner.' }

          Remove-Item C:\b\MiaoDesk\arm64-fast -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path C:\b\MiaoDesk | Out-Null

          $batch = Join-Path $env:RUNNER_TEMP 'miaodesk-arm64-fast.cmd'
          @"
          @echo off
          call "$vsDevCmd" -no_logo -arch=arm64 -host_arch=arm64
          if errorlevel 1 exit /b %errorlevel%
          where cl
          where rc
          sccache --zero-stats
          cmake -S "$env:GITHUB_WORKSPACE" -B C:\b\MiaoDesk\arm64-fast -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM="$ninja" -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_INSTALL_PREFIX=C:\pkg\MiaoDesk\arm64-fast
          if errorlevel 1 exit /b %errorlevel%
          cmake --build C:\b\MiaoDesk\arm64-fast --target MiaoDesk MiaoDeskWallpaper MiaoDeskHarness --parallel
          if errorlevel 1 exit /b %errorlevel%
          sccache --show-stats
          "@ | Set-Content $batch -Encoding ascii

          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw "ARM64 sccache build failed: $LASTEXITCODE" }

      # 2026-10-04: 这一步从 bc8fe14c 起连红多次,而同一 workflow 的 ARM64 **构建**
      # 一直是 success,install 规则也没有任何改动。它的动作只有
      # `Remove-Item <prefix>` 紧接 `cmake --install --prefix <同一个目录>` ——
      # 对"上次 run 残留的进程还握着那个目录"很敏感,而 Remove-Item 带
      # SilentlyContinue,失败了也不响。
      #
      # 这里加的是**诊断**,不是重试:重试会把一次真实的 install 失败也一并盖过去,
      # 那是拿"让门别响"换"门还在查"。所以只做两件不会掩盖真相的事:
      #   1) 先确认没有残留 MiaoDesk 进程占着目录(这只会移除干扰,不会修好坏掉的东西);
      #   2) install 失败时把完整输出打出来 —— 之前 annotation 里只有
      #      sccache 统计和 exit code 1,根因一直看不见。
      - name: Refresh fast runnable package
        shell: pwsh
        run: |
          Get-Process MiaoDesk,MiaoDeskWallpaper,MiaoDeskHarness -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "Stale $($_.ProcessName) (pid $($_.Id)) holds the dev package; stopping it."; Stop-Process -Id $_.Id -Force }
          Start-Sleep -Seconds 2
          Remove-Item C:\pkg\MiaoDesk\arm64-fast -Recurse -Force -ErrorAction SilentlyContinue
          $out = & cmake --install C:\b\MiaoDesk\arm64-fast --prefix C:\pkg\MiaoDesk\arm64-fast 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) {
            Write-Host "::error::cmake --install failed with exit code $code"
            foreach ($line in ($out | Select-String -Pattern 'rror|ailed|enied|busy|not found')) {
              Write-Host "::error::$($line.Line)"
            }
            exit $code
          }

      - name: Verify fast delta
        shell: pwsh
        run: |
          foreach ($exe in @('MiaoDesk.exe','MiaoDeskWallpaper.exe','MiaoDeskHarness.exe')) {
            $path = Join-Path 'C:\pkg\MiaoDesk\arm64-fast' $exe
            if (-not (Test-Path $path -PathType Leaf)) { throw "Fast delta is missing $exe" }
            if ((Get-Item $path).Length -lt 4096) { throw "Fast delta has invalid $exe" }
          }

      - name: Smoke-test AI creator windows
        shell: pwsh
        run: |
          $exe = 'C:\pkg\MiaoDesk\arm64-fast\MiaoDesk.exe'
          $process = Start-Process $exe -ArgumentList '--creator-window-self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "AI creator window smoke test failed: $($process.ExitCode)"
          }

      - name: End-to-end creator IPC open test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'C:\\pkg\\MiaoDesk\\arm64-fast\\MiaoDesk.exe'
          $hostProcess = $null
          try {
            $hostProcess = Start-Process $exe -ArgumentList '--startup' -PassThru
            Start-Sleep -Milliseconds 700
            if ($hostProcess.HasExited) { throw "MiaoDesk IPC host exited early: $($hostProcess.ExitCode)" }
            foreach ($kind in @('wallpaper','widget')) {
              $client = Start-Process $exe -ArgumentList "--content-creator=$kind" -Wait -PassThru
              if ($client.ExitCode -ne 0) {
                throw "End-to-end creator IPC open failed for $kind`: exit=$($client.ExitCode)"
              }
            }
          }
          finally {
            if ($hostProcess -and -not $hostProcess.HasExited) {
              Stop-Process -Id $hostProcess.Id -Force -ErrorAction SilentlyContinue
              $hostProcess.WaitForExit(5000) | Out-Null
            }
          }

      - name: Upload runnable ARM64 dev package
        uses: actions/upload-artifact@v4
        with:
          name: MiaoDesk-arm64-fast-${{ github.sha }}
          path: C:\pkg\MiaoDesk\arm64-fast
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
