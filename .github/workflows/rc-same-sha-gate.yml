name: RC Same-SHA Gate

on:
  pull_request:
    paths:
      - 'scripts/verify-rc-ci.mjs'
      - '.github/workflows/rc-same-sha-gate.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA whose release workflows must all be green'
        required: true
        type: string
  # 自动那一支:五条发布链里任意一条跑完,就按**触发它的那个 SHA** 核一次。
  #
  # 为什么要有这一支:P0-10 / REL-02 的验收是"五项均为该 SHA 的 success;不同提交的
  # 通过结果不能拼接",而此前这道门只有 workflow_dispatch 一个入口 —— 也就是说,
  # 它要**有人记得去按按钮**。记得去按按钮这件事我已经错过一次了(见开发面板
  # 2026-10-04 再续十一):上一轮我在提交信息里写"17 道 node 契约门全通过",
  # 而有一道本地门当时就是红的,原因正是没有一个东西替我记得跑。
  # 把"记得"换成"会跑",是这道门唯一的改进方向 —— 校验器本身一直是对的。
  #
  # 注意 workflow_run 用的是**默认分支上的这个文件**,不是触发它的那次提交上的。
  # 所以 checkout 刻意锁 `github.event.workflow_run.head_sha`:要拿产生这些 run 的
  # 那份 verify-rc-ci.mjs 去核它们,否则等于用新尺子量旧工件。
  workflow_run:
    workflows:
      - 'Windows x64 Build'
      - 'Windows x64 Package'
      - 'Windows x64 MSIX'
      - 'Repo Hygiene'
      - 'Windows ARM64 Package'
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-rc-ci.mjs --self-test

  verify-target:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all RC workflows succeeded on the exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-rc-ci.mjs '${{ inputs.target_sha }}'

  verify-push:
    # 触发它的那条被取消时**不核**。
    #
    # 实测(0f10c685 / 37177639787):连着推两个提交,第二个会把第一个在跑的工作流
    # 顶掉,被顶掉的那条以 cancelled 结束 —— 于是这道门按"五条链里有一条真的失败了"
    # 报红,而真相只是"我几秒后又推了一次"。那不是发布坏了,是门被自己的节奏骗了。
    # 取消一条工作流的理由有很多,但"被更新的提交顶掉"这一种必须放过:
    # 每次连推都红一道的门,等于每次连推都要人来看一眼。
    #
    # 另一处仍然算真失败:如果触发这条是 success,而**别的**链被取消了,
    # 那一条对这个 SHA 确实没过 —— 那种情况照旧红,并且 annotation 会说明
    # "可能是后续推送顶掉了它,也可能是有人手动取消"。
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the five RC workflows succeeded on the exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        # 退出码 3 是"一条都没失败,但还有没跑完的"—— 那不是没通过,是还不能说。
        # push 之后第一条发布链跑完就会触发这一支,另外四条还没影,此时按失败算的
        # 话这道门会在每次推送上红一次,而每次推送都红的门等于没有门。
        # 所以 3 当 notice 放过去,0 和 1 才是结论。
        run: |
          set +e
          node scripts/verify-rc-ci.mjs "$TARGET_SHA"
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::notice::同 SHA 的五条发布链还没跑完($TARGET_SHA)—— 这一轮不算结论,等最后一条跑完再核"
            exit 0
          fi
          exit "$rc"
