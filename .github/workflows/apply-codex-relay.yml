name: Apply Codex Relay Integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-codex-relay.yml

permissions:
  contents: write

concurrency:
  group: apply-codex-relay
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate codex-relay into TuringDesk
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: anchor missing in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          # --- CodexRuntime header: provider bridge metadata + relay process lifecycle.
          replace_once(
              'src/native/include/turingdesk/CodexRuntime.h',
              '''        std::wstring apiKey;\n        std::wstring signature;\n        std::wstring message;\n''',
              '''        std::wstring apiKey;\n        std::wstring signature;\n        std::wstring message;\n        bool relayRequired{};\n        std::wstring upstreamBaseUrl;\n        unsigned short relayPort{};\n''',
              'ProviderSetup fields')
          replace_once(
              'src/native/include/turingdesk/CodexRuntime.h',
              '''    std::wstring FindBinary(bool& isCliBinary) const;\n    ProviderSetup BuildProviderSetup(const L3Agent& agent) const;\n''',
              '''    std::wstring FindBinary(bool& isCliBinary) const;\n    std::wstring FindRelayBinary() const;\n    ProviderSetup BuildProviderSetup(const L3Agent& agent) const;\n    bool LaunchRelay(const ProviderSetup& setup, std::wstring& error);\n''',
              'relay declarations')
          replace_once(
              'src/native/include/turingdesk/CodexRuntime.h',
              '''    HANDLE process_{};\n    HANDLE processThread_{};\n    HANDLE inputWrite_{};\n''',
              '''    HANDLE process_{};\n    HANDLE processThread_{};\n    HANDLE relayProcess_{};\n    HANDLE relayThread_{};\n    HANDLE inputWrite_{};\n''',
              'relay handles')

          cpp = Path('src/native/src/CodexRuntime.cpp')
          text = cpp.read_text(encoding='utf-8')

          # Helper for Chat Completions upstream + relay environment. The API key never appears on the command line.
          anchor = '''std::wstring SearchExecutable(const wchar_t* name) {\n'''
          helper = r'''std::wstring ChatCompletionsBase(const L3Agent& agent) {
    auto url = Trim(agent.CurrentApiUrl());
    while (url.size() > 1 && url.back() == L'/') url.pop_back();
    constexpr std::wstring_view suffix = L"/chat/completions";
    if (!EndsWithInsensitive(url, std::wstring(suffix))) return {};
    url.resize(url.size() - suffix.size());
    while (url.size() > 1 && url.back() == L'/') url.pop_back();
    return url;
}

bool IsLocalHttpBase(const std::wstring& url) {
    const auto lower = Lower(url);
    return lower.starts_with(L"http://127.0.0.1") || lower.starts_with(L"http://localhost") ||
           lower.starts_with(L"https://127.0.0.1") || lower.starts_with(L"https://localhost") ||
           lower.starts_with(L"http://[::1]") || lower.starts_with(L"https://[::1]");
}

std::vector<wchar_t> BuildRelayEnvironmentBlock(const std::wstring& upstream,
                                                 const std::wstring& apiKey,
                                                 unsigned short port) {
    std::vector<std::wstring> entries;
    LPWCH block = GetEnvironmentStringsW();
    if (block) {
        for (const wchar_t* cursor = block; *cursor != L'\0'; cursor += std::wcslen(cursor) + 1) {
            std::wstring entry(cursor);
            const auto equal = entry.find(L'=');
            const std::wstring name = equal == std::wstring::npos ? entry : entry.substr(0, equal);
            const auto lower = Lower(name);
            if (lower.starts_with(L"codex_relay_") || lower == L"rust_log") continue;
            entries.push_back(std::move(entry));
        }
        FreeEnvironmentStringsW(block);
    }
    entries.push_back(L"CODEX_RELAY_BIND=127.0.0.1");
    entries.push_back(L"CODEX_RELAY_PORT=" + std::to_wstring(port));
    entries.push_back(L"CODEX_RELAY_UPSTREAM=" + upstream);
    entries.push_back(L"CODEX_RELAY_API_KEY=" + apiKey);
    entries.push_back(L"RUST_LOG=codex_relay=warn");
    std::sort(entries.begin(), entries.end(), [](const std::wstring& a, const std::wstring& b) {
        return _wcsicmp(a.c_str(), b.c_str()) < 0;
    });
    std::size_t chars = 1;
    for (const auto& entry : entries) chars += entry.size() + 1;
    std::vector<wchar_t> out(chars, L'\0');
    wchar_t* cursor = out.data();
    for (const auto& entry : entries) {
        std::copy(entry.begin(), entry.end(), cursor);
        cursor += entry.size();
        *cursor++ = L'\0';
    }
    *cursor = L'\0';
    return out;
}

