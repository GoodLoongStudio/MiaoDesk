        }

        const std::array<D2D1_COLOR_F, 4> ribbons = {
            D2D1::ColorF(0.20f, 0.96f, 0.82f, 0.34f), D2D1::ColorF(0.20f, 0.62f, 1.00f, 0.30f),
            D2D1::ColorF(0.66f, 0.30f, 1.00f, 0.27f), D2D1::ColorF(0.96f, 0.28f, 0.76f, 0.22f),
