name: Windows x64 MSIX

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - src/**
      - assets/app/**
      - assets/wallpapers/**
      - assets/widgets/**
      - config/**
      - runtime/x64/**
      - runtime/agent/**
      - third_party/webview2/**
      - packaging/windows/**
      - packaging/store/**
      - scripts/generate-whalewhale-icon.ps1
      - .github/workflows/package-windows-x64-msix.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - src/**
      - assets/app/**
      - assets/wallpapers/**
      - assets/widgets/**
      - config/**
      - runtime/x64/**
      - runtime/agent/**
      - third_party/webview2/**
      - packaging/windows/**
      - packaging/store/**
      - scripts/generate-whalewhale-icon.ps1
      - .github/workflows/package-windows-x64-msix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-msix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-msix:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      WHALEDESK_BUILD_ROOT: C:\b\WhaleDesK\msix-x64
      WHALEDESK_STAGE_ROOT: C:\pkg\WhaleDesK\msix-x64
      WHALEDESK_MSIX_PATH: C:\pkg\WhaleDesK\WhaleDesK-x64.msix

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Restore agent npm cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\WhaleDesK-AgentNpmCache-x64
          key: whaledesk-agent-npm-${{ runner.os }}-x64-${{ hashFiles('runtime/agent/package-lock.json') }}
          restore-keys: |
            whaledesk-agent-npm-${{ runner.os }}-x64-

      - name: Generate WhaleWhale app icon
        shell: pwsh
        run: .\scripts\generate-whalewhale-icon.ps1

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item $env:WHALEDESK_BUILD_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $env:WHALEDESK_STAGE_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Split-Path $env:WHALEDESK_BUILD_ROOT -Parent) | Out-Null
          New-Item -ItemType Directory -Force -Path (Split-Path $env:WHALEDESK_STAGE_ROOT -Parent) | Out-Null
          $gateOut = cmake -S . -B $env:WHALEDESK_BUILD_ROOT -A x64 -DCMAKE_INSTALL_PREFIX="$env:WHALEDESK_STAGE_ROOT" 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'CMake configure failed.'
          }

      - name: Build
        shell: pwsh
        run: |
          $gateOut = cmake --build $env:WHALEDESK_BUILD_ROOT --config Release --target WhaleDesK WhaleDesKWallpaper WhaleDesKHarness --parallel 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'x64 build failed.'
          }

      - name: Install product files
        shell: pwsh
        run: |
          $gateOut = cmake --install $env:WHALEDESK_BUILD_ROOT --config Release --prefix $env:WHALEDESK_STAGE_ROOT 2>&1
          $gateExit = $LASTEXITCODE
          $gateOut | Write-Host
          if ($gateExit -ne 0) {
              $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                  $line = $_.Line.Trim()
                  if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                  Write-Host "::error::$line"
              }
              Write-Host "::error::exit code $gateExit"
              throw 'cmake --install failed.'
          }

      - name: Stage runtime
        env:
          WHALEDESK_NPM_CACHE: ${{ runner.temp }}\WhaleDesK-AgentNpmCache-x64
        shell: pwsh
        run: .\packaging\windows\stage.ps1 -Destination $env:WHALEDESK_STAGE_ROOT -Architecture x64

      - name: Verify app, builtin widget, and startup mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @(
            'Widgets\GlassClock.mdwidget\manifest.json',
            'Widgets\GlassClock.mdwidget\scene.json',
            'Widgets\GlassClock.mdwidget\parameters.json'
          )) {
            if (-not (Test-Path (Join-Path $env:WHALEDESK_STAGE_ROOT $relative) -PathType Leaf)) {
              throw "Built-in widget package file is missing: $relative"
            }
          }
          foreach ($exe in @('WhaleDesKHarness.exe','WhaleDesKWallpaper.exe','WhaleDesK.exe')) {
            $p = Start-Process -FilePath (Join-Path $env:WHALEDESK_STAGE_ROOT $exe) -ArgumentList '--self-test' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$exe self-test failed: $($p.ExitCode)" }
          }
          .\packaging\windows\verify-login-startup.ps1 -ProductRoot $env:WHALEDESK_STAGE_ROOT

      - name: Verify staged GlassClock Content Framework route
        shell: pwsh
        run: .\packaging\windows\verify-widget-visibility.ps1 -ProductRoot $env:WHALEDESK_STAGE_ROOT

      - name: Build MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gateOut = & .\packaging\store\msix\pack-msix.ps1 `
            -StageRoot $env:WHALEDESK_STAGE_ROOT `
            -OutputMsix $env:WHALEDESK_MSIX_PATH 2>&1
            $gateExit = $LASTEXITCODE
            $gateOut | Write-Host
            if ($gateExit -ne 0) {
                $gateOut | Select-String -Pattern 'FAIL|rror|xception|not found|missing|rejected|Error' | Select-Object -First 12 | ForEach-Object {
                    $line = $_.Line.Trim()
                    if ($line.Length -gt 400) { $line = $line.Substring(0, 400) }
                    Write-Host "::error::$line"
                }
                Write-Host "::error::exit code $gateExit"
                throw "pack-msix.ps1 failed: $gateExit"
            }

      - name: Verify MSIX startup manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unpack = Join-Path $env:RUNNER_TEMP 'whaledesk-msix-verify'
          Remove-Item $unpack -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $unpack | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($env:WHALEDESK_MSIX_PATH, $unpack)
          [xml]$manifest = Get-Content (Join-Path $unpack 'AppxManifest.xml') -Raw
          $ns = [System.Xml.XmlNamespaceManager]::new($manifest.NameTable)
          $ns.AddNamespace('f', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $ns.AddNamespace('desktop', 'http://schemas.microsoft.com/appx/manifest/desktop/windows10')
          $task = $manifest.SelectSingleNode('/f:Package/f:Applications/f:Application/f:Extensions/desktop:Extension[@Category="windows.startupTask"]/desktop:StartupTask', $ns)
          if (-not $task) { throw 'windows.startupTask is missing.' }
          if ($task.TaskId -ne 'WhaleDesKStartup') { throw "Unexpected startup TaskId: $($task.TaskId)" }
          if ($task.Enabled -ne 'true') { throw "Startup task must default to enabled; actual=$($task.Enabled)" }
          if ($task.DisplayName -ne '妙喵') { throw "Unexpected startup display name: $($task.DisplayName)" }
          if ($manifest.Package.Identity.Version -ne '0.1.3.0') { throw "Unexpected MSIX version: $($manifest.Package.Identity.Version)" }
          if ($manifest.Package.Identity.Name -ne '52383Nontrix.42913C45ABF3E') { throw "Unexpected Store identity: $($manifest.Package.Identity.Name)" }
          foreach ($relative in @(
            'Widgets\GlassClock.mdwidget\manifest.json',
            'Widgets\GlassClock.mdwidget\scene.json',
            'Widgets\GlassClock.mdwidget\parameters.json'
          )) {
            if (-not (Test-Path (Join-Path $unpack $relative) -PathType Leaf)) {
              throw "MSIX built-in widget package file is missing: $relative"
            }
          }
          Write-Host 'MSIX startup task and GlassClock content package verified.' -ForegroundColor Cyan

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: WhaleDesK-windows-x64-msix-startup-${{ github.sha }}
          path: |
            C:/pkg/WhaleDesK/WhaleDesK-x64.msix
            C:/pkg/WhaleDesK/WhaleDesK-x64.msixupload
          if-no-files-found: error
          retention-days: 14
          compression-level: 0