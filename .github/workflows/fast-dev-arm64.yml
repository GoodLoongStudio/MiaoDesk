name: Windows ARM64 Fast Dev

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: arm64-fast-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Generate MiaoMiao app icon
        shell: pwsh
        run: .\scripts\generate-miaomiao-icon.ps1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B C:\b\MiaoDesk\arm64-fast -A ARM64 -DCMAKE_INSTALL_PREFIX=C:\pkg\MiaoDesk\arm64-fast
      - name: Incremental build
        shell: pwsh
        run: cmake --build C:\b\MiaoDesk\arm64-fast --config Release --target MiaoDesk MiaoDeskWallpaper MiaoDeskHarness --parallel
      - name: Refresh fast runnable package
        shell: pwsh
        run: |
          Remove-Item C:\pkg\MiaoDesk\arm64-fast -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install C:\b\MiaoDesk\arm64-fast --config Release --prefix C:\pkg\MiaoDesk\arm64-fast
      - name: Verify fast delta
        shell: pwsh
        run: |
          # This artifact is intentionally an overlay, not a standalone install.
          # Full product self-tests run on the ARM64 test PC after this delta is
          # applied over the persistent Runtime/AI/Goz baseline.
          foreach ($exe in @('MiaoDesk.exe','MiaoDeskWallpaper.exe','MiaoDeskHarness.exe')) {
            $path = Join-Path 'C:\pkg\MiaoDesk\arm64-fast' $exe
            if (-not (Test-Path $path -PathType Leaf)) { throw "Fast delta is missing $exe" }
            if ((Get-Item $path).Length -lt 4096) { throw "Fast delta has invalid $exe" }
          }
      - name: Upload runnable ARM64 dev package
        uses: actions/upload-artifact@v4
        with:
          name: MiaoDesk-arm64-fast-${{ github.sha }}
          path: C:\pkg\MiaoDesk\arm64-fast
          if-no-files-found: error
          retention-days: 3
          compression-level: 1