name: Fix Harness background lifecycle

on:
  push:
    branches: [main]
    paths:
      - .github/harness-background.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Split Harness UI/background singleton and autostart background
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/native/src/HarnessHost.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('constexpr wchar_t kMutexName[] = L"Local\\\\TuringDesk.Native.Harness.Singleton";',
                        'constexpr wchar_t kBackgroundMutexName[] = L"Local\\\\TuringDesk.Native.Harness.Background.Singleton";\nconstexpr wchar_t kUiMutexName[] = L"Local\\\\TuringDesk.Native.Harness.Ui.Singleton";', 1)
          start = s.find('    HANDLE mutex = CreateMutexW(nullptr, FALSE, kMutexName);')
          end_marker = '''    const int result = host.Run();\n    CloseHandle(mutex);\n    if (SUCCEEDED(com)) CoUninitialize();\n    return result;\n}'''
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Harness lifecycle block anchor missing')
          end += len(end_marker)
          replacement = '''    const bool showUi = args.find(L"--ui") != std::wstring_view::npos;\n    const wchar_t* mutexName = showUi ? kUiMutexName : kBackgroundMutexName;\n    HANDLE mutex = CreateMutexW(nullptr, FALSE, mutexName);\n    if (!mutex) {\n        if (SUCCEEDED(com)) CoUninitialize();\n        return 2;\n    }\n    if (GetLastError() == ERROR_ALREADY_EXISTS) {\n        if (showUi) ActivateExistingHarnessWindow();\n        CloseHandle(mutex);\n        if (SUCCEEDED(com)) CoUninitialize();\n        return 0;\n    }\n\n    if (!showUi) {\n        turingdesk::HarnessProcessManager harness;\n        if (!harness.Start()) {\n            CloseHandle(mutex);\n            if (SUCCEEDED(com)) CoUninitialize();\n            return 6;\n        }\n        while (harness.Running()) Sleep(500);\n        const DWORD exitCode = harness.ExitCode();\n        CloseHandle(mutex);\n        if (SUCCEEDED(com)) CoUninitialize();\n        return exitCode == STILL_ACTIVE ? 0 : static_cast<int>(exitCode);\n    }\n\n    HarnessHost host(instance);\n    if (!host.Create()) {\n        CloseHandle(mutex);\n        if (SUCCEEDED(com)) CoUninitialize();\n        return 4;\n    }\n\n    const int result = host.Run();\n    CloseHandle(mutex);\n    if (SUCCEEDED(com)) CoUninitialize();\n    return result;\n}'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8', newline='\n')

          # Start the invisible Harness owner alongside TuringDesk search.
          p = Path('src/native/src/main.cpp')
          s = p.read_text(encoding='utf-8')
          if '#include <filesystem>' not in s:
              s = s.replace('#include <string_view>\n', '#include <string_view>\n#include <filesystem>\n', 1)
          anchor = '''void ActivateExistingSearchWindow() {\n'''
          helper = r'''void StartHarnessBackground() {
    std::wstring modulePath(32768, L'\0');
    const DWORD count = GetModuleFileNameW(nullptr, modulePath.data(), static_cast<DWORD>(modulePath.size()));
    if (count == 0 || count >= modulePath.size()) return;
    modulePath.resize(count);
    const auto harnessPath = std::filesystem::path(modulePath).parent_path() / L"TuringDeskHarness.exe";
    std::error_code ec;
    if (!std::filesystem::is_regular_file(harnessPath, ec)) return;

    std::wstring command = L"\"" + harnessPath.wstring() + L"\"";
    STARTUPINFOW startup{};
    startup.cb = sizeof(startup);
    startup.dwFlags = STARTF_USESHOWWINDOW;
    startup.wShowWindow = SW_HIDE;
    PROCESS_INFORMATION process{};
    if (CreateProcessW(harnessPath.c_str(), command.data(), nullptr, nullptr, FALSE,
                       CREATE_NO_WINDOW, nullptr, harnessPath.parent_path().c_str(), &startup, &process)) {
        CloseHandle(process.hThread);
        CloseHandle(process.hProcess);
    }
}

'''
          if 'void StartHarnessBackground()' not in s:
              if anchor not in s: raise SystemExit('main helper anchor missing')
              s = s.replace(anchor, helper + anchor, 1)
          launch_anchor = '''    turingdesk::SearchWindow window(instance);\n'''
          if '    StartHarnessBackground();\n' not in s:
              if launch_anchor not in s: raise SystemExit('main launch anchor missing')
              s = s.replace(launch_anchor, '    StartHarnessBackground();\n\n' + launch_anchor, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Guard intended behavior
        shell: bash
        run: |
          grep -q 'Harness.Background.Singleton' src/native/src/HarnessHost.cpp
          grep -q 'Harness.Ui.Singleton' src/native/src/HarnessHost.cpp
          grep -q 'StartHarnessBackground();' src/native/src/main.cpp
          grep -q 'TuringDeskHarness.exe", L"--ui"' src/native/src/SettingsCenterWindow.cpp
          grep -q 'method == "item/completed"' src/native/src/CodexRuntime.cpp
          grep -q 'state.codex->AskAsync' src/native/src/L3CliWindow.cpp
      - name: Commit and self-remove
        shell: bash
        run: |
          rm -f .github/workflows/fix-harness-background-lifecycle.yml .github/harness-background.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: separate Harness background service from UI"
          git pull --rebase origin main
          git push origin HEAD:main
