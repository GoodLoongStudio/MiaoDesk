name: Apply desktop library diagonal resize fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-library-diagonal-resize.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply resize hit-test fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/native/src/ui/wallpaper/WallpaperLibraryWindowV2.cpp')
          text = path.read_text(encoding='utf-8')

          helper_anchor = '''int RectHeight(const RECT& rect) {
              return std::max(1, static_cast<int>(rect.bottom - rect.top));
          }
          '''
          helper = '''

          int DesktopResizeHitTest(HWND window, LPARAM lParam) {
              if (!window || !IsWindow(window) || IsZoomed(window)) return HTNOWHERE;

              RECT rect{};
              if (!GetWindowRect(window, &rect)) return HTNOWHERE;

              const UINT dpi = std::max<UINT>(USER_DEFAULT_SCREEN_DPI, GetDpiForWindow(window));
              const int frameX = GetSystemMetricsForDpi(SM_CXSIZEFRAME, dpi) +
                                 GetSystemMetricsForDpi(SM_CXPADDEDBORDER, dpi);
              const int frameY = GetSystemMetricsForDpi(SM_CYSIZEFRAME, dpi) +
                                 GetSystemMetricsForDpi(SM_CXPADDEDBORDER, dpi);
              const int gripX = std::max(MulDiv(10, static_cast<int>(dpi), USER_DEFAULT_SCREEN_DPI), frameX);
              const int gripY = std::max(MulDiv(10, static_cast<int>(dpi), USER_DEFAULT_SCREEN_DPI), frameY);

              const POINT point{GET_X_LPARAM(lParam), GET_Y_LPARAM(lParam)};
              const bool left = point.x >= rect.left && point.x < rect.left + gripX;
              const bool right = point.x <= rect.right && point.x > rect.right - gripX;
              const bool top = point.y >= rect.top && point.y < rect.top + gripY;
              const bool bottom = point.y <= rect.bottom && point.y > rect.bottom - gripY;

              if (top && left) return HTTOPLEFT;
              if (top && right) return HTTOPRIGHT;
              if (bottom && left) return HTBOTTOMLEFT;
              if (bottom && right) return HTBOTTOMRIGHT;
              if (left) return HTLEFT;
              if (right) return HTRIGHT;
              if (top) return HTTOP;
              if (bottom) return HTBOTTOM;
              return HTNOWHERE;
          }
          '''

          if 'int DesktopResizeHitTest(HWND window, LPARAM lParam)' not in text:
              if helper_anchor not in text:
                  raise SystemExit('RectHeight anchor not found')
              text = text.replace(helper_anchor, helper_anchor + helper, 1)

          old_hit_test = '''        case WM_NCHITTEST: {
                      const LRESULT nativeHit = DefWindowProcW(hwnd, message, wParam, lParam);
                      if (nativeHit != HTCLIENT) return nativeHit;
                      break;
                  }
          '''
          new_hit_test = '''        case WM_NCHITTEST: {
                      const int resizeHit = DesktopResizeHitTest(hwnd, lParam);
                      if (resizeHit != HTNOWHERE) return resizeHit;
                      return DefWindowProcW(hwnd, message, wParam, lParam);
                  }
          '''

          if new_hit_test not in text:
              if old_hit_test not in text:
                  raise SystemExit('WM_NCHITTEST anchor not found')
              text = text.replace(old_hit_test, new_hit_test, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "GoodLoongStudio"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-library-diagonal-resize.yml
          git add src/native/src/ui/wallpaper/WallpaperLibraryWindowV2.cpp
          git commit -m "Restore diagonal resize grips in desktop library"
          git push origin main
