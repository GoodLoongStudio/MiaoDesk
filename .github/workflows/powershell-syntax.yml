name: PowerShell Syntax

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**/*.ps1'
      - 'docs/TURINGDESK-PRODUCT-BASELINE.md'
      - 'docs/TURINGDESK-NATIVE-TECH-BASELINE.md'
      - 'docs/L3-PI-RUNTIME-CONTRACT.md'
      - '.github/workflows/powershell-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powershell-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Verify current release baselines
        shell: pwsh
        run: |
          $required = @(
            'docs/TURINGDESK-PRODUCT-BASELINE.md',
            'docs/TURINGDESK-NATIVE-TECH-BASELINE.md',
            'docs/L3-PI-RUNTIME-CONTRACT.md'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required current release baseline missing: $path"
            }
          }

      - name: Reject retired architecture and self-modifying workflows
        shell: pwsh
        run: |
          $forbidden = @(
            'docs/L3-CODEX-RUNTIME-CONTRACT.md',
            'src/native/include/turingdesk/CodexRuntime.h',
            'src/native/src/CodexRuntime.cpp',
            'src/native/include/turingdesk/CodexHostBridge.h',
            'src/native/src/CodexHostBridge.cpp',
            'scripts/verify-codex-jsonl-wire.ps1',
            'docs/TURINGDESK-DESIGN-SPEC.md',
            'docs/LEGACY-REDUNDANCY-CLEANUP-PLAN.md',
            '.github/workflows/apply-codex-reconnect-diagnostics.yml',
            '.github/workflows/implement-l4-handoff.yml',
            '.github/workflows/repair-release-doc-contract.yml',
            '.github/workflows/repair-canonical-l3-boundary.yml',
            '.github/workflows/repair-l3-direct-runtime.yml'
          )
          foreach ($path in $forbidden) {
            if (Test-Path $path) {
              throw "Retired architecture or self-modifying automation must not return: $path"
            }
          }

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          $files = Get-ChildItem -Path scripts -Filter *.ps1 -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($file.FullName)::PowerShell parser found $($errors.Count) error(s)"
              foreach ($error in $errors) {
                Write-Host "  line $($error.Extent.StartLineNumber): $($error.Message)"
              }
            } else {
              Write-Host "OK  $($file.FullName)"
            }
          }

          if ($failed) { throw 'PowerShell syntax validation failed.' }
