name: Native Windows ARM64 Preview

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - src/native/**
      - vcpkg.json
      - vcpkg-configuration.json
      - .github/workflows/native-arm64-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-arm64-preview
  cancel-in-progress: true

jobs:
  preview-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Verify exact head
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Checkout SHA mismatch: actual=$actual event=$env:GITHUB_SHA" }

      - name: Configure lightweight preview
        shell: pwsh
        run: cmake -S . -B build-preview-arm64 -A ARM64 -DTURINGDESK_DEV_FAST=ON

      - name: Build preview UI binaries
        shell: pwsh
        run: cmake --build build-preview-arm64 --config Release --target TuringDesk TuringDeskWallpaper TuringDeskHarness --parallel

      - name: Prepare preview artifact
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'build-preview-arm64\src\native\Release'
          $dest = Join-Path $PWD 'preview-arm64'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          foreach ($exe in @('TuringDesk.exe', 'TuringDeskWallpaper.exe', 'TuringDeskHarness.exe')) {
            $path = Join-Path $source $exe
            if (-not (Test-Path $path -PathType Leaf)) { throw "Preview build is missing $exe" }
            Copy-Item $path $dest -Force
          }

          Get-ChildItem $source -Filter '*.dll' -File -ErrorAction SilentlyContinue | Copy-Item -Destination $dest -Force
          Set-Content -Path (Join-Path $dest 'preview-build-sha.txt') -Value $env:GITHUB_SHA -Encoding ASCII
          Set-Content -Path (Join-Path $dest 'preview-components.txt') -Value @(
            'TuringDesk.exe'
            'TuringDeskWallpaper.exe'
            'TuringDeskHarness.exe'
            'Desktop settings UI'
            'Widget settings UI'
            'AI API settings UI'
            'DeepSeek Harness UI'
          ) -Encoding UTF8

      - name: Upload lightweight preview
        uses: actions/upload-artifact@v4
        with:
          name: turingdesk-arm64-preview-${{ github.sha }}
          path: preview-arm64/
          if-no-files-found: error
          retention-days: 7
