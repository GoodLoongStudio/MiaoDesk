  <text x="396" y="410" font-family="Segoe UI, sans-serif" font-size="16" fill="#5878a0">● 正在移动文件 23 / 47</text>
  <rect x="396" y="424" width="330" height="6" rx="3" fill="#dbe8f7"/>
  <rect x="396" y="424" width="162" height="6" rx="3" fill="#8cbcff"/>

  <text x="374" y="486" font-family="Segoe UI, sans-serif" font-size="16" fill="#6e7c90">你可以随时继续说话、纠正或取消正在进行的动作。</text>

  <rect x="360" y="560" width="480" height="82" rx="22" fill="#ffffff" fill-opacity="0.48" stroke="#ffffff" stroke-opacity="0.82"/>
