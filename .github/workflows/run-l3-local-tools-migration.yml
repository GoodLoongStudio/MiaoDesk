name: Run L3 Local Tools Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-l3-local-tools-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Apply migration
        run: python scripts/apply-l3-local-tools-migration.py
      - name: Verify canonical L3 contract
        shell: pwsh
        run: ./scripts/verify-l3-runtime-contract.ps1
      - name: Commit implementation and clean migration scaffolding
        shell: bash
        run: |
          rm -f .github/workflows/run-l3-local-tools-migration.yml
          rm -f .github/workflows/add-l3-local-search-tools.yml
          rm -f scripts/apply-l3-local-tools-migration.py
          rm -f migration-l3-local-diagnostic.txt
          git config user.name 'GoodLoongStudio'
          git config user.email 'chnmlong@hotmail.com'
          git add -A
          git commit -m 'feat: add required native L3 search tools'
          git pull --rebase origin main
          git push origin HEAD:main
