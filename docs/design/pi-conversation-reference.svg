<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe7ff"/>
      <stop offset="0.5" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f6d7ea"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#f7fbff" stop-opacity="0.56"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#4b6480" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="165" cy="140" r="120" fill="#9fd0ff" opacity="0.25"/>
  <circle cx="1030" cy="170" r="150" fill="#efb7db" opacity="0.24"/>
  <circle cx="930" cy="640" r="180" fill="#aac8ff" opacity="0.18"/>

  <g filter="url(#shadow)">
