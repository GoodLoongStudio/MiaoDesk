name: Repair L3 Local Tool Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-l3-local-build.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Repair link dependencies and L3 file-query latency
        shell: python
        run: |
          from pathlib import Path

          cmake = Path('src/native/CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          wallpaper_anchor = '    src/L3Agent.cpp\n    src/L3PersistenceSelfTest.cpp\n'
          replacement = '    src/L3Agent.cpp\n    src/L3PersistenceSelfTest.cpp\n    src/AppSearch.cpp\n    src/GozSearch.cpp\n'
          if replacement not in text:
              if wallpaper_anchor not in text: raise SystemExit('Wallpaper L3 dependency anchor missing')
              text = text.replace(wallpaper_anchor, replacement, 1)
          cmake.write_text(text, encoding='utf-8', newline='\n')

          goz = Path('src/native/src/GozSearch.cpp')
          text = goz.read_text(encoding='utf-8')
          text = text.replace('constexpr DWORD kQueryTimeoutMs = 5000;\n', 'constexpr DWORD kQueryTimeoutMs = 5000;\nconstexpr DWORD kL3SyncQueryTimeoutMs = 2500;\n', 1)
          old = 'bool RunGozQuery(const std::wstring& binary, const std::wstring& query, DWORD maxResults,\n                 std::vector<std::wstring>& paths) {'
          new = 'bool RunGozQuery(const std::wstring& binary, const std::wstring& query, DWORD maxResults,\n                 std::vector<std::wstring>& paths, DWORD timeoutMs = kQueryTimeoutMs) {'
          if old in text: text = text.replace(old, new, 1)
          if 'DWORD timeoutMs = kQueryTimeoutMs' not in text: raise SystemExit('RunGozQuery timeout parameter missing')
          text = text.replace('const DWORD wait = WaitForSingleObject(process.hProcess, kQueryTimeoutMs);', 'const DWORD wait = WaitForSingleObject(process.hProcess, timeoutMs);', 1)
          sync_old = '    if (!RunGozQuery(binary, query, maxResults, paths)) return results;\n    results.reserve(paths.size());'
          sync_new = '    if (!RunGozQuery(binary, query, maxResults, paths, kL3SyncQueryTimeoutMs)) return results;\n    results.reserve(paths.size());'
          if sync_old in text: text = text.replace(sync_old, sync_new, 1)
          if 'kL3SyncQueryTimeoutMs)) return results;' not in text: raise SystemExit('L3 sync timeout call missing')
          goz.write_text(text, encoding='utf-8', newline='\n')
      - name: Verify canonical L3 contract
        shell: pwsh
        run: ./scripts/verify-l3-runtime-contract.ps1
      - name: Commit repair
        shell: bash
        run: |
          rm .github/workflows/fix-l3-local-build.yml
          git config user.name 'GoodLoongStudio'
          git config user.email 'chnmlong@hotmail.com'
          git add -A
          git commit -m 'fix: complete native L3 local tool integration'
          git pull --rebase origin main
          git push origin HEAD:main
