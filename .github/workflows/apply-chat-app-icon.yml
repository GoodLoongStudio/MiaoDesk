name: Apply unified MiaoMiao chat icon

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-chat-app-icon.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build canonical ICO from tray PNG
        shell: powershell
        run: |
          $source = 'packaging\windows-store\assets\TrayIcon64.png'
          $target = 'packaging\windows-store\assets\MiaoMiao.ico'
          [byte[]]$png = [System.IO.File]::ReadAllBytes($source)
          $stream = [System.IO.File]::Open($target, [System.IO.FileMode]::Create)
          try {
            $writer = New-Object System.IO.BinaryWriter $stream
            try {
              $writer.Write([uint16]0)
              $writer.Write([uint16]1)
              $writer.Write([uint16]1)
              $writer.Write([byte]64)
              $writer.Write([byte]64)
              $writer.Write([byte]0)
              $writer.Write([byte]0)
              $writer.Write([uint16]1)
              $writer.Write([uint16]32)
              $writer.Write([uint32]$png.Length)
              $writer.Write([uint32]22)
              $writer.Write($png)
            } finally { $writer.Dispose() }
          } finally { $stream.Dispose() }
      - name: Patch chat avatar and build asset copy
        shell: python
        run: |
          from pathlib import Path

          chat = Path('src/native/src/ui/ai/ConversationPanelImpl.inc')
          text = chat.read_text(encoding='utf-8')
          anchor = 'void DrawAvatar(HDC dc, int cx, int cy, int radius, bool user) {'
          helper = r'''HICON MiaoMiaoChatIcon() {
              static HICON icon = []() -> HICON {
                  wchar_t exePath[32768]{};
                  const DWORD length = GetModuleFileNameW(
                      nullptr, exePath, static_cast<DWORD>(std::size(exePath)));
                  if (length == 0 || length >= std::size(exePath)) return nullptr;
                  const fs::path path = fs::path(exePath).parent_path() / L"Assets" / L"MiaoMiao.ico";
                  std::error_code ec;
                  if (!fs::is_regular_file(path, ec)) return nullptr;
                  return reinterpret_cast<HICON>(LoadImageW(
                      nullptr, path.c_str(), IMAGE_ICON, 0, 0,
                      LR_LOADFROMFILE | LR_DEFAULTSIZE));
              }();
              return icon;
          }

          '''
          if 'HICON MiaoMiaoChatIcon()' not in text:
              if anchor not in text:
                  raise SystemExit('DrawAvatar anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''void DrawAvatar(HDC dc, int cx, int cy, int radius, bool user) {\n    HBRUSH outer = CreateSolidBrush(user ? RGB(250, 218, 198) : RGB(102, 151, 255));'''
          new = '''void DrawAvatar(HDC dc, int cx, int cy, int radius, bool user) {\n    if (!user) {\n        if (HICON icon = MiaoMiaoChatIcon()) {\n            const int side = radius * 2;\n            DrawIconEx(dc, cx - radius, cy - radius, icon, side, side, 0, nullptr, DI_NORMAL);\n            return;\n        }\n    }\n\n    HBRUSH outer = CreateSolidBrush(user ? RGB(250, 218, 198) : RGB(102, 151, 255));'''
          if new not in text:
              if old not in text:
                  raise SystemExit('DrawAvatar body anchor not found')
              text = text.replace(old, new, 1)
          chat.write_text(text, encoding='utf-8')

          cmake = Path('src/native/CMakeLists.txt')
          ctext = cmake.read_text(encoding='utf-8')
          cmake_anchor = 'add_executable(TuringDeskWidgetAcceptance ${TURINGDESK_WIDGET_ACCEPTANCE_SOURCES})\n'
          cmake_block = r'''

          # Keep the canonical 妙喵 application icon beside the native host in every
          # build, not only inside MSIX packaging. Tray and assistant chat avatar
          # intentionally consume this same asset.
          add_custom_command(TARGET TuringDesk POST_BUILD
              COMMAND ${CMAKE_COMMAND} -E make_directory "$<TARGET_FILE_DIR:TuringDesk>/Assets"
              COMMAND ${CMAKE_COMMAND} -E copy_if_different
                      "${CMAKE_SOURCE_DIR}/packaging/windows-store/assets/MiaoMiao.ico"
                      "$<TARGET_FILE_DIR:TuringDesk>/Assets/MiaoMiao.ico"
              VERBATIM
          )
          '''
          if 'packaging/windows-store/assets/MiaoMiao.ico' not in ctext:
              if cmake_anchor not in ctext:
                  raise SystemExit('CMake executable anchor not found')
              ctext = ctext.replace(cmake_anchor, cmake_anchor + cmake_block, 1)
          cmake.write_text(ctext, encoding='utf-8')
      - name: Verify patch
        shell: powershell
        run: |
          if (-not (Test-Path 'packaging\windows-store\assets\MiaoMiao.ico')) { throw 'MiaoMiao.ico missing' }
          Select-String -Path 'src\native\src\ui\ai\ConversationPanelImpl.inc' -Pattern 'MiaoMiaoChatIcon' -SimpleMatch
          Select-String -Path 'src\native\CMakeLists.txt' -Pattern 'MiaoMiao.ico' -SimpleMatch
          git diff --check
      - name: Commit unified icon
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/windows-store/assets/MiaoMiao.ico src/native/src/ui/ai/ConversationPanelImpl.inc src/native/CMakeLists.txt
          git commit -m "Use app icon for assistant chat avatar"
          git push origin HEAD:main
