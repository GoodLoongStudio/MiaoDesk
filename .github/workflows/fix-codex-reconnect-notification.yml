name: Fix Codex Reconnect Notification Handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-codex-reconnect-notification.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Treat Codex reconnect notifications as transient
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/native/src/CodexRuntime.cpp')
          s = path.read_text(encoding='utf-8')
          old = '''        if (method == "error") {
            const auto message = ExtractJsonString(line, "\\\"message\\\"");
            error = message.empty() ? L"Codex app-server 返回 error 通知" : Utf8ToWide(message);
            AppendRuntimeLog(L"app-server: error notification: " + error);
            break;
        }
'''
          new = '''        if (method == "error") {
            const auto message = ExtractJsonString(line, "\\\"message\\\"");
            const std::wstring notification = message.empty() ? L"Codex app-server 返回 error 通知" : Utf8ToWide(message);
            if (notification.starts_with(L"Reconnecting...")) {
                bool relayAlive = true;
                DWORD relayExitCode = STILL_ACTIVE;
                std::wstring relayState = L"; relay=not-required";
                if (setup.relayRequired) {
                    std::scoped_lock lock(processMutex_);
                    relayAlive = ProcessAlive(relayProcess_);
                    if (relayProcess_ && !relayAlive) GetExitCodeProcess(relayProcess_, &relayExitCode);
                    relayState = relayAlive ? L"; relay=alive" : L"; relay=exited code=" + std::to_wstring(relayExitCode);
                }
                AppendRuntimeLog(L"app-server: transient reconnect notification: " + notification + relayState);
                if (relayAlive) continue;
                error = L"Codex Relay 已退出，ExitCode=" + std::to_wstring(relayExitCode) + L"；" + notification;
                break;
            }
            error = notification;
            AppendRuntimeLog(L"app-server: error notification: " + error);
            break;
        }
'''
          if old not in s:
              raise SystemExit('Codex error-notification block not found')
          s = s.replace(old, new, 1)
          path.write_text(s, encoding='utf-8', newline='\n')

          guard = Path('scripts/verify-l3-runtime-contract.ps1')
          g = guard.read_text(encoding='utf-8')
          anchor = "    'session: failed'\n"
          replacement = "    'session: failed',\n    'notification.starts_with(L\"Reconnecting...\")',\n    'app-server: transient reconnect notification:',\n    'relay=exited code='\n"
          if anchor not in g:
              raise SystemExit('L3 guard Codex marker anchor not found')
          g = g.replace(anchor, replacement, 1)
          guard.write_text(g, encoding='utf-8', newline='\n')

          Path('.github/workflows/fix-codex-reconnect-notification.yml').unlink()

      - name: Verify L3 runtime contract
        shell: pwsh
        run: ./scripts/verify-l3-runtime-contract.ps1

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'GoodLoongStudio'
          git config user.email 'chnmlong@hotmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: let Codex retry transient relay disconnects'
          git push origin HEAD:main
