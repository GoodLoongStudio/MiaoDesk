name: Repair packaged Scene library removal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-packaged-scene-library-remove.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch library UI removal semantics
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/native/src/WallpaperLibraryWindow.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'if (removeButton) EnableWindow(removeButton, selected->kind != LibraryWallpaperKind::Scene);'
          new = 'if (removeButton) EnableWindow(removeButton, !(selected->kind == LibraryWallpaperKind::Scene && selected->source.empty()));'
          if old not in text:
              raise SystemExit('remove button anchor not found')
          text = text.replace(old, new, 1)
          old = '''        if (selected->kind == LibraryWallpaperKind::Scene) {
            SetStatus(L"基础 Scene 不能从资源库删除。");
            return;
        }'''
          new = '''        if (selected->kind == LibraryWallpaperKind::Scene && selected->source.empty()) {
            SetStatus(L"基础 Scene 不能从资源库删除。");
            return;
        }'''
          if old not in text:
              raise SystemExit('remove handler anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-packaged-scene-library-remove.yml
      - name: Commit repair to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/src/WallpaperLibraryWindow.cpp .github/workflows/fix-packaged-scene-library-remove.yml
          git commit -m "fix: allow removing packaged Scene library items"
          git push origin HEAD:main
