name: Repair Codex Final Output

on:
  push:
    branches: [main]
    paths:
      - .github/codex-final-output-trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Patch Codex final-message handling
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('src/native/src/CodexRuntime.cpp')
          s = p.read_text(encoding='utf-8')

          old = '''    bool startAccepted = false;
    std::string line;
    while (!stopToken.stop_requested() && ReadLine(line)) {'''
          new = '''    bool startAccepted = false;
    bool emittedAgentText = false;
    std::wstring finalAgentText;
    std::string line;
    while (!stopToken.stop_requested() && ReadLine(line)) {'''
          if old not in s:
              raise SystemExit('RunTurn state anchor not found')
          s = s.replace(old, new, 1)

          old = '''        if (method == "item/agentMessage/delta") {
            const auto delta = ExtractJsonString(line, "\\\"delta\\\"");
            if (!delta.empty() && onDelta) onDelta(Utf8ToWide(delta));
            continue;
        }
        if (method == "turn/completed") {'''
          new = '''        if (method == "item/agentMessage/delta") {
            const auto delta = ExtractJsonString(line, "\\\"delta\\\"");
            if (!delta.empty()) {
                emittedAgentText = true;
                if (onDelta) onDelta(Utf8ToWide(delta));
            }
            continue;
        }
        // Codex app-server may complete an agent message without emitting any
        // item/agentMessage/delta notifications (for example through a relay or
        // a non-streaming compatible provider). Always retain the canonical
        // final agentMessage text and surface it once when streaming produced
        // nothing, otherwise the L3 UI is left at "AI …" with an empty result.
        if (method == "item/completed") {
            const auto type = ExtractJsonString(line, "\\\"type\\\"");
            if (type == "agentMessage") {
                const auto text = ExtractJsonString(line, "\\\"text\\\"");
                if (!text.empty()) {
                    finalAgentText = Utf8ToWide(text);
                    if (!emittedAgentText) {
                        emittedAgentText = true;
                        if (onDelta) onDelta(finalAgentText);
                    }
                }
            }
            continue;
        }
        if (method == "turn/completed") {'''
          if old not in s:
              raise SystemExit('agent message anchor not found')
          s = s.replace(old, new, 1)

          old = '''            if (onDone) onDone(std::move(done));
            return;
        }'''
          new = '''            if (done.empty() && !emittedAgentText && !finalAgentText.empty()) {
                emittedAgentText = true;
                if (onDelta) onDelta(finalAgentText);
            }
            if (done.empty() && !emittedAgentText) {
                done = L"Codex turn 已完成，但模型没有返回可显示文本";
            }
            if (onDone) onDone(std::move(done));
            return;
        }'''
          pos = s.find('        if (method == "turn/completed") {')
          if pos < 0:
              raise SystemExit('turn/completed anchor not found')
          tail = s[pos:]
          if old not in tail:
              raise SystemExit('turn/completed completion anchor not found')
          tail = tail.replace(old, new, 1)
          s = s[:pos] + tail

          p.write_text(s, encoding='utf-8')

      - name: Add source-level regression guard
        shell: bash
        run: |
          grep -q 'method == "item/completed"' src/native/src/CodexRuntime.cpp
          grep -q 'type == "agentMessage"' src/native/src/CodexRuntime.cpp
          grep -q 'finalAgentText' src/native/src/CodexRuntime.cpp
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-codex-final-output.yml .github/codex-final-output-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/src/CodexRuntime.cpp .github/workflows/fix-codex-final-output.yml .github/codex-final-output-trigger
          git commit -m "fix: surface final Codex agent messages"
          git pull --rebase origin main
          git push origin HEAD:main
