name: Repair L3 Direct Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-l3-direct-runtime.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Remove external Codex runtime from ordinary L3
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/native/src/L3CliWindow.cpp')
          s = path.read_text(encoding='utf-8')

          s = s.replace('#include "turingdesk/CodexRuntime.h"\n', '')
          s = s.replace('constexpr UINT kCodexDoneMessage = WM_APP + 33;\n', '')
          s = s.replace('enum class ActiveRuntime {\n    Codex,\n    DirectModel,\n};', 'enum class ActiveRuntime {\n    DirectModel,\n};')
          s = s.replace('    CodexRuntime* codex{};\n', '')
          s = s.replace('    ActiveRuntime activeRuntime{ActiveRuntime::Codex};', '    ActiveRuntime activeRuntime{ActiveRuntime::DirectModel};')
          s = s.replace('CodexRuntime gCodexRuntime;\n', '')
          s = re.sub(r'\nfs::path CodexDetailLogPath\(\) \{.*?\n\}\n', '\n', s, count=1, flags=re.S)
          s = s.replace('    case ActiveRuntime::Codex: return L"Codex CLI";\n', '')
          s = s.replace('    case ActiveRuntime::Codex: return L"主路由 · Relay/API";\n', '')
          s = s.replace('    case ActiveRuntime::DirectModel: return L"Fallback · SSE 流式";', '    case ActiveRuntime::DirectModel: return L"SSE 流式";')

          s, n = re.subn(
              r'std::wstring RuntimeStatusText\(CliState& state\) \{.*?\n\}\n\nvoid FinishTurn',
              '''std::wstring RuntimeStatusText(CliState& state) {
              std::wstring text = L"L3 runtime: TuringDesk Direct Model SSE";
              text += L"\\r\\nProvider: " + (state.agent->Config().providerId.empty() ? std::wstring(L"unconfigured") : state.agent->Config().providerId);
              text += L" · Model: " + (state.agent->Config().model.empty() ? std::wstring(L"unconfigured") : state.agent->Config().model);
              text += L"\\r\\nLocal tools: in-process whitelist before model requests";
              text += L"\\r\\nDeep workbench: explicit L4 only";
              text += L"\\r\\nRoute log: " + L3RouteLogPath().wstring();
              return text;
          }

          void FinishTurn''',
              s, count=1, flags=re.S)
          if n != 1: raise SystemExit('RuntimeStatusText block not found')

          s, n = re.subn(r'\nvoid StartDirectFallback\(CliState& state, const std::wstring& codexError\) \{.*?\n\}\n\nvoid StopTurn', '\nvoid StopTurn', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('StartDirectFallback block not found')

          s = s.replace('    if (state.activeRuntime == ActiveRuntime::Codex) state.codex->Stop();\n    else state.agent->Stop();', '    state.agent->Stop();')
          s = s.replace('                state.codex->ResetSession();\n                AppendRouteLog(L"route: Codex session reset by user");', '                AppendRouteLog(L"route: L3 session reset by user");')

          request_re = re.compile(r'    state\.lastPrompt = actualPrompt;.*?    state\.codex->AskAsync\(\*state\.agent, actualPrompt, std::move\(onDelta\), std::move\(onDone\)\);', re.S)
          request = '''    state.lastPrompt = actualPrompt;
              state.activePrompt = actualPrompt;
              state.activeRuntime = ActiveRuntime::DirectModel;
              state.transcriptPrefix += L"> " + typedPrompt + (retry ? L"  [重试上一请求]" : L"") + L"\\r\\n";
              state.transcriptPrefix += L"[Runtime] " + RuntimeName(ActiveRuntime::DirectModel) + L" · " + RuntimeExecutionLabel(ActiveRuntime::DirectModel) + L"\\r\\n";
              state.transcriptPrefix += L"AI  ";
              state.streaming.clear();
              state.busy = true;
              state.generation = gCliGeneration.fetch_add(1, std::memory_order_relaxed) + 1;
              EnableWindow(state.input, FALSE);
              RenderTranscript(state, L"…");

              AppendRouteLog(L"route: direct model start; provider=" + state.agent->Config().providerId +
                             L"; model=" + state.agent->Config().model +
                             L"; endpoint=" + SafeEndpoint(state.agent->CurrentApiUrl()));

              const auto generation = state.generation;
              const HWND hwnd = state.window;
              auto onDelta = [hwnd, generation](std::wstring delta) {
                  PostUi(hwnd, kDeltaMessage, generation, std::move(delta));
              };
              auto onDone = [hwnd, generation](std::wstring done) {
                  PostUi(hwnd, kDoneMessage, generation, std::move(done));
              };
              state.agent->AskAsync(actualPrompt, std::move(onDelta), std::move(onDone));'''
          s, n = request_re.subn(request, s, count=1)
          if n != 1: raise SystemExit('Codex request block not found')

          s, n = re.subn(r'    case kCodexDoneMessage: \{.*?\n    \}\n', '', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Codex completion block not found')
          s = s.replace('        if (payload->text.empty()) AppendRouteLog(L"fallback: direct api success");\n        else AppendRouteLog(L"fallback: direct api failed; error=" + payload->text);', '        if (payload->text.empty()) AppendRouteLog(L"route: direct model success");\n        else AppendRouteLog(L"route: direct model failed; error=" + payload->text);')
          s = s.replace('                state->codex->ResetSession();\n', '')
          s = s.replace('        state->codex->Stop();\n', '')
          s = s.replace('    state->codex = &gCodexRuntime;\n', '')
          s = s.replace('    AppendRouteLog(L"window: L3 opened; primary=Codex CLI -> Relay/API; fallback=Direct API");', '    AppendRouteLog(L"window: L3 opened; runtime=Direct Model SSE; local-tools=in-process");')

          for forbidden in ('CodexRuntime','gCodexRuntime','ActiveRuntime::Codex','kCodexDoneMessage','state.codex','state->codex'):
              if forbidden in s: raise SystemExit(f'forbidden marker remains: {forbidden}')
          for required in ('state.agent->TryHandleLocal','state.agent->AskAsync','case WM_NCDESTROY:','auto* state = new CliState{};'):
              if required not in s: raise SystemExit(f'required marker missing: {required}')
          path.write_text(s, encoding='utf-8', newline='\n')

          cmake = Path('src/native/CMakeLists.txt')
          c = cmake.read_text(encoding='utf-8')
          c = c.replace('    src/CodexRuntime.cpp\n', '')
          c = c.replace('    COMMENT "Verifying Codex-first L3 runtime contract"', '    COMMENT "Verifying canonical lightweight L3 runtime contract"')
          if 'src/CodexRuntime.cpp' in c: raise SystemExit('CodexRuntime.cpp still compiled into TuringDesk')
          cmake.write_text(c, encoding='utf-8', newline='\n')

      - name: Verify canonical runtime contract
        shell: pwsh
        run: ./scripts/verify-l3-runtime-contract.ps1

      - name: Commit repair and remove one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/repair-l3-direct-runtime.yml
          rm -f .github/workflows/repair-canonical-l3-boundary.yml
          rm -f .github/workflows/fix-codex-reconnect-notification.yml
          git config user.name 'GoodLoongStudio'
          git config user.email 'chnmlong@hotmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore direct-model L3 runtime boundary'
          git pull --rebase origin main
          git push origin HEAD:main
