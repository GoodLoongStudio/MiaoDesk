name: Restore Canonical L3 Boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-canonical-l3-boundary.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Restore canonical lightweight L3
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/native/src/L3CliWindow.cpp')
          s = p.read_text(encoding='utf-8')

          s = s.replace('#include "turingdesk/CodexRuntime.h"\n', '')
          s = s.replace('constexpr UINT kCodexDoneMessage = WM_APP + 33;\n', '')
          s = s.replace('enum class ActiveRuntime {\n    Codex,\n    DirectModel,\n};', 'enum class ActiveRuntime {\n    DirectModel,\n};')
          s = s.replace('    CodexRuntime* codex{};\n', '')
          s = s.replace('CodexRuntime gCodexRuntime;\n', '')

          s = re.sub(r'\nfs::path CodexDetailLogPath\(\) \{.*?\n\}\n', '\n', s, flags=re.S)

          s = s.replace('    case ActiveRuntime::Codex: return L"Codex CLI";\n', '')
          s = s.replace('    case ActiveRuntime::Codex: return L"主路由 · Relay/API";\n', '')
          s = s.replace('    case ActiveRuntime::DirectModel: return L"Fallback · SSE 流式";', '    case ActiveRuntime::DirectModel: return L"SSE 流式";')

          status_pat = re.compile(r'std::wstring RuntimeStatusText\(CliState& state\) \{.*?\n\}\n\nvoid FinishTurn', re.S)
          status_repl = '''std::wstring RuntimeStatusText(CliState& state) {
              std::wstring text = L"L3 runtime: TuringDesk Direct Model SSE";
              text += L"\\r\\nProvider: " + (state.agent->Config().providerId.empty() ? std::wstring(L"unconfigured") : state.agent->Config().providerId);
              text += L" · Model: " + (state.agent->Config().model.empty() ? std::wstring(L"unconfigured") : state.agent->Config().model);
              text += L"\\r\\nLocal tools: handled in-process before model requests";
              text += L"\\r\\nDeep workbench: explicit L4 only";
              text += L"\\r\\nRoute log: " + L3RouteLogPath().wstring();
              return text;
          }

          void FinishTurn'''
          s, n = status_pat.subn(status_repl, s, count=1)
          if n != 1:
              raise SystemExit('RuntimeStatusText anchor not found')

          fallback_pat = re.compile(r'\nvoid StartDirectFallback\(CliState& state, const std::wstring& codexError\) \{.*?\n\}\n\nvoid StopTurn', re.S)
          s, n = fallback_pat.subn('\nvoid StopTurn', s, count=1)
          if n != 1:
              raise SystemExit('StartDirectFallback block not found')

          s = s.replace('    if (state.activeRuntime == ActiveRuntime::Codex) state.codex->Stop();\n    else state.agent->Stop();', '    state.agent->Stop();')
          s = s.replace('                state.codex->ResetSession();\n                AppendRouteLog(L"route: Codex session reset by user");\n', '                AppendRouteLog(L"route: L3 session reset by user");\n')
          s = s.replace('    state.activeRuntime = ActiveRuntime::Codex;', '    state.activeRuntime = ActiveRuntime::DirectModel;')
          s = s.replace('    state.transcriptPrefix += L"[Runtime] " + RuntimeName(ActiveRuntime::Codex) + L" · " + RuntimeExecutionLabel(ActiveRuntime::Codex) + L"\\r\\n";', '    state.transcriptPrefix += L"[Runtime] " + RuntimeName(ActiveRuntime::DirectModel) + L" · " + RuntimeExecutionLabel(ActiveRuntime::DirectModel) + L"\\r\\n";')
          s = re.sub(r'    AppendRouteLog\(L"route: primary codex start; provider=" \+ state\.agent->Config\(\)\.providerId \+\n                   L"; model=" \+ state\.agent->Config\(\)\.model \+\n                   L"; endpoint=" \+ SafeEndpoint\(state\.agent->CurrentApiUrl\(\)\)\);', '    AppendRouteLog(L"route: direct model start; provider=" + state.agent->Config().providerId +\n                   L"; model=" + state.agent->Config().model +\n                   L"; endpoint=" + SafeEndpoint(state.agent->CurrentApiUrl()));', s)
          s = s.replace('        PostUi(hwnd, kCodexDoneMessage, generation, std::move(done));', '        PostUi(hwnd, kDoneMessage, generation, std::move(done));')
          s = s.replace('    state.codex->AskAsync(*state.agent, actualPrompt, std::move(onDelta), std::move(onDone));', '    state.agent->AskAsync(actualPrompt, std::move(onDelta), std::move(onDone));')

          codex_case = re.compile(r'    case kCodexDoneMessage: \{.*?\n    \}\n', re.S)
          s, n = codex_case.subn('', s, count=1)
          if n != 1:
              raise SystemExit('Codex done-message block not found')

          s = s.replace('        if (payload->text.empty()) AppendRouteLog(L"fallback: direct api success");\n        else AppendRouteLog(L"fallback: direct api failed; error=" + payload->text);', '        if (payload->text.empty()) AppendRouteLog(L"route: direct model success");\n        else AppendRouteLog(L"route: direct model failed; error=" + payload->text);')
          s = s.replace('                state->codex->ResetSession();\n', '')
          s = s.replace('        state->codex->Stop();\n', '')
          s = s.replace('    state->codex = &gCodexRuntime;\n', '')
          s = s.replace('    AppendRouteLog(L"window: L3 opened; primary=Codex CLI -> Relay/API; fallback=Direct API");', '    AppendRouteLog(L"window: L3 opened; runtime=Direct Model SSE; local-tools=in-process");')

          for forbidden in ('CodexRuntime', 'gCodexRuntime', 'ActiveRuntime::Codex', 'kCodexDoneMessage', 'state.codex', 'state->codex'):
              if forbidden in s:
                  raise SystemExit(f'forbidden L3 marker remains: {forbidden}')
          for required in ('state.agent->TryHandleLocal', 'state.agent->AskAsync', 'kDeltaMessage', 'kDoneMessage', 'case WM_NCDESTROY:'):
              if required not in s:
                  raise SystemExit(f'required L3 marker missing: {required}')
          p.write_text(s, encoding='utf-8', newline='\n')

          cmake = Path('src/native/CMakeLists.txt')
          c = cmake.read_text(encoding='utf-8')
          c = c.replace('    src/CodexRuntime.cpp\n', '')
          c = c.replace('    COMMENT "Verifying Codex-first L3 runtime contract"', '    COMMENT "Verifying canonical lightweight L3 runtime contract"')
          cmake.write_text(c, encoding='utf-8', newline='\n')

      - name: Replace L3 contract guard with canonical ASCII-only guard
        shell: python
        run: |
          from pathlib import Path
          guard = r'''$ErrorActionPreference = 'Stop'

          $root = Split-Path -Parent $PSScriptRoot
          $requiredDocs = @(
              'docs/TURINGDESK-DESIGN-SPEC.md',
              'docs/V1-SCENE-RELEASE-SCOPE.md',
              'docs/AI-WORKBENCH-CONSOLIDATION-PLAN.md',
              'docs/LEGACY-REDUNDANCY-CLEANUP-PLAN.md'
          )
          foreach ($relative in $requiredDocs) {
              $path = Join-Path $root $relative
              if (-not (Test-Path $path -PathType Leaf)) { throw "Required release baseline missing: $relative" }
          }

          $l3Path = Join-Path $root 'src/native/src/L3CliWindow.cpp'
          $searchPath = Join-Path $root 'src/native/src/SearchWindow.cpp'
          $cmakePath = Join-Path $root 'src/native/CMakeLists.txt'
          $harnessPath = Join-Path $root 'src/native/src/HarnessProcessManager.cpp'
          $armWorkflowPath = Join-Path $root '.github/workflows/native-search-windows.yml'
          $x64WorkflowPath = Join-Path $root '.github/workflows/native-x64-validation.yml'
          foreach ($path in @($l3Path,$searchPath,$cmakePath,$harnessPath,$armWorkflowPath,$x64WorkflowPath)) {
              if (-not (Test-Path $path -PathType Leaf)) { throw "Contract input missing: $path" }
          }

          $l3 = Get-Content $l3Path -Raw
          $search = Get-Content $searchPath -Raw
          $cmake = Get-Content $cmakePath -Raw
          $harness = Get-Content $harnessPath -Raw
          $armWorkflow = Get-Content $armWorkflowPath -Raw
          $x64Workflow = Get-Content $x64WorkflowPath -Raw

          foreach ($marker in @('state.agent->TryHandleLocal','state.agent->AskAsync','kDeltaMessage','kDoneMessage','case WM_NCDESTROY:','RuntimeLogPath(L"l3-runtime.log")')) {
              if (-not $l3.Contains($marker)) { throw "L3 lightweight contract marker missing: $marker" }
          }
          foreach ($marker in @('CodexRuntime','gCodexRuntime','ActiveRuntime::Codex','kCodexDoneMessage','4317','4318','MCP')) {
              if ($l3.Contains($marker)) { throw "External/legacy runtime marker returned to ordinary L3: $marker" }
          }
          if ($cmake.Contains('src/CodexRuntime.cpp')) { throw 'Ordinary TuringDesk binary must not compile CodexRuntime.cpp.' }

          foreach ($marker in @('while (IsWindow(window))','GetMessageW(&msg')) {
              if ($l3.Contains($marker)) { throw "L3 window owns a nested message loop: $marker" }
          }
          foreach ($marker in @('auto* state = new CliState{};','case WM_NCDESTROY:','reinterpret_cast<LONG_PTR>(state)')) {
              if (-not $l3.Contains($marker)) { throw "L3 nonblocking lifecycle marker missing: $marker" }
          }
          $start = $search.IndexOf('void SearchWindow::StartL3')
          if ($start -lt 0) { throw 'SearchWindow::StartL3 missing.' }
          $tail = $search.Substring($start, [Math]::Min(1800, $search.Length - $start))
          if ($tail.Contains('ShowAndFocus();')) { throw 'L3 must not force Search focus after opening/closing.' }

          foreach ($marker in @('web --host 127.0.0.1 --port 3080','127.0.0.1')) {
              if (-not $harness.Contains($marker)) { throw "Harness loopback contract marker missing: $marker" }
          }
          foreach ($marker in @('--no-open','0.0.0.0','4317','4318','MCP')) {
              if ($harness.Contains($marker)) { throw "Harness forbidden marker present: $marker" }
          }

          foreach ($workflow in @($armWorkflow,$x64Workflow)) {
              if (-not $workflow.Contains('verify-l3-runtime-contract.ps1')) { throw 'Cloud build is missing the L3 contract guard.' }
          }

          Write-Host 'L3 contract OK: in-process local tools, Direct Model SSE, explicit L4 Harness, loopback-only workbench.'
          '''
          Path('scripts/verify-l3-runtime-contract.ps1').write_text(guard, encoding='utf-8', newline='\n')

      - name: Run canonical contract guard
        shell: pwsh
        run: ./scripts/verify-l3-runtime-contract.ps1

      - name: Commit canonical repair
        shell: bash
        run: |
          rm -f .github/workflows/fix-codex-reconnect-notification.yml
          rm -f .github/workflows/repair-canonical-l3-boundary.yml
          git config user.name 'GoodLoongStudio'
          git config user.email 'chnmlong@hotmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore canonical lightweight L3 boundary'
          git push origin HEAD:main
