name: Apply widget flicker and weather fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-widget-flicker-weather.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch-widget-flicker-weather.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- src/native/CMakeLists.txt \
                     src/native/include/turingdesk/NativeWidgetPainter.h \
                     src/native/src/desktop/widgets/NativeWidgetHost.cpp \
                     src/native/src/desktop/widgets/NativeWeatherService.cpp \
                     src/native/src/ui/wallpaper/WallpaperLibraryWindowV2.cpp
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/CMakeLists.txt \
                  src/native/include/turingdesk/NativeWidgetPainter.h \
                  src/native/src/desktop/widgets/NativeWidgetHost.cpp \
                  src/native/src/desktop/widgets/NativeWeatherService.cpp \
                  src/native/src/ui/wallpaper/WallpaperLibraryWindowV2.cpp
          git commit -m "Fix widget settings flicker and use real weather"
          git push origin HEAD:main
