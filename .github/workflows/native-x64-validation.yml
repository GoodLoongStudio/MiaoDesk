name: Native Windows x64 Source Validation

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - src/native/**
      - .github/workflows/native-x64-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-x64-source
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Configure x64
        run: cmake -S . -B build-x64 -A x64

      - name: Build x64
        run: cmake --build build-x64 --config Release --parallel

      - name: Native source self-tests
        shell: pwsh
        run: |
          foreach ($test in @(
            @{ Exe = '.\build-x64\src\native\Release\TuringDesk.exe'; Name = 'Search/AI' },
            @{ Exe = '.\build-x64\src\native\Release\TuringDeskWallpaper.exe'; Name = 'Wallpaper' },
            @{ Exe = '.\build-x64\src\native\Release\TuringDeskHarness.exe'; Name = 'Harness shell' }
          )) {
            $p = Start-Process -FilePath $test.Exe -ArgumentList '--self-test' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$($test.Name) self-test failed: $($p.ExitCode)" }
          }
