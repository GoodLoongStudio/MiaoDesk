name: Apply desktop settings library layout routing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-desktop-settings-layout-now.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Route settings to desktop library
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/native/src/WallpaperEngine.cpp')
          s = p.read_text(encoding='utf-8')

          old = '''    void ShowSettings() {\n        if (settings_ && IsWindow(settings_)) {\n'''
          new = '''    void ShowSettings() {\n        ShowLibrary();\n    }\n\n    void ShowAdvancedSettings() {\n        if (settings_ && IsWindow(settings_)) {\n'''
          if old not in s:
              raise SystemExit('ShowSettings anchor not found')
          s = s.replace(old, new, 1)

          old = '''    void ShowLibrary() {\n        libraryWindow_.Show(\n            instance_, &library_, LibraryTargets(),\n            [this](const turingdesk::wallpaper::WallpaperLibraryItem& item, const std::wstring& targetMonitorId) {\n                ApplyLibraryItem(item, targetMonitorId);\n            });\n    }\n'''
          new = '''    void ShowLibrary() {\n        libraryWindow_.Show(\n            instance_, &library_, LibraryTargets(),\n            [this](const turingdesk::wallpaper::WallpaperLibraryItem& item, const std::wstring& targetMonitorId) {\n                ApplyLibraryItem(item, targetMonitorId);\n            },\n            [this](turingdesk::wallpaper::WallpaperSettingsSection section) {\n                using Section = turingdesk::wallpaper::WallpaperSettingsSection;\n                if (section == Section::Playlists || section == Section::Rules) {\n                    ShowAutomation();\n                } else if (section == Section::Displays || section == Section::Performance) {\n                    ShowAdvancedSettings();\n                } else if (section == Section::AI) {\n                    MessageBoxW(libraryWindow_.Window(),\n                                L"AI 模型配置位于 TuringDesk 设置中心。桌面 AI 创作入口会在此页继续接入。",\n                                L"TuringDesk 设置", MB_OK | MB_ICONINFORMATION);\n                }\n            });\n    }\n'''
          if old not in s:
              raise SystemExit('ShowLibrary anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Commit directly to main
        shell: bash
        run: |
          rm -f .github/workflows/restore-desktop-settings-layout-now.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ui: route desktop settings to card library"
          git push origin HEAD:main
