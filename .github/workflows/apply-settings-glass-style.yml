name: Apply settings glass style

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-settings-glass-style.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch settings shell and API actions
        shell: python
        run: |
          from pathlib import Path

          api = Path('src/native/src/ui/settings/DesktopAiSettingsPage.cpp')
          text = api.read_text(encoding='utf-8')
          old = 'WS_CHILD | WS_VISIBLE | WS_TABSTOP | BS_PUSHBUTTON,'
          new = 'WS_CHILD | WS_VISIBLE | WS_TABSTOP | BS_OWNERDRAW,'
          if old not in text:
              raise SystemExit('API button style anchor missing')
          text = text.replace(old, new, 1)

          paint_anchor = '    void Paint(HDC dc) {\n'
          draw_method = r'''    void DrawActionButton(const DRAWITEMSTRUCT& draw) {
              const int id = static_cast<int>(draw.CtlID);
              const bool primary = id == kSaveId || id == kNewId;
              const bool danger = id == kDeleteId;
              const bool pressed = (draw.itemState & ODS_SELECTED) != 0;
              const bool disabled = (draw.itemState & ODS_DISABLED) != 0;
              RECT rect = draw.rcItem;
              InflateRect(&rect, -S(1), -S(1));

              COLORREF background = RGB(251, 253, 255);
              COLORREF border = RGB(202, 216, 237);
              COLORREF foreground = RGB(42, 91, 170);
              if (primary) {
                  background = pressed ? RGB(31, 99, 222) : RGB(43, 116, 255);
                  border = background;
                  foreground = RGB(255, 255, 255);
              } else if (danger) {
                  background = pressed ? RGB(255, 235, 237) : RGB(255, 248, 249);
                  border = RGB(248, 211, 215);
                  foreground = RGB(224, 64, 72);
              } else if (pressed) {
                  background = RGB(237, 245, 255);
              }
              if (disabled) {
                  background = RGB(244, 247, 251);
                  border = RGB(225, 231, 239);
                  foreground = RGB(155, 166, 184);
              }
              RoundFill(draw.hDC, rect, S(10), background, border);
              wchar_t label[128]{};
              GetWindowTextW(draw.hwndItem, label, static_cast<int>(std::size(label)));
              DrawTextSimple(draw.hDC, bodyFont, foreground, label, rect,
                             DT_CENTER | DT_VCENTER | DT_SINGLELINE);
              if (draw.itemState & ODS_FOCUS) {
                  RECT focus = rect;
                  InflateRect(&focus, -S(4), -S(4));
                  DrawFocusRect(draw.hDC, &focus);
              }
          }

'''
          if 'void DrawActionButton(const DRAWITEMSTRUCT& draw)' not in text:
              if paint_anchor not in text:
                  raise SystemExit('API Paint anchor missing')
              text = text.replace(paint_anchor, draw_method + paint_anchor, 1)

          old_draw = '''        if (draw && draw->CtlID == kProfileListId) {
              state->DrawProfileItem(*draw);
              return TRUE;
          }
          break;'''
          new_draw = '''        if (draw && draw->CtlID == kProfileListId) {
              state->DrawProfileItem(*draw);
              return TRUE;
          }
          if (draw && draw->CtlType == ODT_BUTTON) {
              state->DrawActionButton(*draw);
              return TRUE;
          }
          break;'''
          if old_draw not in text:
              raise SystemExit('API WM_DRAWITEM anchor missing')
          text = text.replace(old_draw, new_draw, 1)
          api.write_text(text, encoding='utf-8')

          shell = Path('src/native/src/ui/wallpaper/WallpaperLibraryWindowV2.cpp')
          s = shell.read_text(encoding='utf-8')
          replacements = {
              'std::wstring(installed ? L"壁纸库" : widgets ? L"小组件" : L"妙喵 AI")': 'std::wstring(installed ? L"壁纸库" : widgets ? L"组件" : L"API 配置")',
              'SetWindowTextW(sectionTitle, installed ? L"壁纸库" : widgets ? L"小组件" : L"妙喵 AI");': 'SetWindowTextW(sectionTitle, installed ? L"壁纸库" : widgets ? L"组件" : L"API 配置");',
              'const std::array<const wchar_t*, 3> navLabels{L"壁纸", L"小组件", L"妙喵 AI"};': 'const std::array<const wchar_t*, 3> navLabels{L"壁纸", L"组件", L"API 配置"};',
              'FillSolid(dc, whole, RGB(255, 255, 255));': 'FillSolid(dc, whole, RGB(248, 251, 255));',
              'FillSolid(dc, sidebar, RGB(247, 248, 250));': 'FillSolid(dc, sidebar, RGB(241, 247, 255));',
              'FillSolid(dc, footer, RGB(249, 249, 251));': 'FillSolid(dc, footer, RGB(248, 251, 255));',
              'HPEN pen = CreatePen(PS_SOLID, 1, RGB(226, 228, 233));': 'HPEN pen = CreatePen(PS_SOLID, 1, RGB(220, 231, 245));',
          }
          for old_value, new_value in replacements.items():
              if old_value not in s:
                  raise SystemExit(f'settings shell anchor missing: {old_value}')
              s = s.replace(old_value, new_value, 1)

          old_nav = '''        const bool active = static_cast<int>(draw->CtlID) == activeNavId;
          const COLORREF background = active ? RGB(230, 239, 255) : RGB(247, 248, 250);
          FillSolid(draw->hDC, draw->rcItem, background);
          SetBkMode(draw->hDC, TRANSPARENT);
          SetTextColor(draw->hDC, active ? RGB(26, 86, 190) : RGB(54, 57, 64));
          HGDIOBJ old = SelectObject(draw->hDC, active ? cardTitleFont : bodyFont);
          wchar_t text[64]{};
          GetWindowTextW(draw->hwndItem, text, static_cast<int>(std::size(text)));
          RECT label = draw->rcItem;
          label.left += S(14);
          DrawTextW(draw->hDC, text, -1, &label, DT_LEFT | DT_VCENTER | DT_SINGLELINE);
          if (active) {
              RECT line{draw->rcItem.left, draw->rcItem.top + S(7), draw->rcItem.left + S(3), draw->rcItem.bottom - S(7)};
              FillSolid(draw->hDC, line, GetSysColor(COLOR_HIGHLIGHT));
          }
          if (draw->itemState & ODS_FOCUS) DrawFocusRect(draw->hDC, &draw->rcItem);
          SelectObject(draw->hDC, old);
          return TRUE;'''
          new_nav = '''        const bool active = static_cast<int>(draw->CtlID) == activeNavId;
          RECT face = draw->rcItem;
          InflateRect(&face, -S(4), -S(2));
          const COLORREF background = active ? RGB(230, 241, 255) : RGB(241, 247, 255);
          const COLORREF border = active ? RGB(186, 213, 250) : background;
          HBRUSH brush = CreateSolidBrush(background);
          HPEN pen = CreatePen(PS_SOLID, 1, border);
          HGDIOBJ oldBrush = SelectObject(draw->hDC, brush);
          HGDIOBJ oldPen = SelectObject(draw->hDC, pen);
          RoundRect(draw->hDC, face.left, face.top, face.right, face.bottom, S(12), S(12));
          SelectObject(draw->hDC, oldPen);
          SelectObject(draw->hDC, oldBrush);
          DeleteObject(pen);
          DeleteObject(brush);

          SetBkMode(draw->hDC, TRANSPARENT);
          SetTextColor(draw->hDC, active ? RGB(35, 105, 225) : RGB(45, 65, 98));
          HGDIOBJ old = SelectObject(draw->hDC, active ? cardTitleFont : bodyFont);
          wchar_t text[64]{};
          GetWindowTextW(draw->hwndItem, text, static_cast<int>(std::size(text)));
          RECT label = face;
          label.left += S(18);
          DrawTextW(draw->hDC, text, -1, &label, DT_LEFT | DT_VCENTER | DT_SINGLELINE);
          if (draw->itemState & ODS_FOCUS) {
              RECT focus = face;
              InflateRect(&focus, -S(4), -S(4));
              DrawFocusRect(draw->hDC, &focus);
          }
          SelectObject(draw->hDC, old);
          return TRUE;'''
          if old_nav not in s:
              raise SystemExit('DrawNavButton block missing')
          s = s.replace(old_nav, new_nav, 1)
          shell.write_text(s, encoding='utf-8')

      - name: Verify patch
        shell: pwsh
        run: |
          Select-String -Path 'src\native\src\ui\settings\DesktopAiSettingsPage.cpp' -Pattern 'DrawActionButton' -SimpleMatch
          Select-String -Path 'src\native\src\ui\wallpaper\WallpaperLibraryWindowV2.cpp' -Pattern 'API 配置' -SimpleMatch
          git diff --check
      - name: Commit settings style
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/src/ui/settings/DesktopAiSettingsPage.cpp src/native/src/ui/wallpaper/WallpaperLibraryWindowV2.cpp
          git commit -m "Apply glass style to settings center"
          git push origin HEAD:main
