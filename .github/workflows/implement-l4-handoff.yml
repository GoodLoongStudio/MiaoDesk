name: Implement Explicit L4 Harness Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-l4-handoff.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Add shared handoff transport
        shell: python
        run: |
          from pathlib import Path
          header = r'''#pragma once
#include <string>

namespace turingdesk {

constexpr unsigned long kHarnessHandoffCopyDataId = 0x5444484F; // TDHO

bool WriteHarnessHandoffFile(const std::wstring& prompt, std::wstring& path, std::wstring& error);
std::wstring ReadHarnessHandoffFile(const std::wstring& path);
std::wstring BuildHarnessPrefillScript(const std::wstring& prompt);
bool HarnessHandoffSelfTest();

} // namespace turingdesk
'''
          source = r'''#include "turingdesk/HarnessHandoff.h"
#include <windows.h>
#include <filesystem>
#include <fstream>
#include <iterator>
#include <string_view>

namespace fs = std::filesystem;

namespace turingdesk {
namespace {

std::string WideToUtf8(std::wstring_view value) {
    if (value.empty()) return {};
    const int count = WideCharToMultiByte(CP_UTF8, 0, value.data(), static_cast<int>(value.size()), nullptr, 0, nullptr, nullptr);
    if (count <= 0) return {};
    std::string out(static_cast<std::size_t>(count), '\0');
    WideCharToMultiByte(CP_UTF8, 0, value.data(), static_cast<int>(value.size()), out.data(), count, nullptr, nullptr);
    return out;
}

std::wstring Utf8ToWide(std::string_view value) {
    if (value.empty()) return {};
    int count = MultiByteToWideChar(CP_UTF8, MB_ERR_INVALID_CHARS, value.data(), static_cast<int>(value.size()), nullptr, 0);
    if (count <= 0) count = MultiByteToWideChar(CP_UTF8, 0, value.data(), static_cast<int>(value.size()), nullptr, 0);
    if (count <= 0) return {};
    std::wstring out(static_cast<std::size_t>(count), L'\0');
    MultiByteToWideChar(CP_UTF8, 0, value.data(), static_cast<int>(value.size()), out.data(), count);
    return out;
}

fs::path HandoffDirectory() {
    wchar_t localAppData[32768]{};
    const DWORD length = GetEnvironmentVariableW(L"LOCALAPPDATA", localAppData, static_cast<DWORD>(std::size(localAppData)));
    if (length == 0 || length >= std::size(localAppData)) return {};
    fs::path directory = fs::path(localAppData) / L"TuringDesk" / L"Handoff";
    std::error_code ec;
    fs::create_directories(directory, ec);
    return ec ? fs::path{} : directory;
}

std::wstring EscapeJavascriptString(const std::wstring& value) {
    std::wstring out;
    out.reserve(value.size() + 32);
    for (wchar_t ch : value) {
        switch (ch) {
        case L'\\': out += L"\\\\"; break;
        case L'\"': out += L"\\\""; break;
        case L'\r': out += L"\\r"; break;
        case L'\n': out += L"\\n"; break;
        case L'\t': out += L"\\t"; break;
        default:
            if (ch < 0x20) {
                wchar_t escaped[7]{};
                swprintf_s(escaped, L"\\u%04X", static_cast<unsigned>(ch));
                out += escaped;
            } else {
                out.push_back(ch);
            }
        }
    }
    return out;
}

} // namespace

bool WriteHarnessHandoffFile(const std::wstring& prompt, std::wstring& path, std::wstring& error) {
    path.clear();
    error.clear();
    if (prompt.empty()) {
        error = L"handoff prompt is empty";
        return false;
    }
    const auto directory = HandoffDirectory();
    if (directory.empty()) {
        error = L"cannot create handoff directory";
        return false;
    }
    const fs::path file = directory / (L"handoff-" + std::to_wstring(GetCurrentProcessId()) + L"-" + std::to_wstring(GetTickCount64()) + L".txt");
    const auto utf8 = WideToUtf8(prompt);
    std::ofstream stream(file, std::ios::binary | std::ios::trunc);
    if (!stream) {
        error = L"cannot create handoff file";
        return false;
    }
    stream.write(utf8.data(), static_cast<std::streamsize>(utf8.size()));
    stream.close();
    if (!stream) {
        std::error_code ignored;
        fs::remove(file, ignored);
        error = L"cannot write handoff file";
        return false;
    }
    path = file.wstring();
    return true;
}

std::wstring ReadHarnessHandoffFile(const std::wstring& path) {
    if (path.empty()) return {};
    std::ifstream stream(fs::path(path), std::ios::binary);
    if (!stream) return {};
    const std::string utf8((std::istreambuf_iterator<char>(stream)), std::istreambuf_iterator<char>());
    stream.close();
    std::error_code ignored;
    fs::remove(fs::path(path), ignored);
    return Utf8ToWide(utf8);
}

std::wstring BuildHarnessPrefillScript(const std::wstring& prompt) {
    const auto escaped = EscapeJavascriptString(prompt);
    return L"(() => { const t=document.querySelector('textarea'); if(!t) return 'missing'; const p=\"" + escaped +
           L"\"; const d=Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value'); "
           L"if(d&&d.set)d.set.call(t,p);else t.value=p; "
           L"t.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:p})); "
           L"t.dispatchEvent(new Event('change',{bubbles:true})); t.focus(); return t.value===p?'ok':'mismatch'; })()";
}

bool HarnessHandoffSelfTest() {
    const std::wstring sample = L"quote=\"x\"\\path\r\nline2 中文";
    const auto script = BuildHarnessPrefillScript(sample);
    return script.find(L"querySelector('textarea')") != std::wstring::npos &&
           script.find(L"dispatchEvent(new InputEvent") != std::wstring::npos &&
           script.find(L"\\\"x\\\"") != std::wstring::npos &&
           script.find(L"\\\\path") != std::wstring::npos &&
           script.find(L"\\r\\nline2") != std::wstring::npos &&
           script.find(L"中文") != std::wstring::npos;
}

} // namespace turingdesk
