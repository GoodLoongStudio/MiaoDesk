name: Native Windows x64 Source Validation

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - src/native/**
      - scripts/verify-l3-runtime-contract.ps1
      - scripts/verify-runtime-log-paths.ps1
      - scripts/verify-desktop-domain-contract.ps1
      - scripts/verify-desktop-shell-ownership.ps1
      - scripts/verify-native-source-layout.ps1
      - scripts/verify-desktop-ui-parity.ps1
      - scripts/verify-widget-product-model.ps1
      - scripts/verify-arm64-updater-runtime-reuse.ps1
      - scripts/verify-installed-widget-acceptance-contract.ps1
      - scripts/run-widget-runtime-acceptance.ps1
      - scripts/run-installed-widget-acceptance.ps1
      - scripts/confirm-widget-visual-acceptance.ps1
      - scripts/seal-widget-acceptance-evidence.ps1
      - scripts/verify-widget-acceptance-evidence.ps1
      - scripts/verify-widget-acceptance-session-evidence.ps1
      - scripts/verify-widget-acceptance-evidence-verifier-contract.ps1
      - scripts/verify-widget-acceptance-contract.ps1
      - scripts/verify-windows-powershell-compat.ps1
      - scripts/deploy-native-arm64.ps1
      - scripts/update-turingdesk-arm64.ps1
      - scripts/prepare-third-party-runtime-arm64.ps1
      - docs/TURINGDESK-PRODUCT-BASELINE.md
      - docs/TURINGDESK-NATIVE-TECH-BASELINE.md
      - docs/TURINGDESK-DESKTOP-COMPLETION-PLAN.md
      - docs/NATIVE_SOURCE_LAYOUT.md
      - docs/DESKTOP_DOMAIN_ARCHITECTURE.md
      - docs/L3-PI-RUNTIME-CONTRACT.md
      - docs/WIDGET_RUNTIME_HEALTH_M3.md
      - docs/WIDGET_ACCEPTANCE_SEQUENCE_M3.md
      - docs/WIDGET_ACCEPTANCE_EVIDENCE_M3.md
      - docs/WIDGET_PLACEMENT_HEALTH_M3.md
      - docs/WIDGET_PRODUCT_MODEL_M3.md
      - docs/WIDGET_INSTALLED_ACCEPTANCE_M3.md
      - DEPLOY-NATIVE-ARM64.cmd
      - UPDATE-TURINGDESK.cmd
      - README.md
      - .github/workflows/native-x64-validation.yml
      - .github/workflows/native-search-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-x64-source
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Verify checkout matches workflow commit
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checkout SHA mismatch: actual=$actual event=$env:GITHUB_SHA"
          }
          Write-Host "Validating exact workflow commit: $actual"

      - name: Verify Windows PowerShell 5.1 entrypoints
        shell: powershell
        run: .\scripts\verify-windows-powershell-compat.ps1

      - name: Exercise one-click updater bootstrap
        shell: cmd
        env:
          TD_BOOTSTRAP_SELF_TEST: 1
          TD_UPDATE_URL: https://raw.githubusercontent.com/GoodLoongStudio/TuringDesk/${{ github.sha }}/scripts/update-turingdesk-arm64.ps1
        run: UPDATE-TURINGDESK.cmd

      - name: Verify native physical source layout
        shell: powershell
        run: .\scripts\verify-native-source-layout.ps1

      - name: Verify desktop domain contract
        shell: powershell
        run: .\scripts\verify-desktop-domain-contract.ps1

      - name: Verify DesktopShellHost ownership
        shell: powershell
        run: .\scripts\verify-desktop-shell-ownership.ps1

      - name: Verify Pi-first TuringDesk runtime contract
        shell: pwsh
        run: .\scripts\verify-l3-runtime-contract.ps1

      - name: Verify fixed-format Widget product contract
        shell: powershell
        run: .\scripts\verify-widget-product-model.ps1

      - name: Configure x64
        run: cmake -S . -B build-x64 -A x64

      - name: Build x64
        run: cmake --build build-x64 --config Release --parallel

      - name: Native source self-tests
        shell: pwsh
        run: |
          foreach ($test in @(
            @{ Exe = '.\build-x64\src\native\Release\TuringDesk.exe'; Name = 'Search/AI' },
            @{ Exe = '.\build-x64\src\native\Release\TuringDeskWallpaper.exe'; Name = 'Wallpaper' },
            @{ Exe = '.\build-x64\src\native\Release\TuringDeskHarness.exe'; Name = 'Advanced Workbench shell' }
          )) {
            $p = Start-Process -FilePath $test.Exe -ArgumentList '--self-test' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$($test.Name) self-test failed: $($p.ExitCode)" }
          }
