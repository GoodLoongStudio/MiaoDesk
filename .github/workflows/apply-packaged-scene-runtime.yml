name: Apply packaged Scene runtime chain
# trigger-revision: 1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-packaged-scene-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Implement packaged Scene runtime aliases
        shell: python
        run: |
          from pathlib import Path

          h = Path('src/native/include/turingdesk/WallpaperPackage.h')
          s = h.read_text(encoding='utf-8')
          s = s.replace('    std::wstring provenance;\n    int fpsCap{30};', '    std::wstring provenance;\n    std::wstring sceneKey;\n    int fpsCap{30};', 1)
          anchor = '''    static bool CreateWeb(
        const std::filesystem::path& packageDirectory,
        std::wstring title,
        std::string_view htmlUtf8,
        std::wstring provenance = L"user-authored",
        std::wstring author = L"TuringDesk",
        std::wstring* error = nullptr);
'''
          insert = anchor + '''
    static bool CreateScene(
        const std::filesystem::path& packageDirectory,
        std::wstring title,
        std::wstring sceneKey,
        std::wstring provenance = L"user-authored",
        std::wstring author = L"TuringDesk",
        std::wstring* error = nullptr);
'''
          if anchor not in s: raise SystemExit('WallpaperPackage.h CreateWeb anchor changed')
          s = s.replace(anchor, insert, 1)
          h.write_text(s, encoding='utf-8')

          p = Path('src/native/src/WallpaperPackage.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('           << "  \\"provenance\\": \\"" << EscapeJson(manifest.provenance) << "\\",\\n"\n           << "  \\"fps_cap\\": "',
                        '           << "  \\"provenance\\": \\"" << EscapeJson(manifest.provenance) << "\\",\\n"\n           << "  \\"scene_key\\": \\"" << EscapeJson(manifest.sceneKey) << "\\",\\n"\n           << "  \\"fps_cap\\": "', 1)
          create_anchor = '''bool WallpaperPackage::Validate(const fs::path& packageDirectory, WallpaperPackageManifest* manifest,
                                std::wstring* error) {'''
          create_scene = '''bool WallpaperPackage::CreateScene(const fs::path& packageDirectory, std::wstring title,
                                   std::wstring sceneKey, std::wstring provenance,
                                   std::wstring author, std::wstring* error) {
    SetError(error, L"");
    sceneKey = Lower(std::move(sceneKey));
    if (sceneKey != L"aurora" && sceneKey != L"neon" && sceneKey != L"grid") {
        SetError(error, L"Scene renderer 必须是 aurora、neon 或 grid");
        return false;
    }
    if (packageDirectory.empty()) { SetError(error, L"壁纸包目录不能为空"); return false; }
    if (title.empty()) title = L"TuringDesk Scene";
    if (title.size() > 256) title.resize(256);
    if (author.empty()) author = L"TuringDesk";
    if (provenance.empty()) provenance = L"user-authored";
    std::error_code ec;
    fs::create_directories(packageDirectory, ec);
    if (ec) { SetError(error, L"无法创建 .tdwall 目录：" + packageDirectory.wstring()); return false; }
    const fs::path entry = packageDirectory / L"scene.json";
    std::ofstream scene(entry, std::ios::binary | std::ios::trunc);
    if (!scene) { SetError(error, L"无法写入 Scene 入口文件"); return false; }
    scene << "{\\n  \\"renderer\\": \\"" << WideToUtf8(sceneKey) << "\\"\\n}\\n";
    scene.close();
    WallpaperPackageManifest manifest;
    manifest.schema = 1;
    manifest.type = WallpaperPackageType::Scene;
    manifest.title = std::move(title);
    manifest.author = std::move(author);
    manifest.entry = L"scene.json";
    manifest.provenance = std::move(provenance);
    manifest.sceneKey = std::move(sceneKey);
    manifest.fpsCap = 30;
    if (!WriteManifest(packageDirectory / L"manifest.json", manifest)) {
        SetError(error, L"无法写入 Scene 壁纸包 manifest.json");
        return false;
    }
    return Validate(packageDirectory, nullptr, error);
}

'''
          if create_anchor not in s: raise SystemExit('WallpaperPackage.cpp Validate anchor changed')
          s = s.replace(create_anchor, create_scene + create_anchor, 1)
          s = s.replace('    parsed.provenance = Utf8ToWide(ExtractJsonString(json, "provenance"));\n    parsed.fpsCap',
                        '    parsed.provenance = Utf8ToWide(ExtractJsonString(json, "provenance"));\n    parsed.sceneKey = Lower(Utf8ToWide(ExtractJsonString(json, "scene_key")));\n    parsed.fpsCap', 1)
          web_block = '''    if (parsed.type == WallpaperPackageType::Web) {
        const auto extension = Lower(resolvedEntry.extension().wstring());
        if (extension != L".html" && extension != L".htm") {
            SetError(error, L"Web .tdwall 的 entry 必须是 HTML 文件");
            return false;
        }
    }
'''
          scene_block = web_block + '''    if (parsed.type == WallpaperPackageType::Scene) {
        if (Lower(resolvedEntry.extension().wstring()) != L".json") {
            SetError(error, L"Scene .tdwall 的 entry 必须是 JSON 文件");
            return false;
        }
        if (parsed.sceneKey != L"aurora" && parsed.sceneKey != L"neon" && parsed.sceneKey != L"grid") {
            SetError(error, L"Scene .tdwall 引用了不受支持的 renderer");
            return false;
        }
    }
'''
          if web_block not in s: raise SystemExit('WallpaperPackage.cpp web validation anchor changed')
          s = s.replace(web_block, scene_block, 1)
          old_test = '''    const bool valid = created && Validate(root, &manifest, &error) && manifest.type == WallpaperPackageType::Web &&
                       manifest.entry == fs::path(L"index.html") && manifest.title == L"Self Test";
    fs::remove_all(root, ec);
    return valid;
'''
          new_test = '''    bool valid = created && Validate(root, &manifest, &error) && manifest.type == WallpaperPackageType::Web &&
                 manifest.entry == fs::path(L"index.html") && manifest.title == L"Self Test";
    const fs::path sceneRoot = root.parent_path() / (root.stem().wstring() + L"-scene.tdwall");
    WallpaperPackageManifest sceneManifest;
    valid = valid && CreateScene(sceneRoot, L"Scene Self Test", L"neon", L"self-test", L"TuringDesk", &error) &&
            Validate(sceneRoot, &sceneManifest, &error) && sceneManifest.type == WallpaperPackageType::Scene &&
            sceneManifest.sceneKey == L"neon" && sceneManifest.entry == fs::path(L"scene.json");
    valid = valid && !CreateScene(sceneRoot.parent_path() / L"invalid-scene.tdwall", L"Invalid", L"unknown", L"self-test", L"TuringDesk", &error);
    fs::remove_all(root, ec);
    fs::remove_all(sceneRoot, ec);
    fs::remove_all(sceneRoot.parent_path() / L"invalid-scene.tdwall", ec);
    return valid;
'''
          if old_test not in s: raise SystemExit('WallpaperPackage SelfTest anchor changed')
          s = s.replace(old_test, new_test, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/native/src/WallpaperLibrary.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''        case WallpaperPackageType::Web: kind = LibraryWallpaperKind::Web; break;
        case WallpaperPackageType::Scene:
        case WallpaperPackageType::Unknown: continue;
'''
          new = '''        case WallpaperPackageType::Web: kind = LibraryWallpaperKind::Web; break;
        case WallpaperPackageType::Scene: kind = LibraryWallpaperKind::Scene; break;
        case WallpaperPackageType::Unknown: continue;
'''
          if old not in s: raise SystemExit('WallpaperLibrary Scene skip anchor changed')
          s = s.replace(old, new, 1)
          webtest = '''    ok = ok && WallpaperPackage::CreateWeb(package, L"Package Web", "<html><body>package</body></html>", L"self-test", L"TuringDesk", &error);
'''
          if webtest not in s: raise SystemExit('WallpaperLibrary package selftest anchor changed')
          s = s.replace(webtest, webtest + '''    const fs::path scenePackage = library.PackageDirectory() / L"selftest-scene.tdwall";
    ok = ok && WallpaperPackage::CreateScene(scenePackage, L"Package Scene", L"grid", L"self-test", L"TuringDesk", &error);
''', 1)
          lookup = '''    const auto packageItems = reloaded.Search(L"Package Web");
    ok = ok && !packageItems.empty();
'''
          if lookup not in s: raise SystemExit('WallpaperLibrary lookup selftest anchor changed')
          s = s.replace(lookup, lookup + '''    const auto sceneItems = reloaded.Search(L"Package Scene");
    ok = ok && !sceneItems.empty() && sceneItems.front().kind == LibraryWallpaperKind::Scene;
''', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/native/src/WallpaperEngine.cpp')
          s = p.read_text(encoding='utf-8')
          include_anchor = '#include "turingdesk/WallpaperPerformancePolicy.h"\n'
          if include_anchor not in s: raise SystemExit('WallpaperEngine include anchor changed')
          s = s.replace(include_anchor, include_anchor + '#include "turingdesk/WallpaperPackage.h"\n', 1)
          old_scene = '''        if (item.kind == Kind::Scene) {
            if (_wcsicmp(item.id.c_str(), L"scene-aurora") == 0) next.scene = L"aurora";
            else if (_wcsicmp(item.id.c_str(), L"scene-neon") == 0) next.scene = L"neon";
            else if (_wcsicmp(item.id.c_str(), L"scene-grid") == 0) next.scene = L"grid";
            else return false;
            return true;
        }
'''
          new_scene = '''        if (item.kind == Kind::Scene) {
            if (_wcsicmp(item.id.c_str(), L"scene-aurora") == 0) next.scene = L"aurora";
            else if (_wcsicmp(item.id.c_str(), L"scene-neon") == 0) next.scene = L"neon";
            else if (_wcsicmp(item.id.c_str(), L"scene-grid") == 0) next.scene = L"grid";
            else if (!item.source.empty()) {
                turingdesk::wallpaper::WallpaperPackageManifest manifest;
                std::wstring packageError;
                const auto packageDirectory = item.source.parent_path();
                if (!turingdesk::wallpaper::WallpaperPackage::Validate(packageDirectory, &manifest, &packageError) ||
                    manifest.type != turingdesk::wallpaper::WallpaperPackageType::Scene || manifest.sceneKey.empty()) return false;
                next.scene = manifest.sceneKey;
            } else return false;
            return true;
        }
'''
          if old_scene not in s: raise SystemExit('WallpaperEngine Scene apply anchor changed')
          s = s.replace(old_scene, new_scene, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-packaged-scene-runtime.yml
          git add src/native/include/turingdesk/WallpaperPackage.h src/native/src/WallpaperPackage.cpp src/native/src/WallpaperLibrary.cpp src/native/src/WallpaperEngine.cpp
          git commit -m "feat: run packaged Scene wallpapers through native renderers"
          git pull --rebase origin main
          git push origin HEAD:main
