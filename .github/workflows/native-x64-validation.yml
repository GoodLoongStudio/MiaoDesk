name: Native Windows x64 Source Validation

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - src/native/**
      - scripts/verify-l3-runtime-contract.ps1
      - scripts/verify-runtime-log-paths.ps1
      - scripts/verify-windows-powershell-compat.ps1
      - scripts/deploy-native-arm64.ps1
      - scripts/update-turingdesk-arm64.ps1
      - scripts/prepare-third-party-runtime-arm64.ps1
      - docs/TURINGDESK-PRODUCT-BASELINE.md
      - docs/TURINGDESK-NATIVE-TECH-BASELINE.md
      - docs/L3-PI-RUNTIME-CONTRACT.md
      - DEPLOY-NATIVE-ARM64.cmd
      - UPDATE-TURINGDESK.cmd
      - README.md
      - .github/workflows/native-x64-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-x64-source
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Verify Windows PowerShell 5.1 entrypoints
        shell: powershell
        run: .\scripts\verify-windows-powershell-compat.ps1

      - name: Exercise one-click updater bootstrap
        shell: cmd
        env:
          TD_BOOTSTRAP_SELF_TEST: 1
        run: UPDATE-TURINGDESK.cmd

      - name: Verify Pi-first TuringDesk runtime contract
        shell: pwsh
        run: .\scripts\verify-l3-runtime-contract.ps1

      - name: Configure x64
        run: cmake -S . -B build-x64 -A x64

      - name: Build x64
        run: cmake --build build-x64 --config Release --parallel

      - name: Native source self-tests
        shell: pwsh
        run: |
          foreach ($test in @(
            @{ Exe = '.\build-x64\src\native\Release\TuringDesk.exe'; Name = 'Search/AI' },
            @{ Exe = '.\build-x64\src\native\Release\TuringDeskWallpaper.exe'; Name = 'Wallpaper' },
            @{ Exe = '.\build-x64\src\native\Release\TuringDeskHarness.exe'; Name = 'Advanced Workbench shell' }
          )) {
            $p = Start-Process -FilePath $test.Exe -ArgumentList '--self-test' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$($test.Name) self-test failed: $($p.ExitCode)" }
          }
