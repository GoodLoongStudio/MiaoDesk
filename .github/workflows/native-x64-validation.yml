name: Native Windows x64 Source Validation

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - src/native/**
      - .github/workflows/native-x64-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-x64-source
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Guard lightweight L3 runtime boundary
        shell: pwsh
        run: |
          $source = Get-Content 'src/native/src/L3CliWindow.cpp' -Raw
          foreach ($marker in @('CodexRuntime', 'ActiveRuntime::Codex', 'gCodexRuntime', '4317', '4318', 'MCP')) {
            if ($source.Contains($marker)) { throw "Ordinary L3 must not depend on external Agent/Harness runtime marker: $marker" }
          }
          $cmake = Get-Content 'src/native/CMakeLists.txt' -Raw
          if (-not $cmake.Contains('src/DirectAgentRuntimeV2.cpp')) {
            throw 'TuringDesk Native Tool Runtime must be compiled into the default L3 binary.'
          }
          foreach ($marker in @('DirectToolRuntimeDisabled.cpp', 'src/CodexRuntime.cpp')) {
            if ($cmake.Contains($marker)) { throw "Ordinary L3 binary must not compile external/disabled runtime source: $marker" }
          }

      - name: Configure x64
        run: cmake -S . -B build-x64 -A x64

      - name: Build x64
        run: cmake --build build-x64 --config Release --parallel

      - name: Native source self-tests
        shell: pwsh
        run: |
          foreach ($test in @(
            @{ Exe = '.\build-x64\src\native\Release\TuringDesk.exe'; Name = 'Search/AI' },
            @{ Exe = '.\build-x64\src\native\Release\TuringDeskWallpaper.exe'; Name = 'Wallpaper' },
            @{ Exe = '.\build-x64\src\native\Release\TuringDeskHarness.exe'; Name = 'Harness shell' }
          )) {
            $p = Start-Process -FilePath $test.Exe -ArgumentList '--self-test' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$($test.Name) self-test failed: $($p.ExitCode)" }
          }
