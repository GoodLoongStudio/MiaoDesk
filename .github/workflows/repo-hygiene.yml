name: Repo Hygiene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

# 这三个闸门都和"构建能否通过"无关,也都不需要 Windows 镜像或构建产物。它们各自挡住的
# 都是真正发生过、而且被现有闸门放过去的事故:
#
#   no-conflict-markers     2026-09-22 stage.ps1 里留着 <<<<<<< 三行,干掉了三个打包
#                           工作流。.ps1 不进 C++ 编译器,所以在被 pwsh 解析前一路绿灯。
#
#   cmake-covers-sources    MiaoD3D11TextureLoader.cpp 在磁盘上、语法没问题,但没进
#                           MIAODESK_*_SOURCES,从来没被编译过 → 链接期 LNK2019。
#                           语法闸门扫的是"磁盘上有什么",照样编译它,所以看不出它没被收录。
#
#   skill-allowlist         kContentSkills 是封闭白名单。任何一侧单独变更都静默失衡:
#                           多建目录而没进白名单 → 该 skill 对 AI 不可达;白名单里有而
#                           磁盘没有 → 只在用户真的用时才报错。
#
# 用 ubuntu-latest + shell: bash:只读文本和跑一次 CMake Configure,不需要 Windows;
# 显式指定 shell 是为了不依赖某个镜像的默认 shell。
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Verify no unresolved merge conflict markers
        shell: bash
        run: bash scripts/verify-no-conflict-markers.sh

      - name: Verify every source file is actually compiled by CMake
        shell: bash
        run: bash scripts/verify-cmake-covers-sources.sh

      - name: Verify the content-skill allowlist matches skills/
        shell: bash
        run: bash scripts/verify-skill-allowlist.sh

      # paths 过滤覆盖它自己会执行的文件。同一个缺口 2026-09-22 撞了三次:tests/**、
      # scripts/**、runtime/agent/package-lock.json 都不在相应工作流的过滤里,于是
      # 改了那些文件,唯一验证它们的工作流根本不触发 —— 改完等于没验。
      - name: Verify every workflow's paths filter covers what it runs
        shell: bash
        run: bash scripts/verify-workflow-paths.sh

      # verify-path-layout-contract.ps1 里与平台无关的那几条。整段那个 .ps1 在
      # macOS 上跑不了(它按反斜杠比对一个 allowlist,而 macOS 的 FullName 是正斜杠,
      # 假阳性),于是那些规则本机一直没人跑得动 —— 2026-09-22 就有一句**注释**里的
      # fs::current_path() 连红两次提交。这里把不依赖分隔符的检查搬过来。
      - name: Verify native source shape and path policy
        shell: bash
        run: bash scripts/verify-native-source-hygiene.sh

      # CMake 目标结构。一天之内在本仓库踩了三次,而这三类错此前没有任何闸门看得见:
      #   add_executable 追加在 foreach 之后 → Configure 期报错、编译期表现为找不到头文件;
      #   有声明但没有 target_link_libraries → 编译通过、链接才 LNK2019,而本机语法门
      #     只做 -fsyntax-only,看不见;
      #   同一个 .cpp 出现在两处源清单 → 同样是路径契约里的 one-owner 规则。
      - name: Verify CMake target structure
        shell: bash
        run: bash scripts/verify-cmake-target-hygiene.sh

      # 贴图场景 fixture 有两份,一份给 Windows 上的真渲染,一份给本机验 schema。
      # 只改一边的后果是:本机那份永远绿着,Windows 那份跑真渲染时才因为一个字段名
      # 写错而失败,报的却是"绘制失败",没有任何线索指向 fixture。
      - name: Verify the two textured-sprite scene fixtures have not drifted
        shell: bash
        run: bash scripts/verify-scene-fixture-parity.sh

      # 这两个 node 闸门是可移植的(纯 JS + 读仓库文本),但此前只挂在
      # windows-x64-build 后面 —— 于是验证它们要等一整轮 15 分钟的 Windows 构建,
      # 而 2026-09-22 那次失败就是在这条路上被拖了很久才暴露。放到这里,每次推送
      # 几秒内就能知道它们是否仍然通过。
      - name: Verify image_generate provider parameterisation
        shell: bash
        run: node tests/image-provider.mjs

      - name: Verify web audio bridge shim
        shell: bash
        run: node tests/WebAudioBridge.mjs
