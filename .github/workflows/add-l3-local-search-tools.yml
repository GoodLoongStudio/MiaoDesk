name: Add Required L3 Local Search Tools

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-l3-local-search-tools.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Add synchronous goz query adapter
        shell: python
        run: |
          from pathlib import Path

          h = Path('src/native/include/turingdesk/GozSearch.h')
          s = h.read_text(encoding='utf-8')
          anchor = '    bool Query(HWND replyWindow, const std::wstring& query, DWORD maxResults = 12) const;\n'
          add = anchor + '    std::vector<SearchResult> QuerySync(const std::wstring& query, DWORD maxResults = 12) const;\n'
          if 'QuerySync(' not in s:
              if anchor not in s: raise SystemExit('GozSearch header anchor missing')
              s = s.replace(anchor, add, 1)
              h.write_text(s, encoding='utf-8', newline='\n')

          cpp = Path('src/native/src/GozSearch.cpp')
          s = cpp.read_text(encoding='utf-8')
          anchor = '''bool GozSearch::HandleCopyData(const COPYDATASTRUCT* copyData, std::vector<SearchResult>& results) const {
          '''
          impl = '''std::vector<SearchResult> GozSearch::QuerySync(const std::wstring& query, DWORD maxResults) const {
              std::vector<SearchResult> results;
              if (query.empty() || maxResults == 0) return results;
              const auto binary = FindClientBinary();
              if (binary.empty() || !PipeAvailable()) return results;

              std::vector<std::wstring> paths;
              if (!RunGozQuery(binary, query, maxResults, paths)) return results;
              results.reserve(paths.size());
              for (std::size_t i = 0; i < paths.size(); ++i) {
                  const auto& fullPath = paths[i];
                  if (fullPath.empty()) continue;
                  fs::path path(fullPath);
                  std::wstring title = path.filename().wstring();
                  if (title.empty()) title = fullPath;
                  const DWORD attributes = GetFileAttributesW(fullPath.c_str());
                  const bool directory = attributes != INVALID_FILE_ATTRIBUTES && (attributes & FILE_ATTRIBUTE_DIRECTORY);
                  results.push_back({directory ? ResultKind::Folder : ResultKind::File,
                                     std::move(title), fullPath, fullPath,
                                     500.0 - static_cast<double>(i)});
              }
              return results;
          }

          ''' + anchor
          if 'GozSearch::QuerySync(' not in s:
              if anchor not in s: raise SystemExit('GozSearch cpp anchor missing')
              s = s.replace(anchor, impl, 1)
              cpp.write_text(s, encoding='utf-8', newline='\n')

      - name: Add L3 app/file search and exact open commands
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/native/src/L3Agent.cpp')
          s = p.read_text(encoding='utf-8')
          if '#include "turingdesk/AppSearch.h"' not in s:
              s = s.replace('#include "turingdesk/L3Agent.h"\n', '#include "turingdesk/L3Agent.h"\n#include "turingdesk/AppSearch.h"\n#include "turingdesk/GozSearch.h"\n#include <shellapi.h>\n', 1)

          help_old = 'reply = L"L3 命令：/status、/time、/new。模型和 API Key 请使用右上角 AI 设置；Ctrl+Enter 强制进入 L3。";'
          help_new = 'reply = L"L3 命令：/status、/time、/apps <关键词>、/files <关键词>、/open <应用名>、/open-file <文件名>、/new。模型和 API Key 请使用右上角 AI 设置。";'
          if help_old in s:
              s = s.replace(help_old, help_new, 1)
          elif '/apps <关键词>' not in s:
              raise SystemExit('L3 help anchor missing')

          anchor = '''    if (lower.starts_with(L"/key ")) {
          '''
          tools = r'''    if (lower.starts_with(L"/apps ")) {
              const auto query = Trim(input.substr(6));
              if (query.empty()) {
                  reply = L"用法：/apps <关键词>";
                  return true;
              }
              AppSearch apps;
              apps.BuildIndex();
              const auto results = apps.Query(query, 8);
              if (results.empty()) {
                  reply = L"没有找到匹配的应用。";
                  return true;
              }
              reply = L"应用结果：";
              for (const auto& item : results) reply += L"\r\n- " + item.title;
              return true;
          }
          if (lower.starts_with(L"/files ")) {
              const auto query = Trim(input.substr(7));
              if (query.empty()) {
                  reply = L"用法：/files <关键词>";
                  return true;
              }
              GozSearch files;
              if (!files.Available()) {
                  reply = L"文件索引当前未就绪；应用搜索和其他 L3 本地工具仍可使用。";
                  return true;
              }
              const auto results = files.QuerySync(query, 8);
              if (results.empty()) {
                  reply = L"没有找到匹配的文件或文件夹。";
                  return true;
              }
              reply = L"文件结果：";
              for (const auto& item : results) reply += L"\r\n- " + item.target;
              return true;
          }
          if (lower.starts_with(L"/open ")) {
              const auto query = Trim(input.substr(6));
              if (query.empty()) {
                  reply = L"用法：/open <应用名>";
                  return true;
              }
              AppSearch apps;
              apps.BuildIndex();
              const auto results = apps.Query(query, 12);
              std::vector<SearchResult> exact;
              const auto expected = Lower(query);
              for (const auto& item : results) {
                  if (Lower(item.title) == expected) exact.push_back(item);
              }
              if (exact.size() != 1) {
                  reply = exact.empty() ? L"没有唯一精确匹配的应用，未执行打开。" : L"存在多个同名应用，未执行打开。请使用更精确名称。";
                  return true;
              }
              const auto targetLower = Lower(fs::path(exact[0].target).filename().wstring());
              if (targetLower == L"cmd.exe" || targetLower == L"powershell.exe" || targetLower == L"pwsh.exe") {
                  reply = L"L3 不启动命令解释器。需要终端或任意命令时请显式进入 L4。";
                  return true;
              }
              const auto launched = reinterpret_cast<INT_PTR>(ShellExecuteW(nullptr, L"open", exact[0].target.c_str(), nullptr, nullptr, SW_SHOWNORMAL));
              reply = launched > 32 ? L"已打开：" + exact[0].title : L"打开失败，ShellExecute 错误=" + std::to_wstring(launched);
              return true;
          }
          if (lower.starts_with(L"/open-file ")) {
              const auto query = Trim(input.substr(11));
              if (query.empty()) {
                  reply = L"用法：/open-file <文件名>";
                  return true;
              }
              GozSearch files;
              if (!files.Available()) {
                  reply = L"文件索引当前未就绪，未执行打开。";
                  return true;
              }
              const auto results = files.QuerySync(query, 20);
              std::vector<SearchResult> exact;
              const auto expected = Lower(query);
              for (const auto& item : results) {
                  if (Lower(item.title) == expected || Lower(item.target) == expected) exact.push_back(item);
              }
              if (exact.size() != 1) {
                  reply = exact.empty() ? L"没有唯一精确匹配的文件，未执行打开。" : L"存在多个同名文件，未执行打开。请使用完整路径。";
                  return true;
              }
              const auto launched = reinterpret_cast<INT_PTR>(ShellExecuteW(nullptr, L"open", exact[0].target.c_str(), nullptr, nullptr, SW_SHOWNORMAL));
              reply = launched > 32 ? L"已打开：" + exact[0].target : L"打开失败，ShellExecute 错误=" + std::to_wstring(launched);
              return true;
          }
'''
          if '/apps <关键词>' in s and 'lower.starts_with(L"/apps ")' not in s:
              if anchor not in s: raise SystemExit('L3 local-tool insertion anchor missing')
              s = s.replace(anchor, tools + anchor, 1)

          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Extend native self-test coverage
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/native/src/main.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''    if (reply.find(L"/status") == std::wstring::npos || reply.find(L"/time") == std::wstring::npos ||
              reply.find(L"/new") == std::wstring::npos || reply.find(L"Ctrl+Enter") == std::wstring::npos) return false;
          '''
          new = '''    if (reply.find(L"/status") == std::wstring::npos || reply.find(L"/time") == std::wstring::npos ||
              reply.find(L"/apps") == std::wstring::npos || reply.find(L"/files") == std::wstring::npos ||
              reply.find(L"/open") == std::wstring::npos || reply.find(L"/open-file") == std::wstring::npos ||
              reply.find(L"/new") == std::wstring::npos) return false;
          '''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'reply.find(L"/apps")' not in s:
              raise SystemExit('L3 help self-test anchor missing')

          anchor = '''    for (const wchar_t* command : {L"/new", L"/new-chat", L"新对话"}) {
          '''
          extra = '''    for (const wchar_t* command : {L"/apps Notepad", L"/files TuringDesk"}) {
              reply.clear();
              consumedSecret = false;
              if (!l3.TryHandleLocal(command, reply, consumedSecret) || reply.empty() || consumedSecret) return false;
          }

          '''
          if '/apps Notepad' not in s:
              if anchor not in s: raise SystemExit('L3 local self-test insertion anchor missing')
              s = s.replace(anchor, extra + anchor, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Verify canonical L3 boundary
        shell: pwsh
        run: ./scripts/verify-l3-runtime-contract.ps1

      - name: Guard local tool command surface
        shell: bash
        run: |
          grep -F 'lower.starts_with(L"/apps ")' src/native/src/L3Agent.cpp
          grep -F 'lower.starts_with(L"/files ")' src/native/src/L3Agent.cpp
          grep -F 'lower.starts_with(L"/open ")' src/native/src/L3Agent.cpp
          grep -F 'lower.starts_with(L"/open-file ")' src/native/src/L3Agent.cpp
          grep -F 'QuerySync' src/native/src/GozSearch.cpp
          grep -F '/apps Notepad' src/native/src/main.cpp

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/add-l3-local-search-tools.yml
          git config user.name 'GoodLoongStudio'
          git config user.email 'chnmlong@hotmail.com'
          git add -A
          git commit -m 'feat: add required native L3 search tools'
          git pull --rebase origin main
          git push origin HEAD:main
