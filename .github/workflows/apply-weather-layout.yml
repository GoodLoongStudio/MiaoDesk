name: Apply weather widget layout fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-weather-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply weather layout patch
        run: python .github/patch-weather-layout.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- src/native/include/turingdesk/NativeWidgetPainter.h
      - name: Commit weather layout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/include/turingdesk/NativeWidgetPainter.h
          git commit -m "Fix adaptive weather widget layout"
          git push origin HEAD:main
