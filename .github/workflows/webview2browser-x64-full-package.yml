name: MiaoDesk x64 Full Runtime Package

on:
  push:
    branches:
      - build/webview2browser-x64-full
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miaodesk-x64-full-runtime-package
  cancel-in-progress: true

env:
  TEST_VERSION: 0.1.0.${{ github.run_number }}
  TEST_PUBLISHER: CN=GoodLoongStudio
  TEST_PACKAGE_NAME: GoodLoongStudio.MiaoMiao

jobs:
  x64-full:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Verify exact head and real wallpaper assets
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Checkout SHA mismatch: actual=$actual event=$env:GITHUB_SHA" }
          foreach ($relative in @(
            'assets\wallpapers\MiaoCloud.mdwall\manifest.json',
            'assets\wallpapers\MiaoCloud.mdwall\scene.ini',
            'assets\wallpapers\MiaoCloud.mdwall\assets\background.jpg',
            'assets\wallpapers\MiaoCloud.mdwall\assets\cat.png',
            'assets\wallpapers\NeonCity.mdwall\manifest.json',
            'assets\wallpapers\NeonCity.mdwall\scene.ini',
            'assets\wallpapers\MysticMoon.mdwall\manifest.json',
            'assets\wallpapers\MysticMoon.mdwall\scene.ini'
          )) {
            if (-not (Test-Path (Join-Path $PWD $relative) -PathType Leaf)) { throw "Missing wallpaper asset: $relative" }
          }
          foreach ($relative in @(
            'assets\wallpapers\MiaoCloud.mdwall\assets\background.jpg',
            'assets\wallpapers\MiaoCloud.mdwall\assets\cat.png'
          )) {
            if ((Get-Item (Join-Path $PWD $relative)).Length -lt 1024) { throw "Wallpaper asset is still an LFS pointer: $relative" }
          }

      - name: Configure x64 Release with production contracts
        shell: pwsh
        run: cmake -S . -B build-full-test-x64 -A x64

      - name: Build complete native product
        shell: pwsh
        run: cmake --build build-full-test-x64 --config Release --target MiaoDesk MiaoDeskWallpaper MiaoDeskHarness --parallel

      - name: Stage complete product and offline runtime
        shell: pwsh
        run: |
          .\scripts\stage-full-test-package.ps1 `
            -BuildOutput "$PWD\build-full-test-x64\src\native\Release" `
            -Destination "$PWD\full-test-x64" `
            -Architecture 'x64'

      - name: Add one-click portable launcher
        shell: pwsh
        run: |
          Set-Content -Path "$PWD\full-test-x64\START-MIAODESK.cmd" -Encoding ASCII -Value @(
            '@echo off'
            'cd /d "%~dp0"'
            'start "" MiaoDesk.exe'
          )
          Set-Content -Path "$PWD\full-test-x64\README-X64-FULL.txt" -Encoding UTF8 -Value @(
            'MiaoDesk x64 FULL portable package'
            "Commit: $env:GITHUB_SHA"
            ''
            'Includes:'
            '- MiaoDesk.exe / MiaoDeskWallpaper.exe / MiaoDeskHarness.exe'
            '- Shared portable Node x64 runtime'
            '- DeepSeek Harness production runtime'
            '- Pi Agent production runtime'
            '- goz + gozd x64 file-search runtime'
            '- MiaoCloud / NeonCity / MysticMoon wallpapers'
            ''
            'Run START-MIAODESK.cmd or MiaoDesk.exe.'
          )

      - name: Run staged runtime and native self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $PWD 'full-test-x64'
          Push-Location $dest
          try {
            $node = Join-Path $dest 'Runtime\Node\node.exe'
            $dsh = Join-Path $dest 'Runtime\Node\node_modules\@deepseek-ai\dsh\lib\bin.js'
            $pi = Join-Path $dest 'Pi\node_modules\@earendil-works\pi-coding-agent\dist\cli.js'
            & $node --version | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Node runtime probe failed.' }
            & $node $dsh --help | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'DeepSeek Harness runtime probe failed.' }
            & $node $pi --version | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Pi runtime probe failed.' }
            & .\MiaoDeskHarness.exe --self-test
            if ($LASTEXITCODE -ne 0) { throw "MiaoDeskHarness self-test failed: $LASTEXITCODE" }
            & .\MiaoDeskWallpaper.exe --self-test
            if ($LASTEXITCODE -ne 0) { throw "MiaoDeskWallpaper self-test failed: $LASTEXITCODE" }
            & .\MiaoDesk.exe --self-test
            if ($LASTEXITCODE -ne 0) { throw "MiaoDesk self-test failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Upload complete portable x64 package
        uses: actions/upload-artifact@v4
        with:
          name: MiaoDesk-x64-FULL-${{ github.sha }}
          path: full-test-x64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Build full x64 MSIX
        shell: powershell
        run: |
          .\scripts\build-msix.ps1 `
            -InputDirectory "$PWD\full-test-x64" `
            -Architecture 'x64' `
            -OutputPath "$PWD\miaomiao-full-test-x64.msix" `
            -Version $env:TEST_VERSION `
            -Publisher $env:TEST_PUBLISHER `
            -PackageName $env:TEST_PACKAGE_NAME

      - name: Unpack and verify complete MSIX payload
        shell: pwsh
        run: |
          .\scripts\verify-full-test-msix.ps1 `
            -PackagePath "$PWD\miaomiao-full-test-x64.msix" `
            -Destination "$PWD\unpacked-x64"

      - name: Upload verified x64 MSIX
        uses: actions/upload-artifact@v4
        with:
          name: MiaoDesk-x64-FULL-MSIX-${{ github.sha }}
          path: miaomiao-full-test-x64.msix
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
