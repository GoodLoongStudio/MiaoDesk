        }
        setup.relayRequired = true;
        setup.relayPort = static_cast<unsigned short>(45000 + (GetCurrentProcessId() % 10000));
        setup.baseUrl = L"http://127.0.0.1:" + std::to_wstring(setup.relayPort) + L"/v1";
