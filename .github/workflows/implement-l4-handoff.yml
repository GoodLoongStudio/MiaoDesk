              if (length == 0 || length >= std::size(modulePath)) return {};
              return fs::path(std::wstring(modulePath, length)).parent_path();
          }

          bool CopyTextToClipboard(HWND owner, const std::wstring& text) {
              if (text.empty() || !OpenClipboard(owner)) return false;
              EmptyClipboard();
              const SIZE_T bytes = (text.size() + 1) * sizeof(wchar_t);
              HGLOBAL memory = GlobalAlloc(GMEM_MOVEABLE, bytes);
              if (!memory) { CloseClipboard(); return false; }
              void* raw = GlobalLock(memory);
              if (!raw) { GlobalFree(memory); CloseClipboard(); return false; }
              memcpy(raw, text.c_str(), bytes);
              GlobalUnlock(memory);
              if (!SetClipboardData(CF_UNICODETEXT, memory)) {
                  GlobalFree(memory);
                  CloseClipboard();
                  return false;
              }
              CloseClipboard();
              return true;
          }

