name: Apply native widget stability fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-native-widget-stability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch-native-widget-stability.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- src/native/include/turingdesk/NativeWidgetPainter.h \
                     src/native/src/desktop/widgets/NativeWidgetHost.cpp \
                     src/native/src/desktop/widgets/DesktopWidgetStore.cpp \
                     src/native/src/desktop/widgets/DesktopWidgetController.cpp \
                     src/native/src/ui/wallpaper/WallpaperLibraryWindowV2.cpp
      - name: Commit stability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/include/turingdesk/NativeWidgetPainter.h \
                  src/native/src/desktop/widgets/NativeWidgetHost.cpp \
                  src/native/src/desktop/widgets/DesktopWidgetStore.cpp \
                  src/native/src/desktop/widgets/DesktopWidgetController.cpp \
                  src/native/src/ui/wallpaper/WallpaperLibraryWindowV2.cpp
          git commit -m "Stabilize native widgets and unify previews"
          git push origin HEAD:main
