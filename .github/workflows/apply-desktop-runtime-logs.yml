name: Apply desktop runtime log routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-desktop-runtime-logs.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Route all native runtime logs to Desktop
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'anchor missing in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # L3 route log.
          replace_once(
              'src/native/src/L3CliWindow.cpp',
              '#include "turingdesk/ModelSettingsWindow.h"\n',
              '#include "turingdesk/ModelSettingsWindow.h"\n#include "turingdesk/RuntimeLogPaths.h"\n')
          replace_once(
              'src/native/src/L3CliWindow.cpp',
              '''fs::path RuntimeLogDirectory() {
              wchar_t localAppData[32768]{};
              const DWORD count = GetEnvironmentVariableW(L"LOCALAPPDATA", localAppData, static_cast<DWORD>(std::size(localAppData)));
              fs::path root;
              if (count > 0 && count < std::size(localAppData)) root = fs::path(std::wstring(localAppData, count));
              else root = fs::temp_directory_path();
              std::error_code ec;
              const auto logs = root / L"TuringDesk" / L"Logs";
              fs::create_directories(logs, ec);
              return logs;
          }

          fs::path L3RouteLogPath() {
              return RuntimeLogDirectory() / L"l3-runtime.log";
          }

          fs::path CodexDetailLogPath() {
              return RuntimeLogDirectory() / L"codex-runtime.log";
          }
          ''',
              '''fs::path L3RouteLogPath() {
              return RuntimeLogPath(L"l3-runtime.log");
          }

          fs::path CodexDetailLogPath() {
              return RuntimeLogPath(L"codex-runtime.log");
          }
          ''')

          # Codex + Relay stdout/stderr log.
          replace_once(
              'src/native/src/CodexRuntime.cpp',
              '#include "turingdesk/NativeTools.h"\n',
              '#include "turingdesk/NativeTools.h"\n#include "turingdesk/RuntimeLogPaths.h"\n')
          replace_once(
              'src/native/src/CodexRuntime.cpp',
              '''fs::path CodexLogPath() {
              const auto directory = LocalAppDataRoot() / L"Logs";
              std::error_code ec;
              fs::create_directories(directory, ec);
              return directory / L"codex-runtime.log";
          }
          ''',
              '''fs::path CodexLogPath() {
              return RuntimeLogPath(L"codex-runtime.log");
          }
          ''')

          # DeepSeek Harness stdout/stderr log.
          replace_once(
              'src/native/src/HarnessProcessManager.cpp',
              '#include "turingdesk/HarnessSettingsBridge.h"\n',
              '#include "turingdesk/HarnessSettingsBridge.h"\n#include "turingdesk/RuntimeLogPaths.h"\n')
          replace_once(
              'src/native/src/HarnessProcessManager.cpp',
              '''fs::path LocalAppDataDirectory() {
              wchar_t value[32768]{};
              const DWORD length = GetEnvironmentVariableW(L"LOCALAPPDATA", value, static_cast<DWORD>(std::size(value)));
              if (length > 0 && length < std::size(value)) return fs::path(std::wstring(value, length));

              wchar_t tempPath[32768]{};
              const DWORD tempLength = GetTempPathW(static_cast<DWORD>(std::size(tempPath)), tempPath);
              if (tempLength > 0 && tempLength < std::size(tempPath)) return fs::path(std::wstring(tempPath, tempLength));
              return {};
          }

          fs::path HarnessLogPathFs() {
              const fs::path root = LocalAppDataDirectory();
              if (root.empty()) return {};
              const fs::path directory = root / L"TuringDesk" / L"Logs";
              std::error_code ec;
              fs::create_directories(directory, ec);
              if (ec) return {};
              return directory / L"harness.log";
          }
          ''',
              '''fs::path HarnessLogPathFs() {
              return RuntimeLogPath(L"harness.log");
          }
          ''')

          # Update the mandatory L3 runtime contract.
          p = Path('docs/L3-CODEX-RUNTIME-CONTRACT.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('%LOCALAPPDATA%\\TuringDesk\\Logs\\l3-runtime.log',
                        'Windows Desktop known folder\\TuringDesk-Logs\\l3-runtime.log')
          s = s.replace('%LOCALAPPDATA%\\TuringDesk\\Logs\\codex-runtime.log',
                        'Windows Desktop known folder\\TuringDesk-Logs\\codex-runtime.log')
          marker = '**API Key、Credential 内容、Bearer Token 不得写入日志。**'
          if marker not in s:
              raise SystemExit('L3 contract log marker missing')
          s = s.replace(marker, marker + '\n\n所有 TuringDesk Native 运行日志统一写入 Windows 实际 Desktop Known Folder 下的 `TuringDesk-Logs` 目录；不得重新散落到 `%LOCALAPPDATA%`。', 1)
          p.write_text(s, encoding='utf-8')

          # Extend the compile-time architecture guard.
          p = Path('scripts/verify-l3-runtime-contract.ps1')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "$codexPath = Join-Path $root 'src/native/src/CodexRuntime.cpp'\n",
              "$codexPath = Join-Path $root 'src/native/src/CodexRuntime.cpp'\n$harnessProcessPath = Join-Path $root 'src/native/src/HarnessProcessManager.cpp'\n$runtimeLogPathsHeaderPath = Join-Path $root 'src/native/include/turingdesk/RuntimeLogPaths.h'\n",
              1)
          s = s.replace(
              '$l3Path, $searchPath, $mainPath, $codexPath, $cmakePath, $armWorkflowPath, $x64WorkflowPath,',
              '$l3Path, $searchPath, $mainPath, $codexPath, $harnessProcessPath, $runtimeLogPathsHeaderPath, $cmakePath, $armWorkflowPath, $x64WorkflowPath,',
              1)
          s = s.replace(
              '$codex = Get-Content $codexPath -Raw\n',
              '$codex = Get-Content $codexPath -Raw\n$harnessProcess = Get-Content $harnessProcessPath -Raw\n$runtimeLogPathsHeader = Get-Content $runtimeLogPathsHeaderPath -Raw\n',
              1)
          anchor = '# 4) Cloud build: both x64 and ARM64 must run the same guard before Configure/Build.\n'
          block = '''# 3b) Every native runtime log must resolve through the shared Desktop log path helper.
          foreach ($marker in @(
              'FOLDERID_Desktop',
              'TuringDesk-Logs',
              'RuntimeLogPath'
          )) {
              if (-not $runtimeLogPathsHeader.Contains($marker)) {
                  throw "Desktop runtime log helper marker missing: $marker"
              }
          }
          foreach ($pair in @(
              @{ Text = $l3; Marker = 'RuntimeLogPath(L"l3-runtime.log")' },
              @{ Text = $l3; Marker = 'RuntimeLogPath(L"codex-runtime.log")' },
              @{ Text = $codex; Marker = 'RuntimeLogPath(L"codex-runtime.log")' },
              @{ Text = $harnessProcess; Marker = 'RuntimeLogPath(L"harness.log")' }
          )) {
              if (-not $pair.Text.Contains($pair.Marker)) {
                  throw "Desktop runtime log routing marker missing: $($pair.Marker)"
              }
          }
          foreach ($source in Get-ChildItem (Join-Path $root 'src/native/src') -Filter '*.cpp' -File) {
              $text = Get-Content $source.FullName -Raw
              if ($text.Contains('L"Logs"') -and $text.Contains('.log')) {
                  throw "Runtime log path bypasses shared Desktop helper: $($source.FullName)"
              }
          }

          '''
          if anchor not in s:
              raise SystemExit('guard cloud section anchor missing')
          s = s.replace(anchor, block + anchor, 1)
          p.write_text(s, encoding='utf-8')

          # Add a concise user-facing location note.
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          note = '''\n## Runtime diagnostics\n\nAll native runtime logs are written to the user's actual Windows Desktop known folder:\n\n```text\nDesktop\\TuringDesk-Logs\\l3-runtime.log\nDesktop\\TuringDesk-Logs\\codex-runtime.log\nDesktop\\TuringDesk-Logs\\harness.log\n```\n\nAPI keys and credentials must never be written to these logs.\n'''
          if 'Desktop\\TuringDesk-Logs\\codex-runtime.log' not in s:
              s += note
          p.write_text(s, encoding='utf-8')

      - name: Verify contract
        shell: pwsh
        run: .\scripts\verify-l3-runtime-contract.ps1

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-desktop-runtime-logs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/src/L3CliWindow.cpp src/native/src/CodexRuntime.cpp src/native/src/HarnessProcessManager.cpp src/native/include/turingdesk/RuntimeLogPaths.h docs/L3-CODEX-RUNTIME-CONTRACT.md scripts/verify-l3-runtime-contract.ps1 README.md .github/workflows/apply-desktop-runtime-logs.yml
          git diff --cached --quiet && exit 0
          git commit -m "runtime: route native logs to desktop"
          git push origin HEAD:main
