name: Cleanup merged branches

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete merged same-repository branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          deleted=0
          skipped=0

          mapfile -t merged_heads < <(
            gh api --paginate               -H "Accept: application/vnd.github+json"               "repos/$REPOSITORY/pulls?state=closed&per_page=100"               --jq '.[] |
                select(.merged_at != null) |
                select(.head.repo.full_name == .base.repo.full_name) |
                .head.ref' |
            sort -u
          )

          for branch in "${merged_heads[@]}"; do
            if [[ -z "$branch" || "$branch" == "$DEFAULT_BRANCH" ]]; then
              continue
            fi

            encoded=$(jq -rn --arg value "$branch" '$value | @uri')

            if ! gh api               -H "Accept: application/vnd.github+json"               "repos/$REPOSITORY/git/ref/heads/$encoded" >/dev/null 2>&1; then
              skipped=$((skipped + 1))
              continue
            fi

            gh api --method DELETE               -H "Accept: application/vnd.github+json"               "repos/$REPOSITORY/git/refs/heads/$encoded"

            echo "Deleted merged branch: $branch"
            deleted=$((deleted + 1))
          done

          echo "Cleanup complete: deleted=$deleted skipped_missing=$skipped"
