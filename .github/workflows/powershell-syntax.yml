name: PowerShell Syntax

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**/*.ps1'
      - 'UPDATE-TURINGDESK.cmd'
      - 'DEPLOY-NATIVE-ARM64.cmd'
      - 'docs/TURINGDESK-PRODUCT-BASELINE.md'
      - 'docs/TURINGDESK-NATIVE-TECH-BASELINE.md'
      - 'docs/L3-PI-RUNTIME-CONTRACT.md'
      - '.github/workflows/powershell-syntax.yml'
      - '.github/workflows/native-search-windows.yml'
      - '.github/workflows/native-x64-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powershell-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Verify checkout matches workflow commit
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checkout SHA mismatch: actual=$actual event=$env:GITHUB_SHA"
          }

      - name: Verify current release baselines
        shell: powershell
        run: |
          $required = @(
            'docs/TURINGDESK-PRODUCT-BASELINE.md',
            'docs/TURINGDESK-NATIVE-TECH-BASELINE.md',
            'docs/L3-PI-RUNTIME-CONTRACT.md'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required current release baseline missing: $path"
            }
          }

      - name: Verify Windows PowerShell 5.1 entrypoints
        shell: powershell
        run: .\scripts\verify-windows-powershell-compat.ps1

      - name: Exercise one-click updater bootstrap
        shell: cmd
        env:
          TD_BOOTSTRAP_SELF_TEST: 1
          TD_UPDATE_URL: https://raw.githubusercontent.com/GoodLoongStudio/TuringDesk/${{ github.sha }}/scripts/update-turingdesk-arm64.ps1
        run: UPDATE-TURINGDESK.cmd

      - name: Verify TuringDesk runtime contract
        shell: powershell
        run: .\scripts\verify-l3-runtime-contract.ps1
