name: Fix L3 state pointer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-l3-state-pointer.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix pointer and verify lifecycle anchors
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/native/src/L3CliWindow.cpp')
          s = p.read_text(encoding='utf-8')
          old = 'SetWindowLongPtrW(state->input, GWLP_USERDATA, reinterpret_cast<LONG_PTR>(&state));'
          new = 'SetWindowLongPtrW(state->input, GWLP_USERDATA, reinterpret_cast<LONG_PTR>(state));'
          assert s.count(old) == 1, 'L3 state pointer anchor changed'
          s = s.replace(old, new, 1)
          body = s[s.index('bool ShowL3CliWindow('):]
          assert 'while (IsWindow(window))' not in body
          assert 'GetMessageW(&msg' not in body
          assert 'case WM_NCDESTROY:' in s
          assert 'reinterpret_cast<LONG_PTR>(&state)' not in s
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-l3-state-pointer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/native/src/L3CliWindow.cpp .github/workflows/fix-l3-state-pointer.yml
          git commit -m "fix: keep L3 input state pointer valid"
          git push origin HEAD:main
