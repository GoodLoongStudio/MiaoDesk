            setup.message = L"Codex Runtime 当前需要 API Key";
            return setup;
        }
    }
    setup.signature = (setup.relayRequired ? L"relay\\n" + setup.upstreamBaseUrl : L"direct\\n" + setup.baseUrl) +
                      L"\\n" + setup.model;
    setup.ok = true;
    return setup;
}
