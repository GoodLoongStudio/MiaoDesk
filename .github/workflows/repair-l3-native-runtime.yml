name: Repair ordinary L3 runtime boundary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-l3-native-runtime.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Keep ordinary L3 on TuringDesk native runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/native/src/L3CliWindow.cpp')
          s = p.read_text(encoding='utf-8')

          old = '''ActiveRuntime ChooseRuntime(CliState& state) {
    // Codex CLI is the preferred L3 agent runtime. Direct runtimes are retained
    // only as compatibility fallbacks for providers that do not yet expose the
    // Responses wire protocol required by Codex.
    if (state.codex->CanHandle(*state.agent)) return ActiveRuntime::Codex;
    if (state.directTools->CanHandle(*state.agent)) return ActiveRuntime::DirectTools;
    return ActiveRuntime::DirectModel;
}

std::wstring RuntimeStatusText(CliState& state) {
    const auto status = state.codex->Status(*state.agent);
    const auto selected = ChooseRuntime(state);
    std::wstring text = L"当前路由：" + RuntimeName(state, selected);
    text += L" · " + RuntimeExecutionLabel(selected);
    text += L"\\r\\nCodex CLI：";
    text += status.binaryAvailable ? L"已安装" : L"未安装";
    text += L"\\r\\nProvider → Codex：";
    text += status.providerCompatible ? L"Responses 可直连（默认使用 Codex CLI）" : L"等待 Responses 协议桥";
    text += L"\\r\\nDirect Tools fallback：" + state.directTools->StatusText(*state.agent);
    text += L"\\r\\n" + status.message;
    return text;
}
'''
          new = '''ActiveRuntime ChooseRuntime(CliState& state) {
    // Ordinary L3 is owned by TuringDesk. External agent runtimes belong to L4
    // and must never become an automatic fallback merely because they are installed.
    if (state.directTools->CanHandle(*state.agent)) return ActiveRuntime::DirectTools;
    return ActiveRuntime::DirectModel;
}

std::wstring RuntimeStatusText(CliState& state) {
    const auto selected = ChooseRuntime(state);
    std::wstring text = L"当前路由：" + RuntimeName(state, selected);
    text += L" · " + RuntimeExecutionLabel(selected);
    text += L"\\r\\nL3 外部 Agent/Harness：不参与；复杂任务请交给 L4。";
    text += L"\\r\\nNative Tools：" + state.directTools->StatusText(*state.agent);
    return text;
}
'''
          if old not in s:
              raise SystemExit('ChooseRuntime/RuntimeStatusText anchor changed; refusing unsafe rewrite')
          s = s.replace(old, new, 1)

          old_retry = '''    ActiveRuntime runtime = ChooseRuntime(state);
    if (retry) {
        if (state.lastRuntime == ActiveRuntime::Codex && state.codex->CanHandle(*state.agent)) runtime = ActiveRuntime::Codex;
        else if (state.lastRuntime == ActiveRuntime::DirectTools && state.directTools->CanHandle(*state.agent)) runtime = ActiveRuntime::DirectTools;
        else if (state.lastRuntime == ActiveRuntime::DirectModel) runtime = ActiveRuntime::DirectModel;
    }
'''
          new_retry = '''    ActiveRuntime runtime = ChooseRuntime(state);
    if (retry) {
        if (state.lastRuntime == ActiveRuntime::DirectTools && state.directTools->CanHandle(*state.agent)) runtime = ActiveRuntime::DirectTools;
        else if (state.lastRuntime == ActiveRuntime::DirectModel) runtime = ActiveRuntime::DirectModel;
    }
'''
          if old_retry not in s:
              raise SystemExit('retry runtime anchor changed; refusing unsafe rewrite')
          s = s.replace(old_retry, new_retry, 1)

          old_title = 'L"图灵智能桌面 · Codex CLI Agent"'
          if old_title not in s:
              raise SystemExit('CLI title anchor changed; refusing unsafe rewrite')
          s = s.replace(old_title, 'L"图灵智能桌面 · Native AI Agent"', 1)

          if 'preferred L3 agent runtime' in s or '默认使用 Codex CLI' in s:
              raise SystemExit('Codex-first L3 marker still present')
          p.write_text(s, encoding='utf-8')

      - name: Commit repair and remove one-shot workflow
        shell: bash
        env:
          WORKFLOW: .github/workflows/repair-l3-native-runtime.yml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$WORKFLOW"
          git add src/native/src/L3CliWindow.cpp
          git commit -m "fix: keep ordinary L3 on TuringDesk runtime"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Trigger Windows validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run native-x64-validation.yml --ref main
          gh workflow run native-search-windows.yml --ref main
