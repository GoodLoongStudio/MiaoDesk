name: Verify ARM64 Search Installer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-arm64-search-installer.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Download validated ARM64 full package
        uses: actions/download-artifact@v4
        with:
          name: MiaoDesk-windows-arm64-8c72c1cfd61c0800f4ca2997b492296381b41ff4
          path: C:/pkg/MiaoDesk/arm64
          github-token: ${{ github.token }}
          repository: GoodLoongStudio/MiaoDesk
          run-id: 34436234482

      - name: Build fixed ARM64 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'C:\pkg\MiaoDesk\MiaoDesk-arm64-SearchFix-Setup.exe'
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source
          if (-not $makensis) {
            choco install nsis --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw "Unable to install NSIS: $LASTEXITCODE" }
            $makensis = @(
              (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
              (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')
            ) | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          }
          & $makensis '/DSTAGE_DIR=C:\pkg\MiaoDesk\arm64' "/DOUTPUT_FILE=$out" .\packaging\windows\installer.nsi | Out-Host
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out -PathType Leaf)) { throw 'Fixed installer build failed.' }

      - name: Install and prove real file search
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = 'C:\pkg\MiaoDesk\MiaoDesk-arm64-SearchFix-Setup.exe'
          $root = 'C:\md-search-fix'
          $needle = 'miaodesk-installed-search-smoke-a2d83f.txt'
          $testFile = Join-Path $env:PUBLIC $needle
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Set-Content -LiteralPath $testFile -Value 'installed file search smoke' -Encoding UTF8
          try {
            $p = Start-Process -FilePath $setup -ArgumentList @('/S',"/D=$root") -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
            $goz = Join-Path $root 'Goz\goz.exe'
            if (-not (Test-Path $goz -PathType Leaf)) { throw 'Installed goz.exe missing.' }

            $found = $false
            for ($i = 0; $i -lt 60; $i++) {
              $result = @(& $goz -n 20 $needle 2>&1)
              if ($LASTEXITCODE -eq 0 -and ($result | Where-Object { "$_" -ieq $testFile })) {
                $result | ForEach-Object { Write-Host "SEARCH: $_" }
                $found = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $found) {
              & $goz --status | Out-Host
              throw "Installed file search did not find $testFile"
            }
            Write-Host "INSTALLED FILE SEARCH PASSED: $testFile" -ForegroundColor Green

            $u = Start-Process -FilePath (Join-Path $root 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
            if ($u.ExitCode -ne 0) { throw "Uninstall failed: $($u.ExitCode)" }
          } finally {
            Remove-Item -LiteralPath $testFile -Force -ErrorAction SilentlyContinue
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload fixed ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: MiaoDesk-arm64-SearchFix-Setup
          path: C:/pkg/MiaoDesk/MiaoDesk-arm64-SearchFix-Setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
